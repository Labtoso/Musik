name: Live check

# Runs the server's lookups against the real YouTube Music: finds a few known songs and opens
# their streams. Started by hand or when the lookup code changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/src/yt.rs', 'server/src/ytdl.rs', '.github/workflows/live.yml']

permissions:
  contents: read

jobs:
  live:
    name: YouTube Music
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - working-directory: server
        run: cargo test live -- --ignored --nocapture
