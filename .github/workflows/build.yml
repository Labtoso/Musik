name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release:
    name: Release
    if: needs.version.outputs.release == 'true'
    needs: [version, server, android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          cp deploy/proxmox.sh out/proxmox.sh
          cp deploy/install.sh out/install.sh
          NOTES=".github/releases/v$V.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          gh release create "v$V" out/* --target "$GITHUB_SHA" --title "Musik $V" --notes-file "$NOTES" --latest
