name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['site/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d ' \n\r' < VERSION)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]] && ! gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        working-directory: server
        run: cargo test
      - name: API tests
        working-directory: server
        run: cargo build && node --test tests/api.test.mjs

  server:
    name: Server ${{ matrix.name }}
    needs: test
    strategy:
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-musl, file: musik-server-linux-x64 }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, file: musik-server-linux-arm64 }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, file: musik-server-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        working-directory: server
        run: |
          cargo build --release --target ${{ matrix.target }}
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/musik-server$ext" "../${{ matrix.file }}"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.name }}
          path: ${{ matrix.file }}

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/musik.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/musik.jks" >> "$GITHUB_ENV"
          fi
      # Without a release key in the secrets the app is signed with a key that is kept between builds,
      # so every new APK installs over the last one.
      - name: Signing key kept between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-signing-v1
      - name: Create the signing key once
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Musik, O=Labtoso"
          keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -i fingerprint
      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ needs.version.outputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Musik.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Musik.apk

  desktop:
    name: Desktop ${{ matrix.name }}
    needs: version
    strategy:
      matrix:
        include:
          - { name: windows, os: windows-latest, bundle: nsis, out: Musik.exe }
          - { name: linux, os: ubuntu-22.04, bundle: appimage, out: Musik.AppImage }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build
        shell: bash
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --bundles ${{ matrix.bundle }} --config "{\"version\":\"${{ needs.version.outputs.version }}\"}"
          f=$(find src-tauri/target/release/bundle/${{ matrix.bundle }} -maxdepth 1 \( -name "*.exe" -o -name "*.AppImage" \) | head -n1)
          cp "$f" "../${{ matrix.out }}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.out }}

  release:
    name: Release
    if: needs.version.outputs.release == 'true'
    needs: [version, server, android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          cp deploy/proxmox.sh out/proxmox.sh
          cp deploy/install.sh out/install.sh
          NOTES=".github/releases/v$V.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          gh release create "v$V" out/* --target "$GITHUB_SHA" --title "Musik $V" --notes-file "$NOTES" --latest
