name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['site/**', '**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/musik.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/musik.jks" >> "$GITHUB_ENV"
          fi
      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION_NAME="${GITHUB_REF_NAME#v}"; fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Musik.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Musik.apk

  windows:
    name: Windows setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: desktop
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version; fi
          npm ci
          npx electron-builder --win nsis --x64 --publish never
          cp dist/Musik-Setup.exe ../Musik.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Musik.exe

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: desktop
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version; fi
          npm ci
          npx electron-builder --linux AppImage --x64 --publish never
          cp dist/Musik.AppImage ../Musik.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Musik.AppImage

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, android, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp deploy/proxmox.sh out/proxmox.sh
          NOTES=".github/releases/${GITHUB_REF_NAME}.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          gh release create "$GITHUB_REF_NAME" out/Musik.apk out/Musik.exe out/Musik.AppImage out/proxmox.sh \
            --title "Musik ${GITHUB_REF_NAME#v}" --notes-file "$NOTES" --latest
