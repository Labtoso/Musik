<!doctype html>
<html lang="en">
<head>
<meta name="color-scheme" content="dark">
<style>html,body{background:#111214}</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musik</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #111214; color: #ececee; font: 14px/1.45 'Segoe UI Variable Text', 'Segoe UI', Roboto, system-ui, sans-serif; display: grid; place-items: center; padding: 20px; }
  form { width: 100%; max-width: 380px; background: #1d1f23; border: 1px solid #2c2f35; border-radius: 18px; padding: 26px; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; margin-bottom: 18px; }
  .brand svg { width: 26px; height: 26px; color: #4c8dff; }
  h2 { font-size: 18px; margin: 0 0 14px; }
  label span { display: block; font-size: 12.5px; color: #9a9ca3; margin-bottom: 5px; }
  input { width: 100%; height: 40px; padding: 0 12px; border-radius: 7px; border: 1px solid #2c2f35; background: #111214; color: inherit; font: inherit; outline: none; }
  input:focus { border-color: #4c8dff; }
  p { color: #9a9ca3; font-size: 12.5px; margin: 8px 0 0; }
  .err { color: #e5484d; min-height: 20px; font-size: 13px; }
  button { width: 100%; height: 42px; border: 0; border-radius: 7px; background: #4c8dff; color: #0b1220; font: inherit; font-weight: 600; cursor: pointer; margin-top: 6px; }
  button:disabled { opacity: 0.5; }
  button.ghost { background: transparent; border: 1px solid #2c2f35; color: #ececee; margin-top: 10px; }
  .lang { position: fixed; top: 14px; right: 16px; width: auto; height: auto; margin: 0; padding: 6px 10px; border-radius: 16px; background: transparent; border: 1px solid #2c2f35; color: #9a9ca3; font-size: 12.5px; font-weight: 600; }
</style>
</head>
<body>
<button type="button" class="lang" id="lang"></button>
<form id="f">
  <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17.5V6l10-2v11.5"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="15.5" r="2.5"/></svg>Musik</div>
  <h2 id="h"></h2>
  <label><span id="l"></span><input id="s" placeholder="http://192.168.1.50:8484" autofocus></label>
  <p id="help"></p>
  <p class="err" id="e"></p>
  <button id="b"></button>
  <button type="button" class="ghost" id="off" hidden></button>
  <p id="offhelp" hidden></p>
</form>
<script>
  let saved = '';
  try { saved = (window.MusikAndroid && MusikAndroid.getLang && MusikAndroid.getLang()) || ''; } catch {}
  const de = saved === 'de';
  const langBtn = document.getElementById('lang');
  langBtn.textContent = de ? 'English' : 'Deutsch';
  langBtn.onclick = () => {
    const l = de ? 'en' : 'de';
    try { if (window.MusikAndroid && MusikAndroid.setLang) MusikAndroid.setLang(l); } catch {}
    location.reload();
  };
  const T = de
    ? { h: 'Mit Server verbinden', l: 'Server-Adresse', help: 'Die Adresse zeigt der Server beim Start an, z. B. http://192.168.1.50:8484', b: 'Verbinden', off: 'Offline verwenden', offhelp: 'Spielt die Playlists, die du auf dieses Handy heruntergeladen hast.', offline: 'Server nicht erreichbar. Adresse prüfen.', notmusik: 'Unter dieser Adresse läuft kein Musik-Server.' }
    : { h: 'Connect to server', l: 'Server address', help: 'The server prints its address on start, e.g. http://192.168.1.50:8484', b: 'Connect', off: 'Use offline', offhelp: 'Plays the playlists you downloaded to this phone.', offline: 'Server not reachable. Check the address.', notmusik: 'No Musik server at this address.' };
  document.documentElement.lang = de ? 'de' : 'en';
  for (const k of ['h', 'l', 'help', 'b']) document.getElementById(k).textContent = T[k];
  if (window.MusikAndroid && MusikAndroid.canOffline && MusikAndroid.canOffline()) {
    const off = document.getElementById('off');
    off.hidden = false;
    off.textContent = T.off;
    const oh = document.getElementById('offhelp');
    oh.hidden = false;
    oh.textContent = T.offhelp;
    off.onclick = () => { off.disabled = true; MusikAndroid.useOffline(); };
  }
  const q = new URLSearchParams(location.search);
  const s = document.getElementById('s');
  const e = document.getElementById('e');
  s.value = q.get('server') || '';
  e.textContent = T[q.get('error')] || '';
  document.getElementById('f').onsubmit = async (ev) => {
    ev.preventDefault();
    const b = document.getElementById('b');
    b.disabled = true;
    e.textContent = '';
    const r = await new Promise((res) => { window.onConnectResult = res; window.MusikAndroid.connect(s.value); });
    if (r !== 'ok') {
      e.textContent = T[r] || T.offline;
      b.disabled = false;
    }
  };
</script>
</body>
</html>
