    de: { search: 'Docs durchsuchen', none: 'Nichts gefunden für', onpage: 'Auf dieser Seite', top: 'Nach oben', prev: 'Zurück', next: 'Weiter', copy: 'Kopieren', copied: 'Kopiert', edit: 'Diese Seite auf GitHub bearbeiten', site: 'Website', download: 'Download', menu: 'Menü', find: 'Suchen', stuck: 'Kommst du nicht weiter?', stuckp: 'Frag auf unserem Discord, wir helfen dir dort.' },
  };
  let lang = store('musik.site.lang') === 'de' ? 'de' : 'en';
  const qlang = new URLSearchParams(location.search).get('lang');
  if (qlang === 'de' || qlang === 'en') lang = qlang;
  const pages = () => $$(`template[data-l="${lang}"]`).map((t) => ({ id: t.dataset.p, group: t.dataset.g, title: t.dataset.t, tpl: t }));
  let cur = '', spy = null, index = null, pinned = null;

  const route = () => {
    const [p, ...rest] = location.hash.replace(/^#\/?/, '').split('/');
    const dec = (v) => { try { return decodeURIComponent(v); } catch { return ''; } };
    return { p: dec(p || ''), a: dec(rest.join('/')) };
  };
  const groups = (list) => {
    const out = [];
    list.slice(1).forEach((p) => { let g = out.find((x) => x.name === p.group); if (!g) out.push((g = { name: p.group, items: [] })); g.items.push(p); });
    return out;
  };

  function sidebar() {
    const list = pages();
    let html = `<a class="home${cur === '' ? ' on' : ''}" href="#/">${ico.home}${esc(list[0].title)}</a>`;
    groups(list).forEach((g, i) => {
      html += `<div class="grp"><p><span>0${i + 1}</span>${esc(g.name)}</p><ul>`;
      g.items.forEach((p) => (html += `<li><a href="#/${p.id}"${p.id === cur ? ' class="on" aria-current="page"' : ''}>${esc(p.title)}</a></li>`));
      html += '</ul></div>';
    });
    html += `<a class="help discord-link" href="https://discord.gg/bN2MTKwVaN" target="_blank" rel="noopener"><b>${T[lang].stuck}</b>${T[lang].stuckp}</a>`;
    $('#side').innerHTML = html;
  }

  function enhance(doc) {
    const seen = {};
    $$('h2, h3', doc).forEach((h) => {
      let id = slug(h.textContent) || 'section';
      if (seen[id]) id += '-' + ++seen[id]; else seen[id] = 1;
      h.id = id;
      const a = document.createElement('a');
      a.className = 'hash'; a.href = `#/${cur}/${id}`; a.textContent = '#'; a.setAttribute('aria-hidden', 'true'); a.tabIndex = -1;
      h.prepend(a);
    });
    $$('table', doc).forEach((t) => { const w = document.createElement('div'); w.className = 'tw'; t.replaceWith(w); w.appendChild(t); });
    $$('pre', doc).forEach((pre) => {
      const box = document.createElement('div');
      box.className = 'code';
      box.innerHTML = `<div class="lbl"><span>${esc(pre.dataset.lang || 'text')}</span><button class="copy" type="button">${ico.copy}<span>${T[lang].copy}</span></button></div>`;
      pre.replaceWith(box); box.appendChild(pre);
      const b = $('.copy', box);
      b.addEventListener('click', async () => {
        const text = pre.textContent;
        let ok = false;
        try { await navigator.clipboard.writeText(text); ok = true; } catch {
          const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select(); try { ok = document.execCommand('copy'); } catch {} ta.remove();
        }
        if (!ok) return;
        b.classList.add('ok'); b.innerHTML = `${ico.check}<span>${T[lang].copied}</span>`;
        setTimeout(() => { b.classList.remove('ok'); b.innerHTML = `${ico.copy}<span>${T[lang].copy}</span>`; }, 1600);
      });
    });
    $$('.tabs', doc).forEach((box) => {
      const tabs = $$('[role=tab]', box), panels = $$('[role=tabpanel]', box);
      const pick = (i) => { tabs.forEach((t, j) => { t.setAttribute('aria-selected', i === j); t.tabIndex = i === j ? 0 : -1; }); panels.forEach((p, j) => (p.hidden = i !== j)); };
      tabs.forEach((t, i) => t.addEventListener('click', () => { pick(i); store('musik.docs.tab', i); }));
      tabs.forEach((t, i) => t.addEventListener('keydown', (e) => {
        const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
        if (!d) return;
        e.preventDefault();
        const k = (i + d + tabs.length) % tabs.length;
        pick(k); store('musik.docs.tab', k); tabs[k].focus();
      }));
      pick(Math.min(+store('musik.docs.tab') || 0, tabs.length - 1));
    });
  }

  function render(scroll = true) {
    const list = pages();
    const r = route();
    const i = Math.max(0, list.findIndex((p) => p.id === r.p));
    const page = list[i];
    cur = page.id;
    const gi = groups(list).findIndex((g) => g.name === page.group);
    const doc = $('#doc');
    const eyebrow = page.id ? `<div class="eyebrow"><b>0${gi + 1}</b><span>${esc(page.group)}</span></div>` : '<div class="eyebrow"><b>00</b><span>Streyn Docs</span></div>';
    doc.innerHTML = `${eyebrow}<h1>${page.tpl.dataset.h || esc(page.title)}</h1>`;
    doc.appendChild(page.tpl.content.cloneNode(true));
    const prev = list[i - 1], next = list[i + 1];
    doc.insertAdjacentHTML('beforeend', `
      <div class="meta"><a href="https://github.com/Labtoso/Musik/edit/main/site/docs/index.html">${ico.edit}${T[lang].edit}</a></div>
      <nav class="pn">${prev ? `<a class="prev" href="#/${prev.id}"><small>← ${T[lang].prev}</small>${esc(prev.title)}</a>` : ''}${next ? `<a class="next" href="#/${next.id}"><small>${T[lang].next} →</small>${esc(next.title)}</a>` : ''}</nav>
      <footer class="foot"><a class="word" href="../" aria-label="Streyn"><span class="disc" aria-hidden="true"></span><span class="wm" aria-hidden="true"></span></a><div class="fl"><a class="discord-link" href="https://discord.gg/bN2MTKwVaN" target="_blank" rel="noopener">Discord</a><a href="https://github.com/Labtoso/Musik">GitHub</a><a href="../">${T[lang].site}</a><a href="https://github.com/Labtoso/Musik/releases">Releases</a><a href="https://labtoso.de/impressum" target="_blank" rel="noopener">Impressum</a><span>© LabtosoStudios</span></div></footer>`);
    enhance(doc);
    document.title = page.id ? `${page.title} · Streyn Docs` : 'Streyn Docs';
    sidebar();
    discordLinks();
    toc();
    nav(false);
    if (r.a) { const el = document.getElementById(r.a); if (el) { el.scrollIntoView(); pinned = r.a; spy && spy(); return; } }
    if (scroll) scrollTo(0, 0);
  }

  function toc() {
    const hs = $$('#doc h2, #doc h3');
    const box = $('#toc');
    pinned = null;
    if (hs.length < 2) { box.innerHTML = ''; spy = null; return; }
    box.innerHTML = `<p>${T[lang].onpage}</p>` + hs.map((h) => `<a href="#/${cur}/${h.id}" data-id="${h.id}" class="${h.tagName === 'H3' ? 'h3' : ''}">${esc(h.textContent.replace(/^#/, ''))}</a>`).join('') + `<button class="up" type="button">${ico.up}${T[lang].top}</button>`;
    $('.up', box).addEventListener('click', () => scrollTo({ top: 0, behavior: 'smooth' }));
    const mark = (id) => $$('a', box).forEach((a) => a.classList.toggle('on', a.dataset.id === id));
    spy = () => {
      const line = 64 + 90;
      const atEnd = innerHeight + scrollY >= document.documentElement.scrollHeight - 4;
      const vis = (h) => { const r = h.getBoundingClientRect(); return r.top >= 0 && r.top < innerHeight; };
      let id = hs[0].id;
      hs.forEach((h) => { if (h.getBoundingClientRect().top <= line) id = h.id; });
      if (pinned && hs.some((h) => h.id === pinned && vis(h))) id = pinned;
      else if (atEnd) id = hs[hs.length - 1].id;
      mark(id);
    };
    spy();
  }
  addEventListener('scroll', () => spy && spy(), { passive: true });
  addEventListener('resize', () => spy && spy());
  ['wheel', 'touchstart', 'keydown'].forEach((t) => addEventListener(t, () => { pinned = null; }, { passive: true }));

  // pictures open large on click
  const zoom = document.createElement('div');
  zoom.className = 'zoom';
  zoom.innerHTML = '<img alt=""><p></p>';
  document.body.appendChild(zoom);
  const closeZoom = () => zoom.classList.remove('open');
  zoom.addEventListener('click', closeZoom);
  addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeZoom(); nav(false); } });
  document.addEventListener('click', (e) => {
    const im = e.target.closest('#doc figure.shot img');
    if (!im) return;
    $('img', zoom).src = im.currentSrc || im.src;
    $('p', zoom).textContent = im.alt || '';
    zoom.classList.add('open');
  });

  // in-page anchors scroll without leaving the page route
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href^="#/"]');
    if (!a) return;
    const [, p, ...rest] = a.getAttribute('href').split('/');
    if ((p || '') === cur && rest.length) {
      e.preventDefault();
      history.replaceState(null, '', a.getAttribute('href'));
      pinned = rest.join('/');
      const el = document.getElementById(pinned);
      if (el) { if (el.tagName === 'DETAILS') el.open = true; el.scrollIntoView({ behavior: 'smooth' }); }
      spy && spy();
      nav(false);
    }
  });
  addEventListener('hashchange', () => render());

  // search over every page of the current language
  function buildIndex() {
    index = [];
    pages().forEach((p) => {
      const div = document.createElement('div');
      div.appendChild(p.tpl.content.cloneNode(true));
      $$('td, th, li, p, summary, [role=tab]', div).forEach((x) => x.append(' '));
      let head = '', text = '';
      const push = () => { if (text.trim() || head) index.push({ p: p.id, page: p.title, head, text: text.replace(/\s+/g, ' ').trim() }); };
      [...div.children].forEach((el) => {
        if (el.tagName === 'H2' || el.tagName === 'H3') { push(); head = el.textContent.trim(); text = ''; }
        else text += ' ' + el.textContent;
      });
      push();
    });
  }
  let sel = -1;
  function search() {
    const q = $('#q').value.trim().toLowerCase();
    const box = $('#results');
    if (!q) { box.classList.remove('open'); box.innerHTML = ''; return; }
    if (!index) buildIndex();
    const words = q.split(/\s+/);
    const hits = index.map((e) => {
      const hay = (e.page + ' ' + e.head + ' ' + e.text).toLowerCase();
      if (!words.every((w) => hay.includes(w))) return null;
      let score = 0;
      words.forEach((w) => { if (e.page.toLowerCase().includes(w)) score += 3; if (e.head.toLowerCase().includes(w)) score += 2; });
      return { e, score };
    }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 12);
    sel = hits.length ? 0 : -1;
    const hl = (s) => {
      const low = s.toLowerCase(), on = new Array(s.length).fill(false);
      words.forEach((w) => { if (w.length > 1) for (let k = low.indexOf(w); k !== -1; k = low.indexOf(w, k + 1)) for (let j = k; j < k + w.length && j < s.length; j++) on[j] = true; });
      let out = '', open = false;
      for (let j = 0; j < s.length; j++) { if (on[j] !== open) { out += on[j] ? '<mark>' : '</mark>'; open = on[j]; } out += esc(s[j]); }
      return open ? out + '</mark>' : out;
    };
    const snip = (t) => { const k = t.toLowerCase().indexOf(words[0]); const s = Math.max(0, k - 50); return (s ? '…' : '') + t.slice(s, s + 150); };
    box.innerHTML = hits.length
      ? hits.map(({ e }, i) => `<a href="#/${e.p}${e.head ? '/' + slug(e.head) : ''}" class="${i === 0 ? 'sel' : ''}" role="option"><b>${hl(e.page)}${e.head ? ` <span>› ${hl(e.head)}</span>` : ''}</b><small>${hl(snip(e.text))}</small></a>`).join('')
      : `<div class="none">${T[lang].none} „${esc(q)}“</div>`;
    box.classList.add('open');
  }
  function closeSearch() { $('#results').classList.remove('open'); document.body.classList.remove('find'); }
  const openSearch = (all = true) => { document.body.classList.add('find'); $('#q').focus(); if (all) $('#q').select(); };
  $('#q').addEventListener('input', search);
  $('#q').addEventListener('focus', () => { if ($('#q').value) search(); });
  $('#q').addEventListener('keydown', (e) => {
    const items = $$('#results a');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!items.length) return;
      sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach((a, i) => a.classList.toggle('sel', i === sel));
      items[sel].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter' && items[sel]) {
      e.preventDefault(); location.hash = items[sel].getAttribute('href'); $('#q').value = ''; $('#q').blur(); closeSearch();
    } else if (e.key === 'Escape') { $('#q').value = ''; closeSearch(); $('#q').blur(); }
  });
  $('#results').addEventListener('click', (e) => { if (e.target.closest('a')) { $('#q').value = ''; closeSearch(); } });
  document.addEventListener('click', (e) => { if (!e.target.closest('.search') && !e.target.closest('#sbtn')) closeSearch(); });
  $('#slabel').addEventListener('click', () => openSearch(false));
  $('#sbtn').addEventListener('click', () => openSearch());
  addEventListener('keydown', (e) => {
    const typing = /input|textarea/i.test(document.activeElement?.tagName);
    if ((e.key === 'k' && (e.ctrlKey || e.metaKey)) || (e.key === '/' && !typing)) { e.preventDefault(); openSearch(); }
  });
  if (/Mac|iPhone|iPad/.test(navigator.platform)) $('#kbd').textContent = '⌘ K';

  // menu on small screens
  function nav(open) {
    document.body.classList.toggle('nav', open);
    $('#burger').setAttribute('aria-expanded', open);
  }
  $('#burger').addEventListener('click', () => nav(!document.body.classList.contains('nav')));
  $('#scrim').addEventListener('click', () => nav(false));

  // language, shared with the website
  function setLang(l) {
    lang = l; index = null;
    document.documentElement.lang = l;
    $$('.lang button').forEach((b) => { b.classList.toggle('on', b.dataset.l === l); b.setAttribute('aria-pressed', b.dataset.l === l); });
    $$('[data-t]').forEach((el) => { if (el.tagName !== 'TEMPLATE') el.textContent = T[l][el.dataset.t]; });
    $('#q').placeholder = T[l].search + ' …';
    $('#burger').setAttribute('aria-label', T[l].menu);
    $('#sbtn').setAttribute('aria-label', T[l].find);
  }
  $$('.lang button').forEach((b) => b.addEventListener('click', () => {
    if (b.dataset.l === lang) return;
    store('musik.site.lang', b.dataset.l); setLang(b.dataset.l);
    const u = new URL(location.href), r = route();
    if (u.searchParams.has('lang')) u.searchParams.set('lang', b.dataset.l);
    if (r.a) u.hash = '#/' + r.p;
    history.replaceState(history.state, '', u);
    render(false);
  }));

  // Discord invite from links.json, the same file the website and the apps read
  let discordUrl = '';
  function discordLinks() {
    if (!discordUrl) return;
    $$('a.discord-link').forEach((a) => { a.href = discordUrl; });
  }
  fetch('../links.json?' + Date.now(), { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).then((j) => {
    const u = String(j?.discord || '').trim();
    if (/^https:\/\//.test(u)) { discordUrl = u; discordLinks(); }
  }).catch(() => {});
  // newest version for the download names
  fetch('../version.json?' + Date.now(), { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).then((r) => {
    if (r && r.tag_name) $$('[data-ver]').forEach((el) => (el.textContent = r.tag_name));
  }).catch(() => {});

  // old addresses from the earlier docs
  const old = { start: '', sources: 'spotify', listen: '', player: '', look: '', share: 'public', help: 'connection', config: 'settings', offline: '' };
  const r0 = route();
  if (r0.p in old && !pages().some((p) => p.id === r0.p)) history.replaceState(null, '', '#/' + old[r0.p]);

  setLang(lang);
  render(!location.hash.includes('/', 2));
})();
</script>
</body>
</html>
