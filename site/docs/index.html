<template data-l="de" data-p="away" data-g="Überall hören" data-t="Unterwegs">
<p class="lead">Ohne Extra-Schritte gehen die Apps im WLAN zuhause. Mit Tailscale überall, ohne Portfreigabe und ohne dass etwas offen im Internet steht.</p>
<h2>Einrichten</h2>
<ol class="steps">
  <li>Installer ausführen und <strong>2) With Tailscale</strong> wählen. Bei einem bestehenden Server einfach noch mal ausführen.</li>
  <li>Den angezeigten Link öffnen und bei Tailscale anmelden (kostenlos).</li>
  <li>Fragt der Installer danach, auf <a href="https://login.tailscale.com/admin/dns">login.tailscale.com/admin/dns</a> <strong>Enable HTTPS</strong> klicken und Enter drücken.</li>
  <li>Tailscale-App aufs Handy und mit demselben Konto anmelden.</li>
  <li>Musik einmal zuhause öffnen. Unterwegs wechselt die App von selbst auf die Tailscale-Adresse.</li>
</ol>
<p>Die Adresse steht unter <span class="path">Einstellungen → Unterwegs</span>.</p>
<h2>Ohne Link</h2>
<p>In der Tailscale-Verwaltung unter <strong>Settings → Keys</strong> einen Auth-Key anlegen:</p>
<pre data-lang="bash"><code>TAILSCALE=1 TS_AUTHKEY=tskey-auth-xxxxx bash -c "$(curl -fsSL https://raw.githubusercontent.com/Labtoso/Musik/main/deploy/proxmox.sh)"</code></pre>
<h2>Docker und Windows</h2>
<p>Tailscale auf dem Rechner installieren (<a href="https://tailscale.com/download">tailscale.com/download</a>), dann die Adresse eintragen und den Server neu starten:</p>
<pre data-lang="env"><code>REMOTE_URL=http://100.x.y.z:8484</code></pre>
<div class="callout warn"><svg class="i" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17v.01"/></svg><div><span class="t">Akku-Sparmodus</span><p>Beendet Android Tailscale im Hintergrund, nimm es von der Akku-Optimierung aus.</p></div></div>
</template>

<template data-l="de" data-p="share" data-g="Überall hören" data-t="Teilen und öffentliche Links">
<p class="lead">In einer Playlist auf <strong>Teilen</strong> tippen. Mit öffentlichen Links öffnet sie jeder auf musik.labtoso.de, ohne App und ohne Konto.</p>
<h2>Zwei Arten zu teilen</h2>
<table>
  <thead><tr><th>Teilen als</th><th>Was die andere Person kann</th></tr></thead>
  <tbody>
  <tr><td>Link zum Anhören</td><td>In jedem Browser reinhören, ohne Anmeldung</td></tr>
  <tr><td>Mitwirkende einladen</td><td>Auf der Seite ein Konto anlegen (oder anmelden) und Songs hinzufügen oder entfernen</td></tr>
  </tbody>
</table>
<h2>Öffentliche Links einschalten</h2>
<p>Den Proxmox-Installer noch mal ausführen und bei <strong>Switch on public links?</strong> mit <code>y</code> antworten, oder:</p>
<pre data-lang="bash"><code>PUBLIC=1 bash -c "$(curl -fsSL https://raw.githubusercontent.com/Labtoso/Musik/main/deploy/proxmox.sh)"</code></pre>
<p>Links sehen dann so aus: <code>musik.labtoso.de/s/#…</code>. Die Seite liegt auf der Website, die Musik kommt direkt von deinem Server über Tailscale Funnel. Die Adresse siehst und änderst du unter <span class="path">Einstellungen → Unterwegs → Öffentliche Links</span>. Ausschalten mit <code>PUBLIC=0</code> oder indem du das Feld leerst.</p>
<h3>Docker und Windows</h3>
<p>Der Server hört für öffentliche Links auf Port 8485 (nur auf diesem Rechner). Auf dem Rechner mit Tailscale:</p>
<pre data-lang="bash"><code>tailscale funnel --bg --https=8443 http://127.0.0.1:8485</code></pre>
<p>Dann <code>PUBLIC_URL=https://&lt;name&gt;.&lt;tailnet&gt;.ts.net:8443</code> eintragen und den Server neu starten.</p>
<div class="callout info"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></svg><div><span class="t">Sicher gebaut</span><p>Öffentliche Links nutzen eine eigene Tür (Port 8443). Darüber sind Einrichtung, Updates, Nutzerverwaltung, Scans, Uploads und Admin-Anmeldungen gesperrt. Anmeldungen sind auf 20 pro Minute begrenzt, und eine Einladung reicht für höchstens 25 Konten.</p></div></div>
</template>

<template data-l="de" data-p="offline" data-g="Überall hören" data-t="Offline-Modus">
<p class="lead">Playlists in der Android- oder Desktop-App herunterladen, dann spielen sie auch ohne Server.</p>
<h2>Playlist herunterladen</h2>
<p>Playlist öffnen und auf <strong>Herunterladen</strong> tippen. Noch mal tippen entfernt sie. Eine geladene Playlist folgt Änderungen auf dem Server.</p>
<h2>Ohne Verbindung</h2>
<p>Ist der Server nicht erreichbar, startet die App von selbst offline. Sie sieht aus und funktioniert wie immer, eine Leiste oben hat einen Knopf, um wieder online zu gehen. Auf der Seite für die Server-Adresse gibt es außerdem <strong>Offline nutzen</strong>.</p>
<h2>Speicher verwalten</h2>
<p><span class="path">Einstellungen → Offline</span> zeigt, was auf diesem Gerät liegt und wie groß es ist, und entfernt es.</p>
<div class="callout info"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></svg><div><span class="t">Gut zu wissen</span><p>Gespeichert werden nur Songs, die als Datei auf deinem Server liegen. Der Webplayer im Browser hat keinen Offline-Modus.</p></div></div>
</template>

<template data-l="de" data-p="sources" data-g="Benutzen" data-t="Musik und Quellen">
<p class="lead">Deine eigenen Dateien kommen immer zuerst. Spotify, YouTube und andere sind optional und werden unter <span class="path">Einstellungen → Quellen</span> eingeschaltet.</p>
<h2>Eigene Dateien</h2>
<p>In den Musikordner legen (wird alle 30 Minuten eingelesen, sofort mit <strong>Bibliothek neu einlesen</strong>) oder <span class="path">Einstellungen → Musik hochladen</span>. MP3, FLAC, M4A/AAC, OGG, WAV und WebM gehen. Titel, Künstler, Album, Cover und Songtexte kommen aus den Tags.</p>
<h2>Spotify</h2>
<ol class="steps">
  <li>Auf <a href="https://developer.spotify.com/dashboard">developer.spotify.com</a> eine App anlegen und <strong>Web API</strong> anhaken.</li>
  <li>Diese Redirect URI eintragen: <code>https://musik.labtoso.de/spotify.html</code></li>
  <li>Die Client-ID unter <span class="path">Einstellungen → Quellen → Spotify</span> einfügen und <strong>Mit Spotify verbinden</strong> drücken. Die Verbindung bleibt auf dem Server gespeichert, für alle deine Apps.</li>
</ol>
<p>Spotify-Songs laufen ganz: Namen, Cover und Beschreibungen kommen von Spotify, der Ton wird auf YouTube Music gefunden und über deinen Server gestreamt. Ein YouTube-Schlüssel ist nicht nötig.</p>
<div class="callout warn"><svg class="i" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17v.01"/></svg><div><span class="t">Spotify-Grenzen seit Februar 2026</span><p>Der Besitzer der Entwickler-App braucht Premium, höchstens 5 Nutzer, und Playlist-Inhalte gibt es nur für eigene oder gemeinsame Playlists. Andere Playlists vorher in die eigene Bibliothek kopieren oder als Exportify-CSV importieren.</p></div></div>
<h2>Playlists importieren</h2>
<p><span class="path">Bibliothek → Importiert → Importieren</span>: Link einfügen oder Datei wählen. Songs, die du hast, spielen aus deiner Bibliothek, der Rest über die Quelle. <strong>Als Playlist speichern</strong> macht eine normale Playlist daraus.</p>
<table>
  <thead><tr><th>Quelle</th><th>Import</th></tr></thead>
  <tbody>
  <tr><td>Spotify</td><td>Eigene Playlists, Lieblingssongs, Alben</td></tr>
  <tr><td>YouTube, YouTube Music</td><td>Playlist-Link</td></tr>
  <tr><td>SoundCloud</td><td>Playlist- oder Track-Link</td></tr>
  <tr><td>Deezer</td><td>Playlist- oder Album-Link</td></tr>
  <tr><td>Datei</td><td>CSV (z. B. Exportify), M3U, TXT</td></tr>
  </tbody>
</table>
</template>

<template data-l="de" data-p="listen" data-g="Benutzen" data-t="Mix, Radio und Playlists">
<p class="lead">Je mehr du hörst, desto besser wird der Mix.</p>
<h2>Empfehlungen</h2>
<ul>
  <li><strong>Mix für dich</strong> auf der Startseite, dazu Vorschläge für Songs, Playlists und Künstler aus dem, was du hörst und wem du folgst.</li>
  <li><strong>Radio starten</strong> im Menü eines Songs spielt Ähnliches und setzt die Warteschlange fort.</li>
  <li><strong>Schlaues Mischen</strong> spielt Favoriten öfter und nie zweimal denselben Künstler hintereinander.</li>
</ul>
<p>Ganz gehört zählt positiv, früh übersprungen negativ, ein Like stark positiv. Ältere Signale verblassen mit einer Halbwertszeit von 30 Tagen.</p>
<h2>Bibliothek</h2>
<ul>
  <li><strong>Liken</strong> geht bei jedem Song, auch von Spotify oder YouTube. Sie landen in <strong>Lieblingssongs</strong>.</li>
  <li>Künstlern <strong>folgst</strong> du auf ihrer Seite. Sie erscheinen in Bibliothek → Künstler und auf der Startseite.</li>
  <li><strong>Playlists:</strong> <strong>+</strong> in der Seitenleiste oder <strong>Zu Playlist hinzufügen</strong> im Menü eines Songs. <strong>Details bearbeiten</strong> setzt Bild, Name und Beschreibung. Reihenfolge per Ziehen.</li>
</ul>
<h2>Menüs</h2>
<p>Rechtsklick am Computer, langes Drücken am Handy oder der Knopf <strong>…</strong>. Geht bei Songs, Alben, Künstlern und Playlists.</p>
</template>

<template data-l="de" data-p="player" data-g="Benutzen" data-t="Geräte, Klang und Songtexte">
<p class="lead">Auf den kleinen Player (Handy) oder das Cover (Computer) tippen öffnet den Vollbild-Player mit Songtext, Warteschlange und Visualizer.</p>
<h2>Geräte</h2>
<p><span class="path">Einstellungen → Geräte</span> zeigt, wo die Musik spielt. Kopfhörer oder Bluetooth-Gerät wählen. Optional: Pause beim Trennen, weiterspielen, wenn das Gerät innerhalb von zehn Minuten zurückkommt.</p>
<h2>Equalizer</h2>
<p><span class="path">Einstellungen → Equalizer</span>: 10 Bänder von 31 Hz bis 16 kHz, Vorverstärkung und Presets (Neutral, Mehr Bass, Mehr Höhen, Stimme, Akustik, Elektronisch, Nachts leise). Wirkt auf Songs von deinem Server.</p>
<h2>Visualizer</h2>
<p>Im Vollbild-Player auf <strong>Visualizer</strong> tippen: Balken, Kreis oder Welle in den Farben des Covers. Jeder Tipp schaltet weiter.</p>
<h2>Songtexte</h2>
<p>Aus den Tags der Datei oder von LRCLIB. Synchrone Texte laufen mit, ein Tipp auf eine Zeile springt hin.</p>
<div class="callout info"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></svg><div><span class="t">Android-Berechtigungen</span><p>Android fragt einmal nach „Audio aufnehmen“ für den Visualizer und nach Bluetooth für volle Gerätenamen. Aufgenommen wird nichts.</p></div></div>
</template>

<template data-l="de" data-p="look" data-g="Benutzen" data-t="Designs und Farben">
<p class="lead">Das Aussehen änderst du unter <span class="path">Einstellungen → Allgemein → Design</span> oder im Startassistenten.</p>
<h2>Designs</h2>
<table>
  <thead><tr><th>Design</th><th>So sieht es aus</th></tr></thead>
  <tbody>
  <tr><td>Standard</td><td>Ruhig und dunkel (oder hell). Voreingestellt.</td></tr>
  <tr><td>Liquid Glass</td><td>Milchglas-Flächen, helle Kanten, ein Hintergrund, der in den Farben des Covers treibt.</td></tr>
  <tr><td>Green</td><td>Schwarz mit grünem Akzent, runde Knöpfe, kräftige Schrift. Immer dunkel.</td></tr>
  </tbody>
</table>
<div class="callout tip"><svg class="i" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.9V16h5v-.2c0-.8.4-1.5 1-1.9A6 6 0 0 0 12 3z"/></svg><div><span class="t">Themes +</span><p>Green und weitere Designs erscheinen, sobald du über dem Design-Wähler <strong>Themes +</strong> einschaltest.</p></div></div>
<h2>Weitere Optionen</h2>
<ul>
  <li><strong>Hell oder dunkel</strong> für jedes Design.</li>
  <li><strong>Akzentfarbe:</strong> Blau, Grün, Lila, Orange, Pink, Rot, Türkis oder aus dem Cover.</li>
  <li><strong>Sprache:</strong> Englisch oder Deutsch, bleibt über Updates erhalten.</li>
  <li><strong>Spalten</strong> in Songlisten: Cover, Künstler, Album, Quelle, Länge, Jahr, Genre, hinzugefügt am.</li>
</ul>
</template>

<template data-l="de" data-p="update" data-g="Pflege" data-t="Updates und Sicherung">
<p class="lead"><span class="path">Einstellungen → Updates → Jetzt updaten</span> aktualisiert Server und App. Den Server darf nur ein Admin updaten.</p>
<h2>Von Hand updaten</h2>
<table>
  <thead><tr><th>Was</th><th>Wie</th></tr></thead>
  <tbody>
  <tr><td>Proxmox</td><td>Installer noch mal ausführen</td></tr>
  <tr><td>Debian / Ubuntu</td><td><code>musik-update</code></td></tr>
  <tr><td>Docker</td><td><code>git pull && docker compose up -d --build</code></td></tr>
  <tr><td>Apps</td><td>Neue Version von der Website drüber installieren</td></tr>
  </tbody>
</table>
<div class="callout warn"><svg class="i" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17v.01"/></svg><div><span class="t">Android vor 1.8.0</span><p>Musik einmal deinstallieren und die neue <code>Musik.apk</code> installieren. Ab dann gehen Updates direkt drüber.</p></div></div>
<h2>Sicherung</h2>
<p>Der Datenordner reicht: <code>/var/lib/musik</code> bzw. <code>data/</code>. Darin liegen Datenbank, Cover und hochgeladene Songs. Am einfachsten ist ein Proxmox-Backup des Containers.</p>
</template>

<template data-l="de" data-p="help" data-g="Pflege" data-t="Hilfe und FAQ">
<p class="lead">Die häufigsten Probleme und wie du sie löst.</p>
<h2>Verbindung</h2>
<details class="q"><summary>Die App findet den Server nicht</summary><div><p>Adresse mit Port (<code>:8484</code>) prüfen und ob das Handy im selben WLAN ist. <code>http://ADRESSE:8484/api/info</code> im Browser muss <code>"app":"musik"</code> zeigen. Im Container <code>systemctl status musik</code> ausführen.</p></div></details>
<details class="q"><summary>Unterwegs geht nichts</summary><div><p>Ist Tailscale auf dem Handy an und mit demselben Konto angemeldet? Auf Android von der Akku-Optimierung ausnehmen. Im Container <code>tailscale status</code> ausführen.</p></div></details>
<h2>Musik</h2>
<details class="q"><summary>Neue Songs tauchen nicht auf</summary><div><p>In den Einstellungen <strong>Bibliothek neu einlesen</strong> drücken. Bei einem Host-Ordner prüfen, ob <code>MUSIC_HOST_DIR</code> gesetzt war und lesbar ist.</p></div></details>
<details class="q"><summary>Spotify verbindet sich nicht</summary><div><p>Die Redirect URI im Spotify-Dashboard muss genau <code>https://musik.labtoso.de/spotify.html</code> sein, und dein Spotify-Konto muss als Nutzer der Entwickler-App eingetragen sein.</p></div></details>
<details class="q"><summary>Es läuft die falsche Version eines Songs</summary><div><p>Melde den Song mit Namen in einem GitHub-Issue. Der Server nimmt offizielle Uploads zuerst und überspringt Cover-, Live- und Remix-Versionen.</p></div></details>
<h2>Apps</h2>
<details class="q"><summary>Android installiert das Update nicht</summary><div><p>Versionen vor 1.8.0 hatten einen anderen Schlüssel. Musik einmal deinstallieren und die neue <code>Musik.apk</code> installieren.</p></div></details>
<details class="q"><summary>Wo sind die Logs?</summary><div><pre data-lang="bash"><code>journalctl -u musik -f</code></pre></div></details>
<h2>Hängst du fest?</h2>
<p>Öffne ein <a href="https://github.com/Labtoso/Musik/issues">Issue auf GitHub</a>.</p>
</template>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch {} return v; };
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const slug = (s) => s.toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const ico = {
    chev: '<svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
    right: '<svg class="i" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>',
    copy: '<svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
    check: '<svg class="i" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>',
    home: '<svg class="i" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>',
    list: '<svg class="i" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',
    up: '<svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
    edit: '<svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  };
  const T = {
    en: { search: 'Search', none: 'No results for', onpage: 'On this page', top: 'Back to top', prev: 'Previous', next: 'Next', copy: 'Copy', copied: 'Copied', edit: 'Edit this page on GitHub', docs: 'Docs', download: 'Download', home: 'Welcome' },
    de: { search: 'Suchen', none: 'Keine Treffer für', onpage: 'Auf dieser Seite', top: 'Nach oben', prev: 'Zurück', next: 'Weiter', copy: 'Kopieren', copied: 'Kopiert', edit: 'Diese Seite auf GitHub bearbeiten', docs: 'Docs', download: 'Download', home: 'Willkommen' },
  };
  let lang = store('musik.site.lang') === 'de' ? 'de' : 'en';
  const qlang = new URLSearchParams(location.search).get('lang');
  if (qlang === 'de' || qlang === 'en') lang = qlang;
  const pages = () => $$(`template[data-l="${lang}"]`).map((t) => ({ id: t.dataset.p, group: t.dataset.g, title: t.dataset.t, tpl: t }));
  let cur = '', spy = null, index = null;

  const route = () => {
    const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
    const [p, ...rest] = h.split('/');
    return { p: p || '', a: rest.join('/') };
  };

  function sidebar() {
    const list = pages();
    let html = `<a class="home${cur === '' ? ' on' : ''}" href="#/">${ico.home}${esc(list[0].title)}</a>`;
    const groups = [];
    list.slice(1).forEach((p) => { let g = groups.find((x) => x.name === p.group); if (!g) groups.push((g = { name: p.group, items: [] })); g.items.push(p); });
    const shut = JSON.parse(store('musik.docs.shut') || '[]');
    groups.forEach((g, i) => {
      const closed = shut.includes(i) && !g.items.some((p) => p.id === cur);
      html += `<div class="grp${closed ? ' shut' : ''}" data-i="${i}"><button type="button" aria-expanded="${!closed}">${esc(g.name)}${ico.chev}</button><ul>`;
      g.items.forEach((p) => (html += `<li><a href="#/${p.id}" class="${p.id === cur ? 'on' : ''}">${esc(p.title)}</a></li>`));
      html += '</ul></div>';
    });
    $('#side').innerHTML = html;
    $$('#side .grp > button').forEach((b) => b.addEventListener('click', () => {
      const g = b.parentElement; const c = g.classList.toggle('shut'); b.setAttribute('aria-expanded', !c);
      store('musik.docs.shut', JSON.stringify($$('#side .grp.shut').map((x) => +x.dataset.i)));
    }));
  }

  function enhance(doc) {
    // headings: ids and anchor links
    const seen = {};
    $$('h2, h3', doc).forEach((h) => {
      let id = slug(h.textContent) || 'section';
      if (seen[id]) id += '-' + ++seen[id]; else seen[id] = 1;
      h.id = id;
      const a = document.createElement('a');
      a.className = 'hash'; a.href = `#/${cur}/${id}`; a.textContent = '#'; a.setAttribute('aria-hidden', 'true');
      h.prepend(a);
    });
    // code blocks with a label and a copy button
    $$('pre', doc).forEach((pre) => {
      const box = document.createElement('div');
      box.className = 'code';
      box.innerHTML = `<div class="lbl"><span>${pre.dataset.lang || 'text'}</span><button class="copy" type="button">${ico.copy}<span>${T[lang].copy}</span></button></div>`;
      pre.replaceWith(box); box.appendChild(pre);
      const b = $('.copy', box);
      b.addEventListener('click', async () => {
        const text = pre.textContent;
        let ok = false;
        try { await navigator.clipboard.writeText(text); ok = true; } catch {
          const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select(); try { ok = document.execCommand('copy'); } catch {} ta.remove();
        }
        if (!ok) return;
        b.classList.add('ok'); b.innerHTML = `${ico.check}<span>${T[lang].copied}</span>`;
        setTimeout(() => { b.classList.remove('ok'); b.innerHTML = `${ico.copy}<span>${T[lang].copy}</span>`; }, 1600);
      });
    });
    // tabs, the chosen one is kept
    $$('.tabs', doc).forEach((box) => {
      const tabs = $$('[role=tab]', box), panels = $$('[role=tabpanel]', box);
      const pick = (i) => { tabs.forEach((t, j) => t.setAttribute('aria-selected', i === j)); panels.forEach((p, j) => (p.hidden = i !== j)); };
      tabs.forEach((t, i) => t.addEventListener('click', () => { pick(i); store('musik.docs.tab', i); }));
      pick(Math.min(+store('musik.docs.tab') || 0, tabs.length - 1));
    });
  }

  function render(scroll = true) {
    const list = pages();
    const r = route();
    const i = Math.max(0, list.findIndex((p) => p.id === r.p));
    const page = list[i];
    cur = page.id;
    const doc = $('#doc');
    const crumbs = page.id ? `<nav class="crumbs"><a href="#/">${T[lang].docs}</a>${ico.right}<span>${esc(page.group)}</span>${ico.right}<span>${esc(page.title)}</span></nav>` : '';
    doc.innerHTML = `${crumbs}<h1>${esc(page.title)}</h1>`;
    doc.appendChild(page.tpl.content.cloneNode(true));
    const prev = list[i - 1], next = list[i + 1];
    doc.insertAdjacentHTML('beforeend', `
      <div class="meta"><a href="https://github.com/Labtoso/Musik/edit/main/site/docs/index.html">${ico.edit}${T[lang].edit}</a></div>
      <nav class="pn">${prev ? `<a class="prev" href="#/${prev.id}"><small>← ${T[lang].prev}</small>${esc(prev.title)}</a>` : ''}${next ? `<a class="next" href="#/${next.id}"><small>${T[lang].next} →</small>${esc(next.title)}</a>` : ''}</nav>
      <div class="foot"><span>© LabtosoStudios</span><span><a href="../">musik.labtoso.de</a> · <a href="https://github.com/Labtoso/Musik/releases">Releases</a></span></div>`);
    enhance(doc);
    document.title = page.id ? `${page.title} · Musik Docs` : 'Musik Docs';
    sidebar();
    toc();
    document.body.classList.remove('nav');
    if (r.a) { const el = document.getElementById(r.a); if (el) { el.scrollIntoView(); return; } }
    if (scroll) scrollTo(0, 0);
  }

  function toc() {
    const hs = $$('#doc h2, #doc h3');
    const box = $('#toc');
    spy?.disconnect();
    if (!hs.length) { box.innerHTML = ''; return; }
    box.innerHTML = `<p>${ico.list}${T[lang].onpage}</p>` + hs.map((h) => `<a href="#/${cur}/${h.id}" data-id="${h.id}" class="${h.tagName === 'H3' ? 'h3' : ''}">${esc(h.textContent.replace(/^#/, ''))}</a>`).join('') + `<button class="up" type="button">${ico.up}${T[lang].top}</button>`;
    $('.up', box).addEventListener('click', () => scrollTo({ top: 0, behavior: 'smooth' }));
    const mark = (id) => $$('a', box).forEach((a) => a.classList.toggle('on', a.dataset.id === id));
    spy = new IntersectionObserver((es) => es.forEach((e) => e.isIntersecting && mark(e.target.id)), { rootMargin: '-70px 0px -70% 0px' });
    hs.forEach((h) => spy.observe(h));
    mark(hs[0].id);
  }

  // in-page anchors: scroll without leaving the page route
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href^="#/"]');
    if (!a) return;
    const [, p, ...rest] = a.getAttribute('href').split('/');
    if ((p || '') === cur && rest.length) {
      e.preventDefault();
      history.replaceState(null, '', a.getAttribute('href'));
      document.getElementById(rest.join('/'))?.scrollIntoView({ behavior: 'smooth' });
      document.body.classList.remove('nav');
    }
  });
  addEventListener('hashchange', () => render());

  // search over every page of the current language
  function buildIndex() {
    index = [];
    pages().forEach((p) => {
      const div = document.createElement('div');
      div.appendChild(p.tpl.content.cloneNode(true));
      $$('td, th, li, p, summary, [role=tab], .t', div).forEach((x) => x.append(' '));
      let head = '', text = '';
      const push = () => { if (text.trim() || head) index.push({ p: p.id, page: p.title, head, text: text.replace(/\s+/g, ' ').trim() }); };
      [...div.children].forEach((el) => {
        if (el.tagName === 'H2' || el.tagName === 'H3') { push(); head = el.textContent.trim(); text = ''; }
        else text += ' ' + el.textContent;
      });
      push();
    });
  }
  let sel = -1;
  function search() {
    const q = $('#q').value.trim().toLowerCase();
    const box = $('#results');
    if (!q) { box.classList.remove('open'); box.innerHTML = ''; return; }
    if (!index) buildIndex();
    const words = q.split(/\s+/);
    const hits = index.map((e) => {
      const hay = (e.page + ' ' + e.head + ' ' + e.text).toLowerCase();
      if (!words.every((w) => hay.includes(w))) return null;
      let score = 0;
      words.forEach((w) => { if (e.page.toLowerCase().includes(w)) score += 3; if (e.head.toLowerCase().includes(w)) score += 2; });
      return { e, score };
    }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 12);
    sel = hits.length ? 0 : -1;
    const hl = (s) => { let out = esc(s); words.forEach((w) => { if (w.length > 1) out = out.replace(new RegExp(`(${w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'), '<mark>$1</mark>'); }); return out; };
    const snip = (t) => { const k = t.toLowerCase().indexOf(words[0]); const s = Math.max(0, k - 50); return (s ? '…' : '') + t.slice(s, s + 150); };
    box.innerHTML = hits.length
      ? hits.map(({ e }, i) => `<a href="#/${e.p}${e.head ? '/' + slug(e.head) : ''}" class="${i === 0 ? 'sel' : ''}" role="option"><b>${hl(e.page)}${e.head ? ` <span>› ${hl(e.head)}</span>` : ''}</b><small>${hl(snip(e.text))}</small></a>`).join('')
      : `<div class="none">${T[lang].none} „${esc(q)}“</div>`;
    box.classList.add('open');
  }
  function closeSearch() { $('#results').classList.remove('open'); document.body.classList.remove('find'); }
  $('#q').addEventListener('input', search);
  $('#q').addEventListener('focus', () => { if ($('#q').value) search(); });
  $('#q').addEventListener('keydown', (e) => {
    const items = $$('#results a');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!items.length) return;
      sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach((a, i) => a.classList.toggle('sel', i === sel));
      items[sel].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter' && items[sel]) {
      e.preventDefault(); items[sel].click(); location.hash = items[sel].getAttribute('href'); $('#q').blur(); closeSearch();
    } else if (e.key === 'Escape') { $('#q').value = ''; closeSearch(); $('#q').blur(); }
  });
  $('#results').addEventListener('click', (e) => { if (e.target.closest('a')) { $('#q').value = ''; closeSearch(); } });
  document.addEventListener('click', (e) => { if (!e.target.closest('.search')) closeSearch(); });
  $('#slabel').addEventListener('click', () => { document.body.classList.add('find'); $('#q').focus(); });
  addEventListener('keydown', (e) => {
    const typing = /input|textarea/i.test(document.activeElement?.tagName);
    if ((e.key === 'k' && (e.ctrlKey || e.metaKey)) || (e.key === '/' && !typing)) { e.preventDefault(); document.body.classList.add('find'); $('#q').focus(); $('#q').select(); }
  });
  if (/Mac|iPhone|iPad/.test(navigator.platform)) $('#kbd').textContent = '⌘ K';

  // menu on small screens
  $('#burger').addEventListener('click', () => document.body.classList.toggle('nav'));
  $('#scrim').addEventListener('click', () => document.body.classList.remove('nav'));

  // light or dark
  $('#theme').addEventListener('click', () => {
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const t = dark ? 'light' : 'dark';
    document.documentElement.dataset.theme = t; store('musik.docs.theme', t);
  });

  // language
  function setLang(l) {
    lang = l; index = null;
    document.documentElement.lang = l;
    $$('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.l === l));
    $$('[data-t]').forEach((el) => { if (el.tagName !== 'TEMPLATE') el.textContent = T[l][el.dataset.t]; });
    $('#q').placeholder = T[l].search + ' …';
  }
  $$('.lang button').forEach((b) => b.addEventListener('click', () => {
    if (b.dataset.l === lang) return;
    store('musik.site.lang', b.dataset.l); setLang(b.dataset.l); render(false);
  }));

  fetch('../version.json?' + Date.now(), { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).then((r) => {
    if (r && r.tag_name) { const v = $('#ver'); v.textContent = r.tag_name; v.hidden = false; }
  }).catch(() => {});

  setLang(lang);
  render(!location.hash.includes('/', 2));
})();
</script>
