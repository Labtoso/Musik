<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Streyn Docs</title>
<meta name="description" content="Set up Streyn step by step: install the server, get the apps, the detailed setup and fixes for common problems.">
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="../icon.svg?v=1352" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png?v=1352" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="../apple-touch-icon.png?v=1352">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Schibsted+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
// the accent colour picked on the website, before paint
try { const a = localStorage.getItem('musik.site.accent'); if (a === 'green' || a === 'purple') document.documentElement.dataset.accent = a; } catch {}
</script>
<style>
:root {
  --bg: #0b0b0c; --bg2: #131315; --bg3: #1a1a1d; --line: #222225; --line2: #2e2e33;
  --paper: #ededee; --muted: #a1a1a8; --dim: #6c6c74;
  --accent: #5b84ff; --acc-rgb: 91,132,255; --ink: #060c22;
  --warn: #e8b04a; --bad: #ef6b6b; --ok: #3fbf7f;
  --serif: Fraunces, Georgia, serif; --sans: 'Schibsted Grotesk', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
  --gut: clamp(16px, 4vw, 48px); --side: 272px; --bar: 64px;
  color-scheme: dark;
}
:root[data-accent=green] { --accent: #2fc77c; --acc-rgb: 47,199,124; --ink: #03140b; }
:root[data-accent=purple] { --accent: #9b7bff; --acc-rgb: 155,123,255; --ink: #110a26; }
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--bar) + 20px); }
html, body { margin: 0; overflow-x: clip; }
body { background: var(--bg); color: var(--paper); font: 16.5px/1.65 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
img { max-width: 100%; }
::selection { background: var(--accent); color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ── top bar, the same as on the website ── */
.bar { position: fixed; top: 0; left: 0; right: 0; z-index: 30; height: var(--bar); padding: 0 var(--gut); display: flex; align-items: center; gap: 8px; background: rgba(11,11,12,.92); border-bottom: 1px solid var(--line); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.word { display: inline-flex; align-items: center; gap: 10px; flex: none; }
.disc { width: 30px; height: 30px; flex: none; background: var(--paper); -webkit-mask: url(../logo.svg) center / contain no-repeat; mask: url(../logo.svg) center / contain no-repeat; }
.wm { display: block; height: 24px; aspect-ratio: 5486 / 1990; background: var(--paper); -webkit-mask: url(../wordmark.svg) center / contain no-repeat; mask: url(../wordmark.svg) center / contain no-repeat; }
.dk { font: 500 12.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); padding-left: 12px; margin-left: 2px; border-left: 1px solid var(--line2); line-height: 22px; }
.ver { font: 11.5px var(--mono); color: var(--dim); border: 1px solid var(--line2); border-radius: 6px; padding: 1px 7px; }
.search { position: relative; flex: 1; max-width: 420px; margin: 0 auto 0 28px; }
.search label { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px 0 12px; border-radius: 8px; border: 1px solid var(--line2); background: var(--bg2); color: var(--dim); cursor: text; transition: border-color .2s; }
.search label:hover, .search label:focus-within { border-color: var(--dim); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--paper); font: 14.5px var(--sans); }
.search input::placeholder { color: var(--dim); }
.search input::-webkit-search-cancel-button { display: none; }
.search kbd { font: 11.5px var(--mono); color: var(--dim); border: 1px solid var(--line2); border-radius: 5px; padding: 1px 6px; }
.results { position: absolute; top: calc(100% + 8px); left: 0; right: 0; max-height: min(70vh, 520px); overflow: auto; padding: 6px; border-radius: 12px; background: var(--bg2); border: 1px solid var(--line2); box-shadow: 0 24px 60px -20px #000; display: none; }
.results.open { display: block; }
.results a { display: block; padding: 10px 12px; border-radius: 8px; }
.results a.sel, .results a:hover { background: var(--bg3); }
.results b { display: block; font-weight: 600; font-size: 14.5px; }
.results b span { color: var(--muted); font-weight: 500; }
.results small { display: block; color: var(--muted); font-size: 13px; line-height: 1.5; margin-top: 2px; }
.results mark { background: rgba(var(--acc-rgb), .22); color: var(--paper); border-radius: 3px; }
.results .none { padding: 14px 12px; color: var(--muted); font-size: 14px; }
.links { display: flex; align-items: center; gap: 2px; }
.links > a { padding: 8px 12px; border-radius: 8px; font-size: 14.5px; color: var(--muted); transition: color .2s; }
.links > a:hover { color: var(--paper); }
.links > a.ib { padding: 0; width: 36px; color: var(--paper); }
.ib { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 8px; font-size: 14px; font-weight: 600; border: 1px solid var(--line2); color: var(--paper); flex: none; transition: border-color .2s, background .2s; }
.ib:hover { border-color: var(--dim); }
.ib svg { width: 17px; height: 17px; flex: none; }
.seg { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line2); border-radius: 9px; margin-left: 8px; }
.seg button { height: 28px; padding: 0 10px; border-radius: 6px; font: 500 12.5px var(--mono); color: var(--dim); transition: background .2s, color .2s; }
.seg button.on { background: var(--bg3); color: var(--paper); }
#burger, #sbtn { display: none; width: 36px; padding: 0; }

/* ── side navigation ── */
.side { position: fixed; z-index: 20; top: var(--bar); bottom: 0; left: 0; width: var(--side); overflow-y: auto; padding: 26px 18px 40px var(--gut); border-right: 1px solid var(--line); background: var(--bg); scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
.side .home { display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin: 0 0 18px; border-radius: 8px; font-weight: 600; font-size: 15px; color: var(--muted); }
.side .home:hover { color: var(--paper); }
.side .home.on { color: var(--paper); background: var(--bg2); }
.grp { margin: 0 0 22px; }
.grp p { display: flex; align-items: baseline; gap: 10px; margin: 0 0 8px; padding: 0 10px; font: 500 11.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.grp ul { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--line); margin-left: 10px; }
.grp li a { position: relative; display: block; padding: 6px 12px 6px 16px; font-size: 15px; color: var(--muted); transition: color .15s; }
.grp li a:hover { color: var(--paper); }
.grp li a.on { color: var(--paper); font-weight: 600; }
.grp li a.on::before { content: ''; position: absolute; left: -1px; top: 6px; bottom: 6px; width: 2px; border-radius: 2px; background: var(--accent); }
.side .help { display: block; margin-top: 8px; padding: 14px; border-radius: 10px; border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.side .help b { display: block; color: var(--paper); font-weight: 600; margin-bottom: 2px; }
.side .help:hover { border-color: var(--line2); }
.scrim { position: fixed; inset: 0; z-index: 19; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .25s; }

/* ── page ── */
.page { padding: calc(var(--bar) + 44px) var(--gut) 0 calc(var(--side) + clamp(28px, 5vw, 72px)); }
.inner { display: grid; grid-template-columns: minmax(0, 760px) 220px; gap: 64px; justify-content: start; }
#doc { min-width: 0; }
.eyebrow { display: flex; gap: 12px; align-items: baseline; margin: 0 0 14px; font: 500 12.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.eyebrow b { color: var(--accent); font-weight: 500; }
#doc h1 { margin: 0; font: 500 clamp(36px, 4.4vw, 54px)/1.06 var(--serif); font-variation-settings: 'opsz' 144; letter-spacing: -.025em; }
#doc h1 em { font-style: italic; font-weight: 400; color: var(--muted); }
#doc .lead { margin: 18px 0 8px; color: var(--muted); font-size: 18.5px; line-height: 1.6; max-width: 640px; }
#doc .lead b { color: var(--paper); font-weight: 600; }
#doc h2 { position: relative; margin: 56px 0 16px; padding-top: 26px; border-top: 1px solid var(--line); font: 600 25px/1.25 var(--sans); letter-spacing: -.01em; }
#doc .lead + h2 { margin-top: 40px; }
#doc h3 { position: relative; margin: 34px 0 10px; font: 600 19px/1.3 var(--sans); }
#doc .hash { position: absolute; left: -26px; width: 22px; color: var(--dim); opacity: 0; font-weight: 400; transition: opacity .15s; }
#doc h2:hover .hash, #doc h3:hover .hash { opacity: 1; }
#doc p, #doc li { color: #d0d0d4; }
#doc p { margin: 0 0 16px; }
#doc strong, #doc b { color: var(--paper); font-weight: 600; }
#doc a:not(.card):not(.pc):not(.hash) { color: var(--paper); text-decoration: underline; text-decoration-color: rgba(var(--acc-rgb), .6); text-underline-offset: 3px; transition: text-decoration-color .2s; }
#doc a:not(.card):not(.pc):not(.hash):hover { text-decoration-color: var(--accent); }
#doc ul { padding-left: 20px; margin: 0 0 16px; }
#doc ul li { margin: 6px 0; }
#doc ul li::marker { color: var(--dim); }
code { font: .86em var(--mono); background: var(--bg3); border: 1px solid var(--line); padding: 1px 6px; border-radius: 5px; color: var(--paper); overflow-wrap: anywhere; }
.path { font-weight: 600; color: var(--paper); white-space: nowrap; }
kbd { font: 12.5px var(--mono); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 5px; padding: 0 6px; color: var(--paper); }

/* numbered steps */
ol.steps { list-style: none; counter-reset: s; margin: 8px 0 24px; padding: 0; }
ol.steps > li { position: relative; counter-increment: s; padding: 0 0 22px 50px; margin: 0; }
ol.steps > li::before { content: counter(s); position: absolute; left: 0; top: -1px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 500 13px var(--mono); color: var(--paper); background: var(--bg2); border: 1px solid var(--line2); }
ol.steps > li::after { content: ''; position: absolute; left: 15px; top: 34px; bottom: 4px; width: 1px; background: var(--line); }
ol.steps > li:last-child { padding-bottom: 4px; }
ol.steps > li:last-child::after { display: none; }
ol.steps > li > b:first-child { display: block; color: var(--paper); font-size: 17px; margin-bottom: 2px; }
ol.steps .code { margin: 12px 0 4px; }

/* callouts */
.note { margin: 22px 0; padding: 16px 18px 16px 20px; border-radius: 10px; background: var(--bg2); border: 1px solid var(--line); border-left: 3px solid var(--accent); }
.note.warn { border-left-color: var(--warn); }
.note.bad { border-left-color: var(--bad); }
.note.ok { border-left-color: var(--ok); }
.note > b:first-child { display: block; font: 500 11.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
.note.warn > b:first-child { color: var(--warn); }
.note.bad > b:first-child { color: var(--bad); }
.note.ok > b:first-child { color: var(--ok); }
#doc .note p { margin: 0; color: var(--muted); }
#doc .note p + p { margin-top: 8px; }

/* code */
.code { margin: 16px 0 22px; border-radius: 10px; border: 1px solid var(--line2); background: var(--bg2); overflow: hidden; }
.code .lbl { display: flex; justify-content: space-between; align-items: center; height: 38px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--line); font: 500 11.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.copy { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px; font: 500 12px var(--sans); color: var(--muted); letter-spacing: 0; text-transform: none; }
.copy:hover { color: var(--paper); background: var(--bg3); }
.copy.ok { color: var(--ok); }
.copy .i { width: 15px; height: 15px; }
pre { margin: 0; padding: 16px; overflow-x: auto; font: 13.5px/1.65 var(--mono); color: var(--paper); }
pre code { background: none; border: 0; padding: 0; font-size: inherit; overflow-wrap: normal; }

/* tables */
.tw { overflow-x: auto; margin: 14px 0 24px; border-top: 1px solid var(--line2); }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; font: 500 11.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); padding: 12px 16px 10px 0; border-bottom: 1px solid var(--line); }
td { padding: 12px 16px 12px 0; border-bottom: 1px solid var(--line); vertical-align: top; color: #d0d0d4; }
td:first-child { color: var(--paper); font-weight: 600; white-space: nowrap; }

/* tabs */
.tabs { margin: 16px 0 24px; }
.tabs [role=tablist] { display: flex; flex-wrap: wrap; gap: 2px; padding: 3px; border: 1px solid var(--line2); border-radius: 10px; width: fit-content; max-width: 100%; }
.tabs [role=tab] { height: 34px; padding: 0 14px; border-radius: 7px; font-size: 14.5px; color: var(--muted); transition: background .2s, color .2s; }
.tabs [role=tab][aria-selected=true] { background: var(--bg3); color: var(--paper); }
.tabs [role=tabpanel] { padding-top: 16px; }

/* problem / fix blocks */
details.fix { border-bottom: 1px solid var(--line); }
details.fix:first-of-type { border-top: 1px solid var(--line2); }
details.fix summary { list-style: none; display: flex; align-items: center; gap: 14px; padding: 16px 0; cursor: pointer; font-weight: 600; font-size: 16.5px; }
details.fix summary::-webkit-details-marker { display: none; }
details.fix summary::after { content: '+'; margin-left: auto; font: 400 20px var(--mono); color: var(--dim); transition: transform .2s; }
details.fix[open] summary::after { transform: rotate(45deg); }
details.fix summary .tag { font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--dim); border: 1px solid var(--line2); border-radius: 5px; padding: 1px 6px; font-weight: 500; }
details.fix > div { padding: 0 0 18px; }
details.fix > div > p:last-child { margin-bottom: 0; }

/* start page: the path and the cards */
.path3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line2); margin: 34px 0 8px; }
.pc { display: flex; flex-direction: column; padding: 24px 24px 22px 0; transition: background .2s; }
.pc + .pc { padding-left: 24px; border-left: 1px solid var(--line); }
.pc .n { font: 500 12px var(--mono); color: var(--dim); }
.pc b { margin: 10px 0 6px; font: 600 21px/1.2 var(--sans); color: var(--paper); }
.pc span { color: var(--muted); font-size: 15px; }
.pc i { margin-top: auto; padding-top: 16px; font: normal 500 13px var(--mono); color: var(--dim); transition: color .2s; }
.pc:hover i { color: var(--accent); }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 16px 0 24px; }
.card { display: block; padding: 18px 20px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg2); transition: border-color .2s, transform .2s; }
.card:hover { border-color: var(--line2); transform: translateY(-2px); }
.card b { display: block; font-size: 16px; margin-bottom: 3px; }
.card span { display: block; color: var(--muted); font-size: 14.5px; line-height: 1.5; }
.card small { display: block; margin-top: 12px; font: 500 11.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }

/* figures */
.fig { margin: 22px 0 26px; padding: 22px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg2); }
.fig svg { display: block; width: 100%; height: auto; overflow: visible; }
.fig svg.tall { display: none; max-width: 420px; margin: 0 auto; }
.fig .nd { fill: var(--bg); stroke: var(--line2); stroke-width: 1.2; }
.fig .nd.acc { fill: rgba(var(--acc-rgb), .1); stroke: var(--accent); stroke-width: 1.4; }
.fig .tx { fill: var(--paper); font-family: var(--sans); font-weight: 600; }
.fig .sx { fill: var(--muted); font: 400 12px var(--sans); }
.fig .tg { fill: var(--accent); font: 500 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.fig .lb { fill: var(--dim); font: 500 11px var(--mono); }
.fig .ln { stroke: var(--dim); stroke-width: 1.3; fill: none; }
.fig .ln.acc { stroke: var(--accent); }
.fig .ln.dash { stroke-dasharray: 5 4; }
.fig .ah { fill: var(--dim); }
figure.shot { margin: 20px 0 24px; }
figure.shot img { display: block; width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--line2); background: var(--bg2); cursor: zoom-in; }
figure.shot.phone { max-width: 300px; }
figure.shot figcaption { margin-top: 10px; font-size: 14px; color: var(--dim); }
.zoom { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 24px; background: rgba(5,5,6,.9); opacity: 0; pointer-events: none; transition: opacity .2s; cursor: zoom-out; }
.zoom.open { opacity: 1; pointer-events: auto; }
.zoom img { max-width: 100%; max-height: 100%; border-radius: 10px; }
.zoom p { position: absolute; left: 0; right: 0; bottom: 14px; margin: 0; text-align: center; color: var(--muted); font-size: 13.5px; }

/* end of a page */
.meta { margin: 56px 0 18px; font-size: 14px; }
.meta a { display: inline-flex; align-items: center; gap: 8px; color: var(--dim); }
.meta a:hover { color: var(--paper); }
.meta .i { width: 15px; height: 15px; }
.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pn a { display: block; padding: 16px 18px; border-radius: 12px; border: 1px solid var(--line); font-weight: 600; transition: border-color .2s; }
.pn a:hover { border-color: var(--accent); }
.pn small { display: block; font: 500 11.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin-bottom: 4px; }
.pn .next { grid-column: 2; text-align: right; }
/* the website's footer, also under every docs page */
.foot { display: flex; justify-content: space-between; align-items: center; gap: 22px; flex-wrap: wrap; margin-top: 56px; padding: 32px 0 44px; border-top: 1px solid var(--line); }
.foot .fl { display: flex; gap: 8px 24px; flex-wrap: wrap; font-size: 14px; color: var(--dim); }
.foot .fl a:hover { color: var(--paper); }
.foot .word .wm { height: 22px; background: var(--dim); }
.foot .word .disc { width: 26px; height: 26px; background: var(--dim); }

/* on this page */
.toc { position: sticky; top: calc(var(--bar) + 44px); align-self: start; max-height: calc(100vh - var(--bar) - 64px); overflow-y: auto; font-size: 14px; }
.toc p { margin: 0 0 10px; font: 500 11.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.toc a { display: block; padding: 4px 0 4px 14px; border-left: 1px solid var(--line); color: var(--muted); transition: color .15s, border-color .15s; }
.toc a.h3 { padding-left: 26px; font-size: 13.5px; }
.toc a:hover { color: var(--paper); }
.toc a.on { color: var(--paper); border-left-color: var(--accent); }
.toc .up { display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; font-size: 13px; color: var(--dim); }
.toc .up:hover { color: var(--paper); }
.toc .up .i { width: 14px; height: 14px; }

@media (max-width: 1240px) { .inner { grid-template-columns: minmax(0, 760px); } .toc { display: none; } }
@media (max-width: 1020px) {
  .links > a:not(.ib) { display: none; }
  #burger { display: inline-flex; }
  .side { visibility: hidden; transform: translateX(-102%); transition: transform .3s cubic-bezier(.2,.8,.2,1), visibility .3s; width: min(300px, 86vw); padding-left: 20px; }
  body.nav .side { visibility: visible; transform: none; }
  body.nav .scrim { opacity: 1; pointer-events: auto; }
  .page { padding-left: var(--gut); }
}
@media (max-width: 720px) {
  .search { display: none; margin: 0; }
  #sbtn { display: inline-flex; margin-left: auto; }
  body.find .search { display: block; position: fixed; top: 12px; left: var(--gut); right: var(--gut); max-width: none; z-index: 40; }
  body.find .search label { height: 40px; background: var(--bg3); }
  .dk { display: none; }
  .path3 { grid-template-columns: 1fr; }
  .pc { padding: 20px 0; }
  .pc + .pc { padding-left: 0; border-left: 0; border-top: 1px solid var(--line); }
  .cards { grid-template-columns: 1fr; }
  .fig svg.wide { display: none; } .fig svg.tall { display: block; } .fig { padding: 16px 12px; }
  #doc h2 { margin-top: 44px; }
  .pn { grid-template-columns: 1fr; }
  .pn .next { grid-column: 1; }
}
@media (max-width: 480px) { .wm { display: none; } .seg { margin-left: 2px; } .seg button { padding: 0 8px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<template data-l="en" data-p="install" data-g="Set up" data-t="Install the server"><p class="lead">Pick your system and run <b>one command</b>. Running it again later updates the server, your music and settings stay.</p>
<h2>Pick your system</h2>
<div class="tabs"><div role="tablist"><button type="button" role="tab" id="sys-t0" aria-controls="sys-p0">Proxmox</button><button type="button" role="tab" id="sys-t1" aria-controls="sys-p1">Debian / Ubuntu</button><button type="button" role="tab" id="sys-t2" aria-controls="sys-p2">ZimaOS / CasaOS</button><button type="button" role="tab" id="sys-t3" aria-controls="sys-p3">Docker</button><button type="button" role="tab" id="sys-t4" aria-controls="sys-p4">Windows</button></div><div role="tabpanel" id="sys-p0" aria-labelledby="sys-t0"><p>On the Proxmox host: click the node, open <b>Shell</b> and paste:</p><pre data-lang="bash"><code>bash -c "$(curl -fsSL https://raw.githubusercontent.com/Labtoso/Musik/main/deploy/proxmox.sh)"</code></pre><p>It creates a small Debian container (2 cores, 2 GB RAM, 8 GB disk), asks for an optional music folder on the host and whether you want Tailscale for listening on the go, and prints the address at the end.</p><div class="note "><b>Recommended</b><p>Proxmox is the easiest way. Backups and updates are one click. All options: <a href="#/proxmox">Proxmox in detail</a>.</p></div></div><div role="tabpanel" id="sys-p1" aria-labelledby="sys-t1"><pre data-lang="bash"><code>curl -fsSL https://raw.githubusercontent.com/Labtoso/Musik/main/deploy/install.sh | sudo bash</code></pre><p>Installs the <code>streyn</code> service. Options go after <code>bash -s --</code>, for example <code>--music /path</code>, <code>--port 8484</code>, <code>--tailscale</code>.</p></div><div role="tabpanel" id="sys-p2" aria-labelledby="sys-t2"><pre data-lang="bash"><code>curl -fsSL https://raw.githubusercontent.com/Labtoso/Musik/main/deploy/zimaos.sh | bash</code></pre><p>Streyn appears as an app on the dashboard. Put songs into <code>Media/Music</code>.</p></div><div role="tabpanel" id="sys-p3" aria-labelledby="sys-t3"><pre data-lang="bash"><code>git clone https://github.com/Labtoso/Musik.git &amp;&amp; cd Musik &amp;&amp; docker compose up -d --build</code></pre><p>Music goes into <code>music/</code>, the data into <code>data/</code>, port 8484.</p></div><div role="tabpanel" id="sys-p4" aria-labelledby="sys-t4"><p>In PowerShell, in the folder where the server should live:</p><pre data-lang="powershell"><code>try { Invoke-WebRequest https://github.com/Labtoso/Musik/releases/latest/download/streyn-server-windows-x64.exe -OutFile streyn-server.new.exe -ErrorAction Stop; Move-Item -Force streyn-server.new.exe streyn-server.exe -ErrorAction Stop; .\streyn-server.exe } catch { Remove-Item streyn-server.new.exe -ErrorAction Ignore; throw }</code></pre><p>This always fetches the newest server. Run it again to update. It uses your <b>Music</b> folder. For another folder put <code>MUSIC_DIRS=D:\Music</code> into a <code>.env</code> file next to the exe.</p></div></div>
<h2>What you should see</h2>
<p>At the end the installer prints the address of your server, for example:</p>
<pre data-lang="text"><code> Streyn 1.35.0 installed in new container 105.
  Web app:              http://192.168.1.50:8484
  Server address (app): http://192.168.1.50:8484</code></pre>
<p>Open it in a browser. If the setup page appears, the server works. Write the address down, the apps need it.</p>
<div class="note warn"><b>No address or the page does not open?</b><p>See <a href="#/connection">Connection problems</a>.</p></div>
</template>

<template data-l="en" data-p="apps" data-g="Set up" data-t="Get the apps"><p class="lead">Download the app for your device and enter the server address <b>once</b>. The browser works without any download.</p>
<h2>Downloads</h2>
<table><thead><tr><th>Device</th><th>File</th><th>How</th></tr></thead><tbody><tr><td>Android</td><td><code>Streyn.apk</code></td><td>Open it and allow installs from this source. Plays in the background with lock screen controls.</td></tr><tr><td>Windows</td><td><code>Streyn.exe</code></td><td>Run the setup. It installs for your user, without admin rights, and starts Streyn.</td></tr><tr><td>Linux</td><td><code>Streyn.AppImage</code></td><td>Make it executable and start it (see below).</td></tr><tr><td>Browser</td><td>–</td><td>Open the server address, or <b>Web player</b> on the website.</td></tr></tbody></table>
<p>All files are on <a href="../">musik.labtoso.de</a> and in the <a href="https://github.com/Labtoso/Musik/releases/latest">latest release</a>.</p>
<h3>Linux</h3>
<pre data-lang="bash"><code>chmod +x Streyn.AppImage &amp;&amp; ./Streyn.AppImage</code></pre>
<h2>Connect the app</h2>
<ol class="steps"><li><b>Enter the address</b>The app asks for it on the first start, for example <code>192.168.1.50:8484</code>. The <code>http://</code> is optional.</li><li><b>Sign in</b>Use the account you create in the next step, or create it right here.</li><li><b>Done</b>The address is saved. Change it later under <span class="path">Settings → Change server</span>.</li></ol>
<div class="note "><b>Where the Windows app keeps its files</b><p>The program and <code>prefs</code> are in <code>%APPDATA%\\Streyn</code>, offline songs, sign-in and cache in <code>%LOCALAPPDATA%\\Streyn</code>. Remove the app under <span class="path">Settings → Apps → Installed apps</span>.</p></div>
</template>

<template data-l="en" data-p="first" data-g="Set up" data-t="First start"><p class="lead">Create your account, answer a few questions and add your music. Then press play.</p>
<ol class="steps"><li><b>Create the first account</b>Open the server address in a browser or an app. The first account is the <b>admin</b>: it can update the server and invite people.</li><li><b>Answer the setup assistant</b>Language, look, the music and artists you like and how you listen. Every step can be skipped and changed later in Settings.</li><li><b>Add your music</b>Copy songs into the music folder (scanned every 30 minutes, right away with <span class="path">Settings → Rescan library</span>), or upload them under <span class="path">Settings → Upload music</span>. MP3, FLAC, M4A/AAC, OGG, WAV and WebM work.</li><li><b>Play</b>Start <b>Mix for you</b> on the home page. Streyn learns from what you play to the end, skip or like.</li></ol>
<figure class="shot"><img src="../shots/v2/d-home.webp" alt="Streyn home page on the computer" loading="lazy"><figcaption>The home page after the setup assistant</figcaption></figure>
<h2>Where the music folder is</h2>
<table><thead><tr><th>System</th><th>Music folder</th></tr></thead><tbody><tr><td>Proxmox, Debian</td><td><code>/srv/streyn</code>, or your host folder from <code>MUSIC_HOST_DIR</code></td></tr><tr><td>ZimaOS / CasaOS</td><td><code>Media/Music</code></td></tr><tr><td>Docker</td><td><code>music/</code> next to <code>docker-compose.yml</code></td></tr><tr><td>Windows</td><td>your <b>Music</b> folder, or <code>MUSIC_DIRS</code></td></tr></tbody></table>
<div class="note ok"><b>Next</b><p>The basics are done. Want every Spotify song too? <a href="#/spotify">Connect Spotify</a>. Listening away from home? <a href="#/away">On the go</a>.</p></div>
</template>

<template data-l="en" data-p="proxmox" data-g="Detailed setup" data-t="Proxmox in detail"><p class="lead">The installer asks only what it needs. With options you can set everything up front, for example a music folder on your NAS.</p>
<h2>Options</h2>
<p>Put them in front of the command:</p>
<pre data-lang="bash"><code>MUSIC_HOST_DIR=/mnt/pve/nas/music bash -c "$(curl -fsSL https://raw.githubusercontent.com/Labtoso/Musik/main/deploy/proxmox.sh)"</code></pre>
<table><thead><tr><th>Option</th><th>Meaning</th></tr></thead><tbody><tr><td><code>MUSIC_HOST_DIR</code></td><td>Host folder with your music, mounted read-only into the container</td></tr><tr><td><code>CTID</code></td><td>Container number, otherwise the next free one</td></tr><tr><td><code>CT_CORES</code> <code>CT_RAM</code> <code>CT_SWAP</code> <code>CT_DISK</code></td><td>Cores, RAM and swap in MB, disk in GB (2 / 2048 / 2048 / 8)</td></tr><tr><td><code>CT_BRIDGE</code> <code>CT_STORAGE</code></td><td>Network bridge (<code>vmbr0</code>) and storage</td></tr><tr><td><code>TAILSCALE=1</code> / <code>0</code></td><td>Tailscale on or off without asking</td></tr><tr><td><code>TS_AUTHKEY</code></td><td>Tailscale key, so you do not have to open a link</td></tr><tr><td><code>PUBLIC=1</code> / <code>0</code></td><td>Public links on or off</td></tr></tbody></table>
<h2>Useful commands on the host</h2>
<p>Replace <code>ID</code> with the container number the installer printed.</p>
<table><thead><tr><th>What</th><th>Command</th></tr></thead><tbody><tr><td>Logs</td><td><code>pct exec ID -- journalctl -u streyn -f</code></td></tr><tr><td>Settings</td><td><code>pct exec ID -- nano /etc/streyn.env</code></td></tr><tr><td>Restart</td><td><code>pct exec ID -- systemctl restart streyn</code></td></tr><tr><td>Address and version</td><td>Container → <b>Summary → Notes</b> in the Proxmox web UI</td></tr></tbody></table>
<div class="note "><b>A music folder from a NAS</b><p>Mount the share on the Proxmox host first (for example as storage under <code>/mnt/pve/…</code>), then pass that path as <code>MUSIC_HOST_DIR</code>. The container only reads it.</p></div>
</template>

<h2>Set it up</h2>
<ol class="steps"><li><b>Create a Spotify app</b>On <a href="https://developer.spotify.com/dashboard">developer.spotify.com</a> create an app and tick <b>Web API</b>.</li><li><b>Add the redirect URI</b>Exactly this address:<pre data-lang="text"><code>https://musik.labtoso.de/spotify.html</code></pre></li><li><b>Add yourself as a user</b>Under <b>User Management</b> of the Spotify app, add the Spotify account you want to use.</li><li><b>Connect in Streyn</b>Paste the client ID under <span class="path">Settings → Sources → Spotify</span> and press <b>Connect Spotify</b>. The connection is saved on the server for all your apps.</li></ol>
<div class="note warn"><b>Spotify limits since February 2026</b><p>The owner of the developer app needs Premium, at most 5 users are allowed, and Spotify only gives the songs of your own or collaborative playlists. Copy other playlists into your library first, or import an Exportify CSV.</p></div>
<h2>Import playlists</h2>
<p><span class="path">Library → Imported → Import</span>: paste a link or pick a file. Songs you own play from your library, the rest through the source.</p>
<table><thead><tr><th>Source</th><th>What you can import</th></tr></thead><tbody><tr><td>Spotify</td><td>Your playlists, liked songs, albums</td></tr><tr><td>YouTube, YouTube Music</td><td>Playlist link</td></tr><tr><td>SoundCloud</td><td>Playlist or track link</td></tr><tr><td>Deezer</td><td>Playlist or album link</td></tr><tr><td>File</td><td>CSV (e.g. Exportify), M3U, TXT</td></tr></tbody></table>
</template>

g3-3t)"/><path class="ln acc dash" d="M270.5 180V202.0H180.0V222" marker-end="url(#dg3-3t)"/></svg></figure>
<h2>Set it up on Proxmox or Debian</h2>
<ol class="steps"><li><b>Run the installer again</b>Pick <b>2) With Tailscale</b>. Your data stays.</li><li><b>Sign in</b>Open the link it shows and sign in to Tailscale (free).</li><li><b>Switch on HTTPS if asked</b>Click <b>Enable HTTPS</b> on <a href="https://login.tailscale.com/admin/dns">login.tailscale.com/admin/dns</a>, then press Enter in the installer.</li><li><b>Install Tailscale on your phone</b>Sign in with the same account.</li><li><b>Open Streyn once at home</b>From then on it switches to the Tailscale address by itself when you are away.</li></ol>
<p>The address is shown under <span class="path">Settings → On the go</span>.</p>
<h2>Without opening a link</h2>
<p>Create an auth key in the Tailscale admin under <b>Settings → Keys</b>, then:</p>
<pre data-lang="bash"><code>read -rsp "Tailscale auth key: " key; echo
TAILSCALE=1 TS_AUTHKEY="$key" bash -c "$(curl -fsSL https://raw.githubusercontent.com/Labtoso/Musik/main/deploy/proxmox.sh)"
unset key</code></pre>
<h2>Docker and Windows</h2>
<p>Install Tailscale on that computer from <a href="https://tailscale.com/download">tailscale.com/download</a>, then set the address and restart the server. Windows: in the <code>.env</code> next to the server. Docker: remove the <code>#</code> in front of <code>environment:</code> and <code>REMOTE_URL</code> in <code>docker-compose.yml</code>, then run <code>docker compose up -d</code>.</p>
<pre data-lang="env"><code>REMOTE_URL=http://100.x.y.z:8484</code></pre>
<div class="note warn"><b>Android battery saver</b><p>If Android stops Tailscale in the background, exclude the Tailscale app from battery optimisation.</p></div>
</template>

<h2>Switch it on</h2>
<p>Run the Proxmox installer again and answer <code>y</code> to <b>Switch on public links?</b>, or directly:</p>
<pre data-lang="bash"><code>TAILSCALE=1 PUBLIC=1 bash -c "$(curl -fsSL https://raw.githubusercontent.com/Labtoso/Musik/main/deploy/proxmox.sh)"</code></pre>
<p>See or change the address under <span class="path">Settings → On the go → Public links</span>. Switch off with <code>PUBLIC=0</code> or by clearing that field.</p>
<h3>Docker and Windows</h3>
<p>The server listens for public links on port 8485 (this computer only). On the computer with Tailscale:</p>
<pre data-lang="bash"><code>tailscale funnel --bg --https=8443 http://127.0.0.1:8485</code></pre>
<p>Then set <code>PUBLIC_URL=https://&lt;name&gt;.&lt;tailnet&gt;.ts.net:8443</code> the same way (<code>.env</code> on Windows, <code>environment:</code> in <code>docker-compose.yml</code> with Docker) and restart the server.</p>
<h2>Invite people</h2>
<table><thead><tr><th>What</th><th>Where</th></tr></thead><tbody><tr><td>A normal account on your server</td><td><span class="path">Settings → Users → Invite link</span> (works once, for 7 days)</td></tr><tr><td>Someone who edits a playlist</td><td><b>Share → Invite as contributor</b> in the playlist</td></tr><tr><td>Someone who only listens along</td><td><b>Share → Invite as listener</b></td></tr></tbody></table>
<div class="note ok"><b>Safe by design</b><p>Through the public door, setup, updates, user management, scans, uploads and admin sign-ins are closed. Sign-ins are limited to 20 a minute, one invitation makes at most 25 accounts.</p></div>
</template>

<template data-l="en" data-p="settings" data-g="Detailed setup" data-t="Settings file"><p class="lead">The server reads its settings from <code>/etc/streyn.env</code> (container and Debian) or from a <code>.env</code> file next to the server (Windows). With Docker they go under <code>environment:</code> in <code>docker-compose.yml</code>.</p>
<h2>Variables</h2>
<table><thead><tr><th>Variable</th><th>Default</th><th>Meaning</th></tr></thead><tbody><tr><td><code>MUSIC_DIRS</code></td><td>music folder</td><td>Song folders, several separated by <code>:</code> (Windows <code>;</code>)</td></tr><tr><td><code>PORT</code></td><td>8484</td><td>Server port</td></tr><tr><td><code>DATA_DIR</code></td><td><code>data</code></td><td>Database, covers, uploads</td></tr><tr><td><code>SCAN_INTERVAL</code></td><td>30</td><td>Minutes between automatic scans</td></tr><tr><td><code>SERVER_NAME</code></td><td>Streyn</td><td>Name in the apps and on share pages</td></tr><tr><td><code>REMOTE_URL</code></td><td>–</td><td>Address on the go (the installer sets it)</td></tr><tr><td><code>PUBLIC_URL</code></td><td>–</td><td>Address for public links (the installer sets it)</td></tr><tr><td><code>HOST</code></td><td>0.0.0.0</td><td>Address the server listens on</td></tr></tbody></table>
<h2>Apply a change</h2>
<pre data-lang="bash"><code>sudo systemctl restart streyn</code></pre>
<p>Docker: <code>docker compose up -d</code> (creates the container again with the new settings). Windows: close the server window and start <code>streyn-server.exe</code> again.</p>
<h2>Where things are</h2>
<table><thead><tr><th>What</th><th>Container and Debian</th></tr></thead><tbody><tr><td>Settings</td><td><code>/etc/streyn.env</code></td></tr><tr><td>Data</td><td><code>/var/lib/streyn</code></td></tr><tr><td>Backups</td><td><code>/var/lib/streyn/backups</code></td></tr><tr><td>Music</td><td><code>/srv/streyn</code></td></tr><tr><td>Logs</td><td><code>journalctl -u streyn -f</code></td></tr></tbody></table>
</template>

<p>Before every server update the database is copied to <code>/var/lib/streyn/backups</code>. The last 5 copies are kept.</p>
<h2>Update by hand</h2>
<table><thead><tr><th>System</th><th>How</th></tr></thead><tbody><tr><td>Proxmox</td><td>Run the installer again</td></tr><tr><td>Debian / Ubuntu</td><td><code>sudo streyn-update</code></td></tr><tr><td>ZimaOS / CasaOS</td><td>Run the install command again</td></tr><tr><td>Docker</td><td><code>git pull && docker compose up -d --build</code></td></tr><tr><td>Windows</td><td>Run the PowerShell command again</td></tr><tr><td>Apps</td><td>Install the new version over the old one</td></tr></tbody></table>
<h2>Back up</h2>
<p>The data folder is all you need: <code>/var/lib/streyn</code> or <code>data/</code>. It holds the database, covers and uploaded songs. On Proxmox the easiest is a backup of the whole container.</p>
<h2>Restore a backup</h2>
<ol class="steps"><li><b>Stop the server</b><pre data-lang="bash"><code>sudo systemctl stop streyn</code></pre></li><li><b>Pick a copy</b>Every folder in <code>/var/lib/streyn/backups</code> is named after its date and the version before the update.<pre data-lang="bash"><code>ls /var/lib/streyn/backups</code></pre></li><li><b>Copy it back and start</b><pre data-lang="bash"><code>sudo cp -p /var/lib/streyn/backups/FOLDER/streyn.db* /var/lib/streyn/
sudo systemctl start streyn</code></pre></li></ol>
</template>

<template data-l="en" data-p="connection" data-g="Fix problems" data-t="Connection"><p class="lead">The app or the browser cannot reach the server. Go through the checks from top to bottom.</p>
<h2>At home</h2>
<details class="fix"><summary>The app cannot find the server<span class="tag">common</span></summary><div><p>Check the address <b>with the port</b>, for example <code>192.168.1.50:8484</code>, and that the device is on the same Wi-Fi.</p><p>Open this in a browser. It must show <code>"app":"musik"</code> and the version:</p><pre data-lang="url"><code>http://ADDRESS:8484/api/info</code></pre><p>No answer? Check that the server runs:</p><pre data-lang="bash"><code>systemctl status streyn</code></pre><p>On the Proxmox host: <code>pct exec ID -- systemctl status streyn</code>.</p></div></details>
<details class="fix"><summary>The address changed</summary><div><p>The container got a new address from your router. The current address is in Proxmox under container → <b>Summary → Notes</b>, or run the installer again. To keep it fixed, give the container a fixed IP in your router.</p><p>Then change the address in the apps under <span class="path">Settings → Change server</span>.</p></div></details>
<details class="fix"><summary>The app opens in offline mode</summary><div><p>The app could not reach the server and started with your downloaded songs. Fix the connection, then press the button in the bar at the top to go online again.</p></div></details>
<h2>On the go</h2>
<details class="fix"><summary>Nothing works away from home<span class="tag">common</span></summary><div><p>Is Tailscale switched on and signed in with the <b>same account</b> on the phone? On Android exclude Tailscale from battery saving.</p><p>On the server:</p><pre data-lang="bash"><code>tailscale status</code></pre><p>Open Streyn once at home so the app learns the Tailscale address.</p></div></details>
<details class="fix"><summary>Public links do not open</summary><div><p>Check that public links are on under <span class="path">Settings → On the go → Public links</span> and that the funnel runs:</p><pre data-lang="bash"><code>tailscale funnel status</code></pre><p>If it shows nothing, run the installer again with <code>PUBLIC=1</code>.</p></div></details>
</template>

<template data-l="en" data-p="music" data-g="Fix problems" data-t="Music and Spotify"><p class="lead">Songs missing, Spotify not connecting or the wrong version playing.</p>
<h2>Your own music</h2>
<details class="fix"><summary>New songs do not show up<span class="tag">common</span></summary><div><p>Press <span class="path">Settings → Rescan library</span>. Check that the files are in the music folder and in a supported format: MP3, FLAC, M4A/AAC, OGG, WAV, WebM.</p><p>With a host folder on Proxmox, check that <code>MUSIC_HOST_DIR</code> was set and that the folder is readable.</p></div></details>
<details class="fix"><summary>Title, artist or cover are wrong</summary><div><p>Streyn reads them from the tags of the file. Fix the tags (for example with MusicBrainz Picard or Mp3tag), then rescan.</p></div></details>
<h2>Spotify</h2>
<details class="fix"><summary>Spotify does not connect<span class="tag">common</span></summary><div><p>The redirect URI in the Spotify dashboard must be exactly <code>https://musik.labtoso.de/spotify.html</code>, and your Spotify account must be added under <b>User Management</b> of the developer app.</p><p>The owner of the developer app needs Premium.</p></div></details>
<details class="fix"><summary>A Spotify playlist is empty</summary><div><p>Since February 2026 Spotify only gives the songs of your own or collaborative playlists. Copy the playlist into your library on Spotify first, or import an Exportify CSV.</p></div></details>
<details class="fix"><summary>The wrong version of a song plays</summary><div><p>The server prefers official uploads and skips covers, live and remix versions. If it still picks the wrong one, tell us the song in a <a href="https://github.com/Labtoso/Musik/issues">GitHub issue</a>.</p></div></details>
</template>

<template data-l="en" data-p="appfix" data-g="Fix problems" data-t="Apps"><p class="lead">Installing, updating and running the apps.</p>
<h2>Android</h2>
<details class="fix"><summary>Android does not install the app<span class="tag">common</span></summary><div><p>Allow installs from the app you opened the file with (browser or file manager). Android asks for it the first time.</p></div></details>
<details class="fix"><summary>The update does not install</summary><div><p>Versions before 1.8.0 were signed with another key. Uninstall Streyn once and install the new <code>Streyn.apk</code>. Your music and settings stay on the server.</p></div></details>
<details class="fix"><summary>Music stops in the background</summary><div><p>Exclude Streyn from battery optimisation in the Android settings.</p></div></details>
<h2>Windows and Linux</h2>
<details class="fix"><summary>The app starts but shows nothing</summary><div><p>Check the server address under <span class="path">Settings → Change server</span>. Then see <a href="#/connection">Connection</a>.</p></div></details>
<details class="fix"><summary>Start fresh</summary><div><p>Windows: remove Streyn under <span class="path">Settings → Apps → Installed apps</span>, delete <code>%APPDATA%\\Streyn</code> and <code>%LOCALAPPDATA%\\Streyn</code>, install again. Your music and account stay on the server.</p></div></details>
</template>

<template data-l="en" data-p="logs" data-g="Fix problems" data-t="Logs and bug reports"><p class="lead">Found a bug? The log of the server usually shows what went wrong. Send it to us with a few details.</p>
<h2>Read the log</h2>
<table><thead><tr><th>System</th><th>Command</th></tr></thead><tbody><tr><td>Debian, inside the container</td><td><code>journalctl -u streyn -f</code></td></tr><tr><td>Proxmox host</td><td><code>pct exec ID -- journalctl -u streyn -n 200</code></td></tr><tr><td>Docker</td><td><code>docker compose logs -f</code></td></tr><tr><td>Windows</td><td>The server window shows the log</td></tr></tbody></table>
<h2>Report a bug</h2>
<ol class="steps"><li><b>Find the version</b>Open <code>http://ADDRESS:8484/api/info</code>, it shows <code>"version"</code>.</li><li><b>Write down the steps</b>What you did, what you expected and what happened instead.</li><li><b>Copy the log</b>The lines from the moment it went wrong. Remove passwords and keys.</li><li><b>Send it</b>As a <a href="https://github.com/Labtoso/Musik/issues/new">GitHub issue</a> or on our <a class="discord-link" href="https://discord.gg/bN2MTKwVaN">Discord</a>.</li></ol>
<div class="note "><b>Still stuck?</b><p>Come on our <a class="discord-link" href="https://discord.gg/bN2MTKwVaN">Discord</a>, we help you there.</p></div>
</template>

<template data-l="de" data-p="install" data-g="Einrichten" data-t="Server installieren"><p class="lead">Wähl dein System und führ <b>einen Befehl</b> aus. Läuft er später noch einmal, wird der Server aktualisiert, Musik und Einstellungen bleiben.</p>
<h2>Wähl dein System</h2>
<div class="tabs"><div role="tablist"><button type="button" role="tab" id="sys-t0" aria-controls="sys-p0">Proxmox</button><button type="button" role="tab" id="sys-t1" aria-controls="sys-p1">Debian / Ubuntu</button><button type="button" role="tab" id="sys-t2" aria-controls="sys-p2">ZimaOS / CasaOS</button><button type="button" role="tab" id="sys-t3" aria-controls="sys-p3">Docker</button><button type="button" role="tab" id="sys-t4" aria-controls="sys-p4">Windows</button></div><div role="tabpanel" id="sys-p0" aria-labelledby="sys-t0"><p>Auf dem Proxmox-Host: den Node anklicken, <b>Shell</b> öffnen und einfügen:</p><pre data-lang="bash"><code>bash -c "$(curl -fsSL https://raw.githubusercontent.com/Labtoso/Musik/main/deploy/proxmox.sh)"</code></pre><p>Er legt einen kleinen Debian-Container an (2 Kerne, 2 GB RAM, 8 GB Speicher), fragt nach einem optionalen Musikordner auf dem Host und ob du Tailscale für unterwegs willst, und zeigt am Ende die Adresse.</p><div class="note "><b>Empfohlen</b><p>Proxmox ist der einfachste Weg. Backups und Updates gehen mit einem Klick. Alle Optionen: <a href="#/proxmox">Proxmox im Detail</a>.</p></div></div><div role="tabpanel" id="sys-p1" aria-labelledby="sys-t1"><pre data-lang="bash"><code>curl -fsSL https://raw.githubusercontent.com/Labtoso/Musik/main/deploy/install.sh | sudo bash</code></pre><p>Installiert den Dienst <code>streyn</code>. Optionen kommen nach <code>bash -s --</code>, zum Beispiel <code>--music /pfad</code>, <code>--port 8484</code>, <code>--tailscale</code>.</p></div><div role="tabpanel" id="sys-p2" aria-labelledby="sys-t2"><pre data-lang="bash"><code>curl -fsSL https://raw.githubusercontent.com/Labtoso/Musik/main/deploy/zimaos.sh | bash</code></pre><p>Streyn erscheint als App im Dashboard. Songs kommen nach <code>Media/Music</code>.</p></div><div role="tabpanel" id="sys-p3" aria-labelledby="sys-t3"><pre data-lang="bash"><code>git clone https://github.com/Labtoso/Musik.git &amp;&amp; cd Musik &amp;&amp; docker compose up -d --build</code></pre><p>Musik kommt nach <code>music/</code>, die Daten nach <code>data/</code>, Port 8484.</p></div><div role="tabpanel" id="sys-p4" aria-labelledby="sys-t4"><p>In PowerShell, in dem Ordner, in dem der Server liegen soll:</p><pre data-lang="powershell"><code>try { Invoke-WebRequest https://github.com/Labtoso/Musik/releases/latest/download/streyn-server-windows-x64.exe -OutFile streyn-server.new.exe -ErrorAction Stop; Move-Item -Force streyn-server.new.exe streyn-server.exe -ErrorAction Stop; .\streyn-server.exe } catch { Remove-Item streyn-server.new.exe -ErrorAction Ignore; throw }</code></pre><p>Das holt immer den neuesten Server. Nochmal ausführen aktualisiert ihn. Er nutzt deinen Ordner <b>Musik</b>. Für einen anderen Ordner <code>MUSIC_DIRS=D:\Musik</code> in eine Datei <code>.env</code> neben die exe schreiben.</p></div></div>
<h2>Was du sehen solltest</h2>
<p>Am Ende zeigt der Installer die Adresse deines Servers, zum Beispiel:</p>
<pre data-lang="text"><code> Streyn 1.35.0 installed in new container 105.
  Web app:              http://192.168.1.50:8484
  Server address (app): http://192.168.1.50:8484</code></pre>
<p>Öffne sie im Browser. Erscheint die Einrichtungsseite, läuft der Server. Schreib dir die Adresse auf, die Apps brauchen sie.</p>
<div class="note warn"><b>Keine Adresse oder die Seite öffnet sich nicht?</b><p>Siehe <a href="#/connection">Verbindungsprobleme</a>.</p></div>
</template>

<template data-l="de" data-p="apps" data-g="Einrichten" data-t="Apps holen"><p class="lead">Lad die App für dein Gerät und gib die Serveradresse <b>einmal</b> ein. Der Browser geht ohne Download.</p>
<h2>Downloads</h2>
<table><thead><tr><th>Gerät</th><th>Datei</th><th>So geht’s</th></tr></thead><tbody><tr><td>Android</td><td><code>Streyn.apk</code></td><td>Öffnen und Installationen aus dieser Quelle erlauben. Spielt im Hintergrund, mit Steuerung auf dem Sperrbildschirm.</td></tr><tr><td>Windows</td><td><code>Streyn.exe</code></td><td>Setup starten. Es installiert für deinen Benutzer, ohne Admin-Rechte, und startet Streyn.</td></tr><tr><td>Linux</td><td><code>Streyn.AppImage</code></td><td>Ausführbar machen und starten (siehe unten).</td></tr><tr><td>Browser</td><td>–</td><td>Die Serveradresse öffnen, oder <b>Webplayer</b> auf der Website.</td></tr></tbody></table>
<p>Alle Dateien gibt es auf <a href="../">musik.labtoso.de</a> und im <a href="https://github.com/Labtoso/Musik/releases/latest">neuesten Release</a>.</p>
<h3>Linux</h3>
<pre data-lang="bash"><code>chmod +x Streyn.AppImage &amp;&amp; ./Streyn.AppImage</code></pre>
<h2>App verbinden</h2>
<ol class="steps"><li><b>Adresse eingeben</b>Die App fragt beim ersten Start danach, zum Beispiel <code>192.168.1.50:8484</code>. Das <code>http://</code> ist optional.</li><li><b>Anmelden</b>Mit dem Konto, das du im nächsten Schritt anlegst, oder du legst es direkt hier an.</li><li><b>Fertig</b>Die Adresse ist gespeichert. Ändern später unter <span class="path">Einstellungen → Server wechseln</span>.</li></ol>
<div class="note "><b>Wo die Windows-App ihre Dateien hat</b><p>Programm und <code>prefs</code> liegen in <code>%APPDATA%\\Streyn</code>, Offline-Songs, Anmeldung und Cache in <code>%LOCALAPPDATA%\\Streyn</code>. Entfernen unter <span class="path">Einstellungen → Apps → Installierte Apps</span>.</p></div>
</template>

<template data-l="de" data-p="first" data-g="Einrichten" data-t="Erster Start"><p class="lead">Konto anlegen, ein paar Fragen beantworten und deine Musik hinzufügen. Dann auf Play.</p>
<ol class="steps"><li><b>Erstes Konto anlegen</b>Die Serveradresse im Browser oder in einer App öffnen. Das erste Konto ist der <b>Admin</b>: Er kann den Server aktualisieren und Leute einladen.</li><li><b>Einrichtungsassistent beantworten</b>Sprache, Look, die Musik und Künstler*innen, die du magst, und wie du hörst. Jeder Schritt lässt sich überspringen und später in den Einstellungen ändern.</li><li><b>Musik hinzufügen</b>Songs in den Musikordner kopieren (wird alle 30 Minuten gescannt, sofort mit <span class="path">Einstellungen → Bibliothek neu scannen</span>), oder unter <span class="path">Einstellungen → Musik hochladen</span> hochladen. MP3, FLAC, M4A/AAC, OGG, WAV und WebM gehen.</li><li><b>Abspielen</b><b>Mix für dich</b> auf der Startseite starten. Streyn lernt aus dem, was du ganz hörst, überspringst oder likest.</li></ol>
<figure class="shot"><img src="../shots/v2/d-home.webp" alt="Streyn-Startseite am Computer" loading="lazy"><figcaption>Die Startseite nach dem Einrichtungsassistenten</figcaption></figure>
<h2>Wo der Musikordner liegt</h2>
<table><thead><tr><th>System</th><th>Musikordner</th></tr></thead><tbody><tr><td>Proxmox, Debian</td><td><code>/srv/streyn</code>, oder dein Host-Ordner aus <code>MUSIC_HOST_DIR</code></td></tr><tr><td>ZimaOS / CasaOS</td><td><code>Media/Music</code></td></tr><tr><td>Docker</td><td><code>music/</code> neben <code>docker-compose.yml</code></td></tr><tr><td>Windows</td><td>dein Ordner <b>Musik</b>, oder <code>MUSIC_DIRS</code></td></tr></tbody></table>
<div class="note ok"><b>Weiter</b><p>Die Grundlagen sind fertig. Auch jeden Spotify-Song? <a href="#/spotify">Spotify verbinden</a>. Hören außer Haus? <a href="#/away">Unterwegs</a>.</p></div>
</template>

<template data-l="de" data-p="proxmox" data-g="Ausführliche Einrichtung" data-t="Proxmox im Detail"><p class="lead">Der Installer fragt nur, was er braucht. Mit Optionen legst du alles vorher fest, zum Beispiel einen Musikordner auf deinem NAS.</p>
<h2>Optionen</h2>
<p>Sie kommen vor den Befehl:</p>
<pre data-lang="bash"><code>MUSIC_HOST_DIR=/mnt/pve/nas/music bash -c "$(curl -fsSL https://raw.githubusercontent.com/Labtoso/Musik/main/deploy/proxmox.sh)"</code></pre>
<table><thead><tr><th>Option</th><th>Bedeutung</th></tr></thead><tbody><tr><td><code>MUSIC_HOST_DIR</code></td><td>Host-Ordner mit deiner Musik, nur lesend im Container eingebunden</td></tr><tr><td><code>CTID</code></td><td>Container-Nummer, sonst die nächste freie</td></tr><tr><td><code>CT_CORES</code> <code>CT_RAM</code> <code>CT_SWAP</code> <code>CT_DISK</code></td><td>Kerne, RAM und Swap in MB, Speicher in GB (2 / 2048 / 2048 / 8)</td></tr><tr><td><code>CT_BRIDGE</code> <code>CT_STORAGE</code></td><td>Netzwerk-Bridge (<code>vmbr0</code>) und Speicher</td></tr><tr><td><code>TAILSCALE=1</code> / <code>0</code></td><td>Tailscale an oder aus, ohne Nachfrage</td></tr><tr><td><code>TS_AUTHKEY</code></td><td>Tailscale-Schlüssel, damit du keinen Link öffnen musst</td></tr><tr><td><code>PUBLIC=1</code> / <code>0</code></td><td>Öffentliche Links an oder aus</td></tr></tbody></table>
<h2>Nützliche Befehle auf dem Host</h2>
<p>Ersetze <code>ID</code> durch die Container-Nummer, die der Installer gezeigt hat.</p>
<table><thead><tr><th>Was</th><th>Befehl</th></tr></thead><tbody><tr><td>Logs</td><td><code>pct exec ID -- journalctl -u streyn -f</code></td></tr><tr><td>Einstellungen</td><td><code>pct exec ID -- nano /etc/streyn.env</code></td></tr><tr><td>Neu starten</td><td><code>pct exec ID -- systemctl restart streyn</code></td></tr><tr><td>Adresse und Version</td><td>Container → <b>Übersicht → Notizen</b> in der Proxmox-Oberfläche</td></tr></tbody></table>
<div class="note "><b>Musikordner von einem NAS</b><p>Binde die Freigabe zuerst auf dem Proxmox-Host ein (zum Beispiel als Storage unter <code>/mnt/pve/…</code>) und gib diesen Pfad als <code>MUSIC_HOST_DIR</code> an. Der Container liest ihn nur.</p></div>
</template>

ect class="nd" x="4.0" y="4" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="34.0" text-anchor="middle" style="font-size:13px">Spotify</text><text class="sx" x="180.0" y="51.0" text-anchor="middle">Titel, Künstler, Cover</text><rect class="nd acc" x="4.0" y="114" width="352.0" height="80" rx="10"/><text class="tx" x="180.0" y="143.0" text-anchor="middle" style="font-size:13px">Dein Server</text><text class="sx" x="180.0" y="160.0" text-anchor="middle">findet den offiziellen</text><text class="sx" x="180.0" y="175.0" text-anchor="middle">Upload auf YouTube Music</text><rect class="nd" x="4.0" y="238" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="268.0" text-anchor="middle" style="font-size:13px">Deine App</text><text class="sx" x="180.0" y="285.0" text-anchor="middle">spielt den ganzen Song</text><path class="ln" d="M180.0 70V92.0"/><path class="ln" d="M180.0 92.0V112" marker-end="url(#dg7-7t)"/><text class="lb" x="188.0" y="87.0">Metadaten</text><path class="ln" d="M180.0 194V216.0"/><path class="ln" d="M180.0 216.0V236" marker-end="url(#dg7-7t)"/><text class="lb" x="188.0" y="211.0">Stream</text></svg></figure>
<h2>Einrichten</h2>
<ol class="steps"><li><b>Spotify-App anlegen</b>Auf <a href="https://developer.spotify.com/dashboard">developer.spotify.com</a> eine App anlegen und <b>Web API</b> anhaken.</li><li><b>Redirect-URI eintragen</b>Genau diese Adresse:<pre data-lang="text"><code>https://musik.labtoso.de/spotify.html</code></pre></li><li><b>Dich als Nutzer*in eintragen</b>Unter <b>User Management</b> der Spotify-App das Spotify-Konto hinzufügen, das du nutzen willst.</li><li><b>In Streyn verbinden</b>Die Client-ID unter <span class="path">Einstellungen → Quellen → Spotify</span> einfügen und <b>Spotify verbinden</b> drücken. Die Verbindung wird auf dem Server gespeichert, für alle deine Apps.</li></ol>
<div class="note warn"><b>Spotify-Grenzen seit Februar 2026</b><p>Wem die Entwickler-App gehört, braucht Premium, höchstens 5 Nutzer*innen sind erlaubt, und Spotify gibt die Songs nur von eigenen oder gemeinsamen Playlists heraus. Andere Playlists zuerst in die eigene Bibliothek kopieren oder eine Exportify-CSV importieren.</p></div>
<h2>Playlists importieren</h2>
<p><span class="path">Bibliothek → Importiert → Importieren</span>: Link einfügen oder Datei wählen. Songs, die du hast, spielen aus deiner Bibliothek, der Rest über die Quelle.</p>
<table><thead><tr><th>Quelle</th><th>Was du importieren kannst</th></tr></thead><tbody><tr><td>Spotify</td><td>Deine Playlists, Lieblingssongs, Alben</td></tr><tr><td>YouTube, YouTube Music</td><td>Playlist-Link</td></tr><tr><td>SoundCloud</td><td>Playlist- oder Track-Link</td></tr><tr><td>Deezer</td><td>Playlist- oder Album-Link</td></tr><tr><td>Datei</td><td>CSV (z. B. Exportify), M3U, TXT</td></tr></tbody></table>
</template>

<h2>Einrichten auf Proxmox oder Debian</h2>
<ol class="steps"><li><b>Installer nochmal ausführen</b><b>2) With Tailscale</b> wählen. Deine Daten bleiben.</li><li><b>Anmelden</b>Den angezeigten Link öffnen und bei Tailscale anmelden (kostenlos).</li><li><b>HTTPS einschalten, falls gefragt</b>Auf <a href="https://login.tailscale.com/admin/dns">login.tailscale.com/admin/dns</a> <b>Enable HTTPS</b> klicken, dann im Installer Enter drücken.</li><li><b>Tailscale aufs Handy</b>Mit demselben Konto anmelden.</li><li><b>Streyn einmal zuhause öffnen</b>Ab dann wechselt die App unterwegs von selbst auf die Tailscale-Adresse.</li></ol>
<p>Die Adresse steht unter <span class="path">Einstellungen → Unterwegs</span>.</p>
<h2>Ohne Link öffnen</h2>
<p>Leg im Tailscale-Admin unter <b>Settings → Keys</b> einen Auth-Key an, dann:</p>
<pre data-lang="bash"><code>read -rsp "Tailscale auth key: " key; echo
TAILSCALE=1 TS_AUTHKEY="$key" bash -c "$(curl -fsSL https://raw.githubusercontent.com/Labtoso/Musik/main/deploy/proxmox.sh)"
unset key</code></pre>
<h2>Docker und Windows</h2>
<p>Tailscale auf diesem Computer installieren (<a href="https://tailscale.com/download">tailscale.com/download</a>), dann die Adresse eintragen und den Server neu starten. Windows: in die <code>.env</code> neben dem Server. Docker: in der <code>docker-compose.yml</code> das <code>#</code> vor <code>environment:</code> und <code>REMOTE_URL</code> entfernen, dann <code>docker compose up -d</code>.</p>
<pre data-lang="env"><code>REMOTE_URL=http://100.x.y.z:8484</code></pre>
<div class="note warn"><b>Android-Energiesparen</b><p>Stoppt Android Tailscale im Hintergrund, nimm die Tailscale-App von der Akku-Optimierung aus.</p></div>
</template>

="66" rx="10"/><text class="tx" x="180.0" y="42.0" text-anchor="middle" style="font-size:13px">Browser von Freunden</text><rect class="nd" x="4.0" y="114" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="144.0" text-anchor="middle" style="font-size:13px">musik.labtoso.de/s/</text><text class="sx" x="180.0" y="161.0" text-anchor="middle">die Teilen-Seite</text><rect class="nd" x="4.0" y="224" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="254.0" text-anchor="middle" style="font-size:13px">Tailscale Funnel</text><text class="sx" x="180.0" y="271.0" text-anchor="middle">nur die öffentliche Tür</text><rect class="nd acc" x="4.0" y="334" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="372.0" text-anchor="middle" style="font-size:15px">Dein Server</text><path class="ln" d="M180.0 70V92.0"/><path class="ln" d="M180.0 92.0V112" marker-end="url(#dg9-9t)"/><path class="ln" d="M180.0 180V202.0"/><path class="ln" d="M180.0 202.0V222" marker-end="url(#dg9-9t)"/><path class="ln" d="M180.0 290V312.0"/><path class="ln" d="M180.0 312.0V332" marker-end="url(#dg9-9t)"/></svg></figure>
<h2>Einschalten</h2>
<p>Den Proxmox-Installer nochmal ausführen und bei <b>Switch on public links?</b> mit <code>y</code> antworten, oder direkt:</p>
<pre data-lang="bash"><code>TAILSCALE=1 PUBLIC=1 bash -c "$(curl -fsSL https://raw.githubusercontent.com/Labtoso/Musik/main/deploy/proxmox.sh)"</code></pre>
<p>Die Adresse siehst und änderst du unter <span class="path">Einstellungen → Unterwegs → Öffentliche Links</span>. Ausschalten mit <code>PUBLIC=0</code> oder indem du das Feld leerst.</p>
<h3>Docker und Windows</h3>
<p>Der Server wartet auf Port 8485 auf öffentliche Links (nur dieser Computer). Auf dem Computer mit Tailscale:</p>
<pre data-lang="bash"><code>tailscale funnel --bg --https=8443 http://127.0.0.1:8485</code></pre>
<p>Dann <code>PUBLIC_URL=https://&lt;name&gt;.&lt;tailnet&gt;.ts.net:8443</code> genauso eintragen (<code>.env</code> unter Windows, <code>environment:</code> in der <code>docker-compose.yml</code> bei Docker) und den Server neu starten.</p>
<h2>Leute einladen</h2>
<table><thead><tr><th>Was</th><th>Wo</th></tr></thead><tbody><tr><td>Ein normales Konto auf deinem Server</td><td><span class="path">Einstellungen → Nutzer → Einladungslink</span> (einmal gültig, 7 Tage)</td></tr><tr><td>Jemand, der eine Playlist mitbearbeitet</td><td><b>Teilen → Als Mitwirkende*r einladen</b> in der Playlist</td></tr><tr><td>Jemand, der nur mithört</td><td><b>Teilen → Als Zuhörer*in einladen</b></td></tr></tbody></table>
<div class="note ok"><b>Sicher gebaut</b><p>Durch die öffentliche Tür sind Einrichtung, Updates, Nutzerverwaltung, Scans, Uploads und Admin-Anmeldungen zu. Anmeldungen sind auf 20 pro Minute begrenzt, eine Einladung legt höchstens 25 Konten an.</p></div>
</template>

<template data-l="de" data-p="settings" data-g="Ausführliche Einrichtung" data-t="Einstellungsdatei"><p class="lead">Der Server liest seine Einstellungen aus <code>/etc/streyn.env</code> (Container und Debian) oder aus einer Datei <code>.env</code> neben dem Server (Windows). Bei Docker kommen sie unter <code>environment:</code> in die <code>docker-compose.yml</code>.</p>
<h2>Variablen</h2>
<table><thead><tr><th>Variable</th><th>Standard</th><th>Bedeutung</th></tr></thead><tbody><tr><td><code>MUSIC_DIRS</code></td><td>Musikordner</td><td>Song-Ordner, mehrere getrennt mit <code>:</code> (Windows <code>;</code>)</td></tr><tr><td><code>PORT</code></td><td>8484</td><td>Server-Port</td></tr><tr><td><code>DATA_DIR</code></td><td><code>data</code></td><td>Datenbank, Cover, Uploads</td></tr><tr><td><code>SCAN_INTERVAL</code></td><td>30</td><td>Minuten zwischen automatischen Scans</td></tr><tr><td><code>SERVER_NAME</code></td><td>Streyn</td><td>Name in den Apps und auf Teilen-Seiten</td></tr><tr><td><code>REMOTE_URL</code></td><td>–</td><td>Adresse für unterwegs (setzt der Installer)</td></tr><tr><td><code>PUBLIC_URL</code></td><td>–</td><td>Adresse für öffentliche Links (setzt der Installer)</td></tr><tr><td><code>HOST</code></td><td>0.0.0.0</td><td>Adresse, auf der der Server lauscht</td></tr></tbody></table>
<h2>Änderung übernehmen</h2>
<pre data-lang="bash"><code>sudo systemctl restart streyn</code></pre>
<p>Docker: <code>docker compose up -d</code> (legt den Container mit den neuen Einstellungen neu an). Windows: das Serverfenster schließen und <code>streyn-server.exe</code> neu starten.</p>
<h2>Wo was liegt</h2>
<table><thead><tr><th>Was</th><th>Container und Debian</th></tr></thead><tbody><tr><td>Einstellungen</td><td><code>/etc/streyn.env</code></td></tr><tr><td>Daten</td><td><code>/var/lib/streyn</code></td></tr><tr><td>Backups</td><td><code>/var/lib/streyn/backups</code></td></tr><tr><td>Musik</td><td><code>/srv/streyn</code></td></tr><tr><td>Logs</td><td><code>journalctl -u streyn -f</code></td></tr></tbody></table>
</template>

<template data-l="de" data-p="update" data-g="Ausführliche Einrichtung" data-t="Updates und Backup"><p class="lead">Eine Leiste oben in der App sagt dir, wenn eine neue Version da ist. <b>Aktualisieren</b> erledigt den Rest, in der richtigen Reihenfolge. Nur der Admin kann den Server aktualisieren.</p>
<figure class="fig"><svg class="wide" viewBox="0 0 720 90" role="img" aria-label="Schaubild: Aktualisieren (in der App); 1 App (neue Version); 2 Sicherung (Datenbank-Kopie); 3 Server (startet neu)"><defs><marker id="dg10-10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><rect class="nd acc" x="4.0" y="14.0" width="148.0" height="62" rx="10"/><text class="tx" x="78.0" y="42.0" text-anchor="middle" style="font-size:14px">Aktualisieren</text><text class="sx" x="78.0" y="59.0" text-anchor="middle">in der App</text><rect class="nd" x="192.0" y="14.0" width="148.0" height="62" rx="10"/><text class="tx" x="266.0" y="42.0" text-anchor="middle" style="font-size:14px">1 App</text><text class="sx" x="266.0" y="59.0" text-anchor="middle">neue Version</text><rect class="nd" x="380.0" y="14.0" width="148.0" height="62" rx="10"/><text class="tx" x="454.0" y="42.0" text-anchor="middle" style="font-size:14px">2 Sicherung</text><text class="sx" x="454.0" y="59.0" text-anchor="middle">Datenbank-Kopie</text><rect class="nd" x="568.0" y="14.0" width="148.0" height="62" rx="10"/><text class="tx" x="642.0" y="42.0" text-anchor="middle" style="font-size:14px">3 Server</text><text class="sx" x="642.0" y="59.0" text-anchor="middle">startet neu</text><path class="ln" d="M152.0 45.0H172.0"/><path class="ln" d="M172.0 45.0H190.0" marker-end="url(#dg10-10)"/><path class="ln" d="M340.0 45.0H360.0"/><path class="ln" d="M360.0 45.0H378.0" marker-end="url(#dg10-10)"/><path class="ln" d="M528.0 45.0H548.0"/><path class="ln" d="M548.0 45.0H566.0" marker-end="url(#dg10-10)"/></svg><svg class="tall" viewBox="0 0 360 406" role="img" aria-label="Schaubild: Aktualisieren (in der App); 1 App (neue Version); 2 Sicherung (Datenbank-Kopie); 3 Server (startet neu)"><defs><marker id="dg10-10t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><rect class="nd acc" x="4.0" y="4" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="34.0" text-anchor="middle" style="font-size:13px">Aktualisieren</text><text class="sx" x="180.0" y="51.0" text-anchor="middle">in der App</text><rect class="nd" x="4.0" y="114" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="144.0" text-anchor="middle" style="font-size:13px">1 App</text><text class="sx" x="180.0" y="161.0" text-anchor="middle">neue Version</text><rect class="nd" x="4.0" y="224" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="254.0" text-anchor="middle" style="font-size:13px">2 Sicherung</text><text class="sx" x="180.0" y="271.0" text-anchor="middle">Datenbank-Kopie</text><rect class="nd" x="4.0" y="334" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="364.0" text-anchor="middle" style="font-size:13px">3 Server</text><text class="sx" x="180.0" y="381.0" text-anchor="middle">startet neu</text><path class="ln" d="M180.0 70V92.0"/><path class="ln" d="M180.0 92.0V112" marker-end="url(#dg10-10t)"/><path class="ln" d="M180.0 180V202.0"/><path class="ln" d="M180.0 202.0V222" marker-end="url(#dg10-10t)"/><path class="ln" d="M180.0 290V312.0"/><path class="ln" d="M180.0 312.0V332" marker-end="url(#dg10-10t)"/></svg></figure>
<p>Vor jedem Server-Update wird die Datenbank nach <code>/var/lib/streyn/backups</code> kopiert. Die letzten 5 Kopien bleiben.</p>
<h2>Von Hand aktualisieren</h2>
<table><thead><tr><th>System</th><th>So geht’s</th></tr></thead><tbody><tr><td>Proxmox</td><td>Den Installer nochmal ausführen</td></tr><tr><td>Debian / Ubuntu</td><td><code>sudo streyn-update</code></td></tr><tr><td>ZimaOS / CasaOS</td><td>Den Installationsbefehl nochmal ausführen</td></tr><tr><td>Docker</td><td><code>git pull && docker compose up -d --build</code></td></tr><tr><td>Windows</td><td>Den PowerShell-Befehl nochmal ausführen</td></tr><tr><td>Apps</td><td>Die neue Version über die alte installieren</td></tr></tbody></table>
<h2>Sichern</h2>
<p>Der Datenordner reicht: <code>/var/lib/streyn</code> oder <code>data/</code>. Er enthält Datenbank, Cover und hochgeladene Songs. Auf Proxmox ist ein Backup des ganzen Containers am einfachsten.</p>
<h2>Backup zurückspielen</h2>
<ol class="steps"><li><b>Server stoppen</b><pre data-lang="bash"><code>sudo systemctl stop streyn</code></pre></li><li><b>Kopie wählen</b>Jeder Ordner in <code>/var/lib/streyn/backups</code> heißt nach Datum und der Version vor dem Update.<pre data-lang="bash"><code>ls /var/lib/streyn/backups</code></pre></li><li><b>Zurückkopieren und starten</b><pre data-lang="bash"><code>sudo cp -p /var/lib/streyn/backups/ORDNER/streyn.db* /var/lib/streyn/
sudo systemctl start streyn</code></pre></li></ol>
</template>

<template data-l="de" data-p="connection" data-g="Fehlerbehebung" data-t="Verbindung"><p class="lead">Die App oder der Browser erreicht den Server nicht. Geh die Punkte von oben nach unten durch.</p>
<h2>Zuhause</h2>
<details class="fix"><summary>Die App findet den Server nicht<span class="tag">häufig</span></summary><div><p>Prüf die Adresse <b>mit Port</b>, zum Beispiel <code>192.168.1.50:8484</code>, und dass das Gerät im selben WLAN ist.</p><p>Öffne das im Browser. Es muss <code>"app":"musik"</code> und die Version zeigen:</p><pre data-lang="url"><code>http://ADRESSE:8484/api/info</code></pre><p>Keine Antwort? Prüf, ob der Server läuft:</p><pre data-lang="bash"><code>systemctl status streyn</code></pre><p>Auf dem Proxmox-Host: <code>pct exec ID -- systemctl status streyn</code>.</p></div></details>
<details class="fix"><summary>Die Adresse hat sich geändert</summary><div><p>Der Container hat vom Router eine neue Adresse bekommen. Die aktuelle Adresse steht in Proxmox unter Container → <b>Übersicht → Notizen</b>, oder führ den Installer nochmal aus. Damit sie bleibt, gib dem Container im Router eine feste IP.</p><p>Dann die Adresse in den Apps unter <span class="path">Einstellungen → Server wechseln</span> ändern.</p></div></details>
<details class="fix"><summary>Die App startet im Offline-Modus</summary><div><p>Die App hat den Server nicht erreicht und mit deinen heruntergeladenen Songs gestartet. Bring die Verbindung in Ordnung und drück dann den Knopf in der Leiste oben, um wieder online zu gehen.</p></div></details>
<h2>Unterwegs</h2>
<details class="fix"><summary>Unterwegs geht nichts<span class="tag">häufig</span></summary><div><p>Ist Tailscale an und auf dem Handy mit <b>demselben Konto</b> angemeldet? Auf Android Tailscale vom Energiesparen ausnehmen.</p><p>Auf dem Server:</p><pre data-lang="bash"><code>tailscale status</code></pre><p>Öffne Streyn einmal zuhause, damit die App die Tailscale-Adresse kennt.</p></div></details>
<details class="fix"><summary>Öffentliche Links öffnen sich nicht</summary><div><p>Prüf, ob öffentliche Links unter <span class="path">Einstellungen → Unterwegs → Öffentliche Links</span> an sind und der Funnel läuft:</p><pre data-lang="bash"><code>tailscale funnel status</code></pre><p>Zeigt er nichts, führ den Installer mit <code>PUBLIC=1</code> nochmal aus.</p></div></details>
</template>

<template data-l="de" data-p="music" data-g="Fehlerbehebung" data-t="Musik und Spotify"><p class="lead">Songs fehlen, Spotify verbindet nicht oder die falsche Version spielt.</p>
<h2>Deine eigene Musik</h2>
<details class="fix"><summary>Neue Songs tauchen nicht auf<span class="tag">häufig</span></summary><div><p>Drück <span class="path">Einstellungen → Bibliothek neu scannen</span>. Prüf, dass die Dateien im Musikordner liegen und ein unterstütztes Format haben: MP3, FLAC, M4A/AAC, OGG, WAV, WebM.</p><p>Mit einem Host-Ordner auf Proxmox: prüf, ob <code>MUSIC_HOST_DIR</code> gesetzt war und der Ordner lesbar ist.</p></div></details>
<details class="fix"><summary>Titel, Künstler oder Cover stimmen nicht</summary><div><p>Streyn liest sie aus den Tags der Datei. Korrigier die Tags (zum Beispiel mit MusicBrainz Picard oder Mp3tag) und scanne neu.</p></div></details>
<h2>Spotify</h2>
<details class="fix"><summary>Spotify verbindet nicht<span class="tag">häufig</span></summary><div><p>Die Redirect-URI im Spotify-Dashboard muss genau <code>https://musik.labtoso.de/spotify.html</code> sein, und dein Spotify-Konto muss unter <b>User Management</b> der Entwickler-App eingetragen sein.</p><p>Wem die Entwickler-App gehört, braucht Premium.</p></div></details>
<details class="fix"><summary>Eine Spotify-Playlist ist leer</summary><div><p>Seit Februar 2026 gibt Spotify die Songs nur von eigenen oder gemeinsamen Playlists heraus. Kopier die Playlist zuerst auf Spotify in deine Bibliothek, oder importier eine Exportify-CSV.</p></div></details>
<details class="fix"><summary>Die falsche Version eines Songs spielt</summary><div><p>Der Server nimmt offizielle Uploads und überspringt Cover-, Live- und Remix-Versionen. Erwischt er trotzdem die falsche, nenn uns den Song in einem <a href="https://github.com/Labtoso/Musik/issues">GitHub-Issue</a>.</p></div></details>
</template>

<template data-l="de" data-p="appfix" data-g="Fehlerbehebung" data-t="Apps"><p class="lead">Apps installieren, aktualisieren und benutzen.</p>
<h2>Android</h2>
<details class="fix"><summary>Android installiert die App nicht<span class="tag">häufig</span></summary><div><p>Erlaube Installationen aus der App, mit der du die Datei öffnest (Browser oder Dateimanager). Android fragt beim ersten Mal danach.</p></div></details>
<details class="fix"><summary>Das Update installiert sich nicht</summary><div><p>Versionen vor 1.8.0 waren mit einem anderen Schlüssel signiert. Deinstallier Streyn einmal und installier die neue <code>Streyn.apk</code>. Musik und Einstellungen bleiben auf dem Server.</p></div></details>
<details class="fix"><summary>Die Musik stoppt im Hintergrund</summary><div><p>Nimm Streyn in den Android-Einstellungen von der Akku-Optimierung aus.</p></div></details>
<h2>Windows und Linux</h2>
<details class="fix"><summary>Die App startet, zeigt aber nichts</summary><div><p>Prüf die Serveradresse unter <span class="path">Einstellungen → Server wechseln</span>. Dann siehe <a href="#/connection">Verbindung</a>.</p></div></details>
<details class="fix"><summary>Ganz neu anfangen</summary><div><p>Windows: Streyn unter <span class="path">Einstellungen → Apps → Installierte Apps</span> entfernen, <code>%APPDATA%\\Streyn</code> und <code>%LOCALAPPDATA%\\Streyn</code> löschen, neu installieren. Musik und Konto bleiben auf dem Server.</p></div></details>
</template>
