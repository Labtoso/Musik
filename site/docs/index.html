<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Streyn Docs</title>
<meta name="description" content="Guide for Streyn: install the server, set up the apps, listen on the go, share playlists and songs, offline mode, themes and help.">
<meta name="theme-color" content="#0d1117">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
// theme before paint: saved choice, else the system
try { const t = localStorage.getItem('musik.docs.theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
:root {
  --bg: #ffffff; --bg-side: #ffffff; --bg-soft: #f6f8fa; --bg-code: #f6f8fa; --bg-hover: #f1f3f6;
  --line: #e5e7eb; --line2: #d1d5db;
  --text: #24292f; --head: #111827; --muted: #57606a; --dim: #8c959f;
  --accent: #2f6bf2; --accent-soft: rgba(47,107,242,.09); --accent-text: #1f5ae0;
  --info: #2f6bf2; --tip: #1a7f37; --warn: #9a6700; --danger: #cf222e;
  --info-bg: #eef4ff; --tip-bg: #edf8f0; --warn-bg: #fff8e6; --danger-bg: #ffeef0;
  --shadow: 0 10px 30px rgba(17,24,39,.12), 0 2px 6px rgba(17,24,39,.06);
  --sans: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
  --top: 64px; --side: 272px; --toc: 232px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --bg: #0d1117; --bg-side: #0d1117; --bg-soft: #161b22; --bg-code: #161b22; --bg-hover: #1c222b;
    --line: #21262d; --line2: #30363d;
    --text: #c9d1d9; --head: #f0f3f6; --muted: #8b949e; --dim: #6e7681;
    --accent: #4f7cff; --accent-soft: rgba(79,124,255,.14); --accent-text: #79a0ff;
    --info: #4f8cff; --tip: #3fb950; --warn: #d29922; --danger: #f85149;
    --info-bg: rgba(79,140,255,.1); --tip-bg: rgba(63,185,80,.1); --warn-bg: rgba(210,153,34,.1); --danger-bg: rgba(248,81,73,.1);
    --shadow: 0 12px 34px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme=dark] {
  --bg: #0d1117; --bg-side: #0d1117; --bg-soft: #161b22; --bg-code: #161b22; --bg-hover: #1c222b;
  --line: #21262d; --line2: #30363d;
  --text: #c9d1d9; --head: #f0f3f6; --muted: #8b949e; --dim: #6e7681;
  --accent: #4f7cff; --accent-soft: rgba(79,124,255,.14); --accent-text: #79a0ff;
  --info: #4f8cff; --tip: #3fb950; --warn: #d29922; --danger: #f85149;
  --info-bg: rgba(79,140,255,.1); --tip-bg: rgba(63,185,80,.1); --warn-bg: rgba(210,153,34,.1); --danger-bg: rgba(248,81,73,.1);
  --shadow: 0 12px 34px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--top) + 20px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.7 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: var(--accent-text); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
::selection { background: var(--accent); color: #fff; }

/* header */
.top { position: fixed; inset: 0 0 auto; height: var(--top); z-index: 40; display: flex; align-items: center; gap: 12px; padding: 0 20px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; color: var(--head); font-weight: 700; font-size: 17px; letter-spacing: -.01em; width: calc(var(--side) - 32px); flex: none; }
.brand:hover { text-decoration: none; }
.brand .mark { width: 36px; height: 36px; flex: none; background: var(--accent, #4f7cff); -webkit-mask: url(../logo.svg) center / contain no-repeat; mask: url(../logo.svg) center / contain no-repeat; }
.brand .wm { display: block; height: 24px; aspect-ratio: 5486 / 1990; background: currentColor; -webkit-mask: url(../wordmark.svg) center / contain no-repeat; mask: url(../wordmark.svg) center / contain no-repeat; }
.brand .dk { font-weight: 600; color: var(--muted); }
.brand small { font: 500 11px var(--mono); color: var(--muted); border: 1px solid var(--line2); border-radius: 20px; padding: 1px 8px; }
.burger, .ibtn { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 8px; color: var(--muted); flex: none; }
.burger:hover, .ibtn:hover { background: var(--bg-hover); color: var(--head); }
.burger { display: none; }
.search { position: relative; flex: 1 1 auto; max-width: 440px; }
.search label { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 10px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 8px; color: var(--dim); cursor: text; }
.search label:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 14.5px; color: var(--text); }
.search input::-webkit-search-cancel-button { display: none; }
.search kbd { font: 500 11px var(--mono); color: var(--dim); border: 1px solid var(--line2); border-radius: 5px; padding: 1px 6px; background: var(--bg); }
.results { position: absolute; top: 46px; left: 0; width: min(560px, calc(100vw - 32px)); max-height: min(70vh, 520px); overflow-y: auto; background: var(--bg); border: 1px solid var(--line2); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; display: none; }
.results.open { display: block; }
.results a { display: block; padding: 9px 12px; border-radius: 7px; color: var(--text); }
.results a:hover, .results a.sel { background: var(--accent-soft); text-decoration: none; }
.results b { display: block; color: var(--head); font-weight: 600; font-size: 14.5px; }
.results b span { color: var(--dim); font-weight: 500; }
.results small { display: block; color: var(--muted); font-size: 13px; line-height: 1.5; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.results mark { background: none; color: var(--accent-text); font-weight: 600; }
.results .none { padding: 14px 12px; color: var(--muted); font-size: 14px; }
.links { display: flex; align-items: center; gap: 2px; margin-left: auto; }
.links > a { color: var(--muted); font-size: 14.5px; font-weight: 500; padding: 6px 10px; border-radius: 7px; }
.links > a:hover { color: var(--head); background: var(--bg-hover); text-decoration: none; }
.lang { display: flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; font: 500 12px var(--mono); margin: 0 4px; }
.lang button { padding: 6px 9px; color: var(--muted); }
.lang button.on { background: var(--head); color: var(--bg); }
.sun { display: none; }
:root[data-theme=dark] .sun { display: block; } :root[data-theme=dark] .moon { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme=light]) .sun { display: block; } :root:not([data-theme=light]) .moon { display: none; } }

/* sidebar */
.side { position: fixed; top: var(--top); bottom: 0; left: 0; width: var(--side); overflow-y: auto; padding: 22px 16px 40px; background: var(--bg-side); border-right: 1px solid var(--line); scrollbar-width: thin; z-index: 30; }
.side .grp { margin-bottom: 4px; }
.side .grp > button { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; border-radius: 6px; font-size: 14.5px; font-weight: 600; color: var(--head); text-align: left; }
.side .grp > button:hover { background: var(--bg-hover); }
.side .grp > button svg { width: 15px; height: 15px; color: var(--dim); transition: transform .15s; }
.side .grp.shut > button svg { transform: rotate(-90deg); }
.side .grp.shut ul { display: none; }
.side ul { list-style: none; margin: 2px 0 10px; padding: 0 0 0 10px; }
.side li a { display: block; padding: 5px 10px 5px 14px; margin-left: 2px; border-left: 1px solid var(--line2); color: var(--muted); font-size: 14.5px; line-height: 1.45; }
.side li a:hover { color: var(--head); text-decoration: none; border-color: var(--dim); }
.side li a.on { color: var(--accent-text); border-color: var(--accent); font-weight: 600; background: linear-gradient(90deg, var(--accent-soft), transparent 80%); }
.side .home { display: flex; align-items: center; gap: 8px; padding: 6px 10px; margin-bottom: 10px; border-radius: 6px; font-size: 14.5px; font-weight: 600; color: var(--head); }
.side .home:hover { background: var(--bg-hover); text-decoration: none; }
.side .home.on { color: var(--accent-text); background: var(--accent-soft); }
.scrim { display: none; }

/* page */
.page { margin-left: var(--side); padding-top: var(--top); }
.inner { display: grid; grid-template-columns: minmax(0, 1fr) var(--toc); gap: 48px; max-width: 1120px; padding: 34px 40px 60px 48px; }
article { min-width: 0; max-width: 780px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13.5px; color: var(--dim); margin-bottom: 14px; }
.crumbs a { color: var(--muted); }
.crumbs svg { width: 13px; height: 13px; }
h1 { font-size: clamp(30px, 4vw, 38px); line-height: 1.15; letter-spacing: -.025em; color: var(--head); font-weight: 700; margin: 0 0 14px; }
.lead { font-size: 18px; color: var(--muted); margin: 0 0 26px; }
h2 { font-size: 24px; line-height: 1.3; letter-spacing: -.015em; color: var(--head); font-weight: 650; margin: 40px 0 12px; padding-top: 22px; border-top: 1px solid var(--line); }
h3 { font-size: 18.5px; color: var(--head); font-weight: 650; margin: 28px 0 8px; }
h2, h3 { position: relative; }
.hash { position: absolute; left: -22px; padding-right: 6px; color: var(--dim); font-weight: 500; opacity: 0; text-decoration: none !important; }
h2 .hash { top: 22px; }
h2:hover .hash, h3:hover .hash, .hash:focus { opacity: 1; }
p { margin: 0 0 14px; }
ul, ol { margin: 0 0 16px; padding-left: 24px; }
li { margin: 5px 0; }
li::marker { color: var(--dim); }
strong, b { color: var(--head); font-weight: 600; }
code { font: 13.5px var(--mono); background: var(--bg-code); border: 1px solid var(--line); border-radius: 5px; padding: 1.5px 5px; color: var(--head); overflow-wrap: anywhere; }
.path { font-weight: 600; color: var(--head); white-space: nowrap; }
.code { position: relative; margin: 14px 0 20px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg-code); }
.code .lbl { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 6px 14px; border-bottom: 1px solid var(--line); font: 500 11.5px var(--mono); color: var(--dim); text-transform: lowercase; }
.code pre { margin: 0; padding: 14px 16px; font: 13.5px/1.7 var(--mono); color: var(--head); white-space: pre-wrap; overflow-wrap: anywhere; }
.code pre code { background: none; border: 0; padding: 0; }
.copy { display: inline-flex; align-items: center; gap: 6px; font: 500 12px var(--sans); color: var(--muted); padding: 3px 8px; border-radius: 6px; text-transform: none; }
.copy:hover { background: var(--bg-hover); color: var(--head); }
.copy svg { width: 15px; height: 15px; }
.copy.ok { color: var(--tip); }
table { width: 100%; border-collapse: collapse; margin: 12px 0 22px; font-size: 14.5px; display: block; overflow-x: auto; }
thead, tbody, tr { width: 100%; }
th, td { text-align: left; padding: 9px 14px; border: 1px solid var(--line); vertical-align: top; }
th { background: var(--bg-soft); color: var(--head); font-weight: 600; white-space: nowrap; }
td:first-child { white-space: nowrap; }
img.shot { display: block; max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 10px; }
.shots { display: flex; gap: 14px; align-items: flex-end; margin: 18px 0 6px; }
.shots .d { flex: 1 1 0; min-width: 0; }
.shots .m { width: 23%; border-radius: 14px; }
.shots .m2 { width: 32%; border-radius: 14px; }
.cap { font-size: 13px; color: var(--dim); margin: 0 0 20px; }

/* callouts */
.callout { display: flex; gap: 12px; margin: 18px 0 22px; padding: 13px 16px; border: 1px solid; border-left-width: 4px; border-radius: 8px; font-size: 15px; }
.callout svg { margin-top: 3px; }
.callout > div > :last-child { margin-bottom: 0; }
.callout .t { display: block; font-weight: 650; margin-bottom: 2px; }
.callout.info { border-color: color-mix(in srgb, var(--info) 35%, transparent); border-left-color: var(--info); background: var(--info-bg); }
.callout.info svg, .callout.info .t { color: var(--info); }
.callout.tip { border-color: color-mix(in srgb, var(--tip) 35%, transparent); border-left-color: var(--tip); background: var(--tip-bg); }
.callout.tip svg, .callout.tip .t { color: var(--tip); }
.callout.warn { border-color: color-mix(in srgb, var(--warn) 35%, transparent); border-left-color: var(--warn); background: var(--warn-bg); }
.callout.warn svg, .callout.warn .t { color: var(--warn); }

/* tabs */
.tabs { margin: 14px 0 22px; border: 1px solid var(--line); border-radius: 8px; }
.tabs [role=tablist] { display: flex; overflow-x: auto; border-bottom: 1px solid var(--line); padding: 0 6px; scrollbar-width: none; }
.tabs [role=tab] { padding: 10px 12px; font-size: 14px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs [role=tab]:hover { color: var(--head); }
.tabs [role=tab][aria-selected=true] { color: var(--accent-text); border-color: var(--accent); }
.tabs [role=tabpanel] { padding: 16px 18px 4px; }
.tabs [role=tabpanel][hidden] { display: none; }
.tabs .code { margin-top: 4px; }

/* steps */
.steps { list-style: none; padding: 0; counter-reset: s; }
.steps > li { counter-increment: s; position: relative; padding: 0 0 12px 42px; margin: 0; }
.steps > li::before { content: counter(s); position: absolute; left: 0; top: 1px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); font: 600 13px/26px var(--sans); text-align: center; }
.steps > li::after { content: ''; position: absolute; left: 13px; top: 32px; bottom: 6px; width: 1px; background: var(--line2); }
.steps > li:last-child::after { display: none; }

/* cards on the home page */
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 16px 0 26px; }
.cards a { display: block; padding: 15px 16px; border: 1px solid var(--line); border-radius: 10px; color: var(--text); transition: border-color .15s, background .15s; }
.cards a:hover { border-color: var(--accent); background: var(--accent-soft); text-decoration: none; }
.cards b { display: flex; align-items: center; gap: 8px; color: var(--head); font-size: 15.5px; margin-bottom: 2px; }
.cards b svg { color: var(--accent-text); }
.cards span { font-size: 14px; color: var(--muted); line-height: 1.5; display: block; }

/* faq */
details.q { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 8px; }
details.q summary { cursor: pointer; list-style: none; padding: 11px 40px 11px 16px; position: relative; font-weight: 600; color: var(--head); font-size: 15.5px; }
details.q summary::-webkit-details-marker { display: none; }
details.q summary::after { content: ''; position: absolute; right: 16px; top: 18px; width: 7px; height: 7px; border-right: 2px solid var(--dim); border-bottom: 2px solid var(--dim); transform: rotate(45deg); transition: transform .15s; }
details.q[open] summary::after { transform: rotate(-135deg); top: 21px; }
details.q > div { padding: 0 16px 6px; }

/* prev / next, footer of the article */
.meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin: 46px 0 18px; font-size: 13.5px; color: var(--dim); }
.meta a { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.meta svg { width: 15px; height: 15px; }
.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pn a { display: block; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; color: var(--head); font-weight: 600; transition: border-color .15s; }
.pn a:hover { border-color: var(--accent); text-decoration: none; }
.pn a small { display: block; font-weight: 500; font-size: 12.5px; color: var(--dim); margin-bottom: 2px; }
.pn .next { text-align: right; grid-column: 2; }
.foot { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 13px; color: var(--dim); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
.foot a { color: var(--muted); }

/* on this page */
.toc { position: sticky; top: calc(var(--top) + 34px); align-self: start; max-height: calc(100vh - var(--top) - 60px); overflow-y: auto; font-size: 13.5px; scrollbar-width: thin; }
.toc p { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--head); margin: 0 0 10px; font-size: 13.5px; }
.toc p svg { width: 16px; height: 16px; color: var(--dim); }
.toc a { display: block; padding: 4px 0 4px 12px; border-left: 1px solid var(--line2); color: var(--muted); line-height: 1.45; }
.toc a.h3 { padding-left: 24px; }
.toc a:hover { color: var(--head); text-decoration: none; }
.toc a.on { color: var(--accent-text); border-color: var(--accent); }
.toc .up { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; color: var(--dim); font-size: 13px; }
.toc .up:hover { color: var(--head); }
.toc .up svg { width: 14px; height: 14px; }

@media (max-width: 1180px) {
  .inner { grid-template-columns: minmax(0, 1fr); padding-right: 40px; }
  .toc { display: none; }
}
@media (max-width: 960px) {
  .burger { display: grid; }
  .brand { width: auto; }
  .side { transform: translateX(-100%); visibility: hidden; transition: transform .22s ease, visibility 0s linear .22s; box-shadow: none; width: min(300px, 86vw); }
  body.nav .side { transform: none; visibility: visible; transition: transform .22s ease, visibility 0s; box-shadow: var(--shadow); }
  .scrim { display: block; position: fixed; inset: var(--top) 0 0; background: rgba(0,0,0,.35); z-index: 25; opacity: 0; pointer-events: none; transition: opacity .2s; }
  body.nav .scrim { opacity: 1; pointer-events: auto; }
  .page { margin-left: 0; }
  .inner { padding: 26px 20px 50px; }
  .links > a { display: none; }
  .hash { display: none; }
}
@media (max-width: 640px) {
  .top { padding: 0 10px 0 6px; gap: 6px; }
  .brand small { display: none; }
  .search { position: static; flex: 0 0 auto; }
  .search label { width: 36px; padding: 0; justify-content: center; border-color: transparent; background: none; cursor: pointer; }
  .search input, .search kbd { display: none; }
  body.find .search label { position: absolute; left: 8px; right: 8px; top: 13px; width: auto; padding: 0 10px; justify-content: flex-start; background: var(--bg-soft); border-color: var(--accent); z-index: 2; }
  body.find .search input { display: block; }
  .results { left: 8px; right: 8px; top: 58px; width: auto; }
  .cards { grid-template-columns: 1fr; }
  .shots .m { width: 30%; }
  .shots .m2 { width: 46%; }
  .pn { grid-template-columns: 1fr; }
  .pn .next { grid-column: 1; }
  h2 { font-size: 21.5px; }
}

/* ---------- graphics ---------- */
.fig { margin: 18px 0 22px; padding: 20px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg-soft); }
.fig svg { display: block; width: 100%; height: auto; overflow: visible; }
.fig svg.tall { display: none; max-width: 420px; margin: 0 auto; }
.fig .nd { fill: var(--bg); stroke: var(--line2); stroke-width: 1.4; }
.fig .nd.acc { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.6; }
.fig .tx { fill: var(--head); font-family: var(--sans); font-weight: 650; }
.fig .sx { fill: var(--muted); font: 400 12px var(--sans); }
.fig .tg { fill: var(--accent-text); font: 600 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.fig .lb { fill: var(--dim); font: 500 11px var(--mono); }
.fig .ln { stroke: var(--dim); stroke-width: 1.5; fill: none; }
.fig .ln.acc { stroke: var(--accent); }
.fig .ln.dash { stroke-dasharray: 5 4; }
.fig .ah { fill: var(--dim); }
@media (max-width: 640px) { .fig svg.wide { display: none; } .fig svg.tall { display: block; } .fig { padding: 16px 12px; } }

.hero { position: relative; margin: 8px 0 34px; padding-right: 13%; }
.hero img { display: block; height: auto; border: 1px solid var(--line); background: var(--bg-soft); cursor: zoom-in; }
.hero .hd { width: 100%; border-radius: 12px; box-shadow: var(--shadow); }
.hero .hm { position: absolute; right: 0; bottom: -18px; width: 24%; border-radius: 18px; box-shadow: var(--shadow); border: 4px solid var(--bg); }

.feats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 14px 0 24px; }
.feats a { display: block; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; color: var(--text); transition: border-color .15s, transform .15s; }

<template data-l="en" data-p="" data-g="" data-t="Welcome"><p class="lead">Streyn is your own music app. A small server at home keeps your music and learns your taste, the apps for Android, Windows, Linux and the browser play from it, at home and on the go.</p>
<div class="hero"><img class="hd" src="../shots/v2/d-home.webp" width="1920" height="1200" alt="Streyn on the computer" data-zoom><img class="hm" src="../shots/v2/m-home.webp" width="780" height="1688" alt="Streyn on the phone" data-zoom></div>
<h2>How Streyn works</h2>

l(#ar2)"/></svg><svg class="tall" viewBox="0 0 360 516" role="img"><defs><marker id="ar2t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><rect class="nd" x="4.0" y="4" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="34.0" text-anchor="middle" style="font-size:13px">1 Server</text><text class="sx" x="180.0" y="51.0" text-anchor="middle">install it once</text><rect class="nd" x="4.0" y="114" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="144.0" text-anchor="middle" style="font-size:13px">2 App</text><text class="sx" x="180.0" y="161.0" text-anchor="middle">download</text><rect class="nd" x="4.0" y="224" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="254.0" text-anchor="middle" style="font-size:13px">3 Account</text><text class="sx" x="180.0" y="271.0" text-anchor="middle">first one is admin</text><rect class="nd" x="4.0" y="334" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="364.0" text-anchor="middle" style="font-size:13px">4 Assistant</text><text class="sx" x="180.0" y="381.0" text-anchor="middle">your taste</text><rect class="nd acc" x="4.0" y="444" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="474.0" text-anchor="middle" style="font-size:13px">5 Play</text><text class="sx" x="180.0" y="491.0" text-anchor="middle">Mix for you</text><path class="ln" d="M180.0 70V92.0"/><path class="ln" d="M180.0 92.0V112" marker-end="url(#ar2t)"/><path class="ln" d="M180.0 180V202.0"/><path class="ln" d="M180.0 202.0V222" marker-end="url(#ar2t)"/><path class="ln" d="M180.0 290V312.0"/><path class="ln" d="M180.0 312.0V332" marker-end="url(#ar2t)"/><path class="ln" d="M180.0 400V422.0"/><path class="ln" d="M180.0 422.0V442" marker-end="url(#ar2t)"/></svg></figure>
<ol class="steps">
  <li><strong>Install the server</strong>, easiest on Proxmox (see <a href="#/install">Install the server</a>). At the end you see an address like <code>http://192.168.1.50:8484</code>.</li>
  <li><strong>Get an app</strong> from <a href="../">musik.labtoso.de</a>, or just open the address in a browser.</li>
  <li><strong>Enter the address</strong> and create your account. The first account is the admin.</li>
  <li><strong>Answer the setup assistant:</strong> language, look, the music and artists you like, and how you listen.</li>
  <li><strong>Add music</strong> to the music folder or upload it under <span class="path">Settings → Upload music</span>, then play <strong>Mix for you</strong> on the start page.</li>
</ol>

<template data-l="en" data-p="install" data-g="Get started" data-t="Install the server"><p class="lead">One command per system. Running it again later updates the server, your data stays.</p>
<h2>Pick your system</h2>
<div class="tabs">
  <div role="tablist"><button role="tab">Proxmox</button><button role="tab">Debian / Ubuntu</button><button role="tab">ZimaOS / CasaOS</button><button role="tab">Docker</button><button role="tab">Windows</button></div>
  <div role="tabpanel">
    <p>Click the node in Proxmox, open <strong>Shell</strong> and paste:</p>
    <pre data-lang="bash"><code>bash -c "$(curl -fsSL https://raw.githubusercontent.com/Labtoso/Musik/main/deploy/proxmox.sh)"</code></pre>
    <p>It creates a Debian 12 container (2 cores, 2 GB RAM, 8 GB disk), asks for an optional music folder on the host and whether you want <a href="#/away">Tailscale</a>, then prints the address.</p>
  </div>
  <div role="tabpanel">
    <pre data-lang="bash"><code>curl -fsSL https://raw.githubusercontent.com/Labtoso/Musik/main/deploy/install.sh | sudo bash</code></pre>
    <p>Installs the <code>streyn</code> service. Options go after <code>bash -s --</code>: <code>--music /path</code>, <code>--port 8484</code>, <code>--tailscale</code>, <code>--no-tailscale</code>, <code>--ts-authkey …</code></p>
  </div>
  <div role="tabpanel">
    <pre data-lang="bash"><code>curl -fsSL https://raw.githubusercontent.com/Labtoso/Musik/main/deploy/zimaos.sh | bash</code></pre>
    <p>Streyn shows up as an app on the dashboard. Songs go into <code>Media/Music</code>.</p>
  </div>
  <div role="tabpanel">
    <pre data-lang="bash"><code>git clone https://github.com/Labtoso/Musik.git && cd Musik && docker compose up -d --build</code></pre>
    <p>Music goes into <code>music/</code>, data into <code>data/</code>, port 8484.</p>
  </div>
  <div role="tabpanel">
    <p>In PowerShell: <code>try { Invoke-WebRequest https://github.com/Labtoso/Musik/releases/latest/download/streyn-server-windows-x64.exe -OutFile streyn-server.new.exe -ErrorAction Stop; Move-Item -Force streyn-server.new.exe streyn-server.exe; .\streyn-server.exe } catch { Remove-Item streyn-server.new.exe -ErrorAction Ignore; throw }</code>. That always loads the newest server; run it again to update. Or download <code>streyn-server-windows-x64.exe</code> from the <a href="https://github.com/Labtoso/Musik/releases/latest">latest release</a> and start it. It uses your Music folder. For another folder put <code>MUSIC_DIRS=D:\Music</code> into a <code>.env</code> next to the exe.</p>
  </div>
</div>
<h2>Proxmox options</h2>
<p>Put them in front of the command, for example <code>MUSIC_HOST_DIR=/mnt/nas/music bash -c "…"</code>.</p>
<table>
  <thead><tr><th>Option</th><th>Meaning</th></tr></thead>
  <tbody>
  <tr><td><code>MUSIC_HOST_DIR</code></td><td>Host folder with your music, mounted read-only into the container</td></tr>
  <tr><td><code>CTID</code></td><td>Container number, otherwise the next free one</td></tr>
  <tr><td><code>CT_CORES</code> <code>CT_RAM</code> <code>CT_SWAP</code> <code>CT_DISK</code></td><td>Cores, RAM and swap in MB, disk in GB (2 / 2048 / 2048 / 8)</td></tr>
  <tr><td><code>CT_BRIDGE</code> <code>CT_STORAGE</code></td><td>Network bridge (<code>vmbr0</code>) and storage</td></tr>
  <tr><td><code>TAILSCALE=1</code> / <code>0</code></td><td>Tailscale on or off without asking</td></tr>
  <tr><td><code>TS_AUTHKEY</code></td><td>Tailscale key, so you do not have to open a link</td></tr>
  <tr><td><code>PUBLIC=1</code> / <code>0</code></td><td><a href="#/share">Public links</a> on or off</td></tr>
  </tbody>
</table>
<h2>After the install</h2>
<p>Open the printed address in a browser or in an app and create the first account. Next: <a href="#/apps">Get the apps</a>.</p>
</template>

<template data-l="en" data-p="apps" data-g="Get started" data-t="Get the apps"><p class="lead">Download from <a href="../">musik.labtoso.de</a>, enter your server address once, done.</p>
<h2>Downloads</h2>

  <thead><tr><th>Device</th><th>File</th><th>How</th></tr></thead>

  <tr><td>Android</td><td><code>Streyn.apk</code></td><td>Open it and allow installs from this source. Plays in the background with lock screen controls.</td></tr>
  <tr><td>Windows</td><td><code>Streyn.exe</code></td><td>Run the setup. It installs for your user only into <code>%LOCALAPPDATA%\Streyn</code>, without admin rights, and starts Streyn. Remove it under <span class="path">Settings → Apps → Installed apps</span>. Media keys work.</td></tr>
  <tr><td>Linux</td><td><code>Streyn.AppImage</code></td><td>Make it executable and start it.</td></tr>
  <tr><td>Browser</td><td>–</td><td>Open the server address, or <strong>Web player</strong> on the home page.</td></tr>

<template data-l="en" data-p="sources" data-g="Listen" data-t="Music and Spotify"><p class="lead">Your own files always come first. Spotify, YouTube and others are optional, switched on under <span class="path">Settings → Sources</span>.</p>
<h2>Your own files</h2>
<p>Put them into the music folder (scanned every 30 minutes, or right away with <strong>Rescan library</strong>) or use <span class="path">Settings → Upload music</span>. MP3, FLAC, M4A/AAC, OGG, WAV and WebM work. Title, artist, album, cover and lyrics come from the tags. Your own songs can be removed with <strong>Delete from server</strong> in their menu.</p>
<h2>How a Spotify song plays</h2>

x="180.0" y="143.0" text-anchor="middle" style="font-size:13px">Your server</text><text class="sx" x="180.0" y="160.0" text-anchor="middle">finds the official</text><text class="sx" x="180.0" y="175.0" text-anchor="middle">upload on YouTube Music</text><rect class="nd" x="4.0" y="238" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="268.0" text-anchor="middle" style="font-size:13px">Your app</text><text class="sx" x="180.0" y="285.0" text-anchor="middle">plays the whole song</text><path class="ln" d="M180.0 70V92.0"/><path class="ln" d="M180.0 92.0V112" marker-end="url(#ar3t)"/><text class="lb" x="188.0" y="87.0">metadata</text><path class="ln" d="M180.0 194V216.0"/><path class="ln" d="M180.0 216.0V236" marker-end="url(#ar3t)"/><text class="lb" x="188.0" y="211.0">stream</text></svg></figure>
<p>Every Spotify song plays in full. The server looks for the official upload and skips covers, live and remix versions. With <strong>Download to server</strong> in the menu of an imported playlist, the server keeps those songs as files, so they play without YouTube and work offline.</p>
<h2>Connect Spotify</h2>
<ol class="steps">
  <li>Create an app on <a href="https://developer.spotify.com/dashboard">developer.spotify.com</a> with <strong>Web API</strong> ticked.</li>
  <li>Add this redirect URI: <code>https://musik.labtoso.de/spotify.html</code></li>
  <li>Paste the client ID under <span class="path">Settings → Sources → Spotify</span> and press <strong>Connect Spotify</strong>. The connection stays saved on the server for all your apps.</li>
</ol>
<div class="callout warn"><svg class="i" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17v.01"/></svg><div><span class="t">Spotify limits since February 2026</span><p>The owner of the developer app needs Premium, at most 5 users, and playlist contents only for your own or collaborative playlists. Copy other playlists into your library first, or import an Exportify CSV.</p></div></div>
<h2>Import playlists</h2>
<p><span class="path">Library → Imported → Import</span>: paste a link or pick a file. Songs you own play from your library, the rest through the source. <strong>Save as playlist</strong> turns it into a normal playlist.</p>

<h2>What you get</h2>
<table>
  <thead><tr><th>On Home</th><th>What it is</th></tr></thead>
  <tbody>
  <tr><td>Mix for you</td><td>Your favourites and new finds, sorted by your taste</td></tr>
  <tr><td>Streyn Mixes</td><td>Daily Mixes, a mix per genre you play most and per favourite artist, each with its own cover. Keep one with <strong>+</strong>, tap its title or cover to give it your own name, description and cover</td></tr>
  <tr><td>Spotify playlists</td><td>On the search page: Spotify's categories (charts, genres, moods …) with all their playlists, Spotify's own first. Open, play and save them like any playlist</td></tr>
  <tr><td>Your Top Songs</td><td>A playlist per year with the songs you played most (up to 100). A play counts after 30 seconds</td></tr>
  <tr><td>Start radio</td><td>In a song's menu: similar songs, and the queue keeps going</td></tr>
  <tr><td>Smart shuffle</td><td>Favourites more often, never the same artist twice in a row</td></tr>
  </tbody>
</table>
<p><span class="path">Settings → Taste &amp; mix</span> sets how much comes from your own files and how much from streaming, and switches Streyn Mixes or Top Songs off. Take a single song out of your taste from its menu.</p>
<h2>Library and playlists</h2>
<ul>
  <li><strong>Like</strong> any song, also from Spotify or YouTube. They collect in <strong>Liked songs</strong>.</li>
  <li><strong>Follow</strong> artists and <strong>save albums</strong> from their pages.</li>
  <li><strong>Playlists:</strong> <strong>+</strong> on a song adds it. <strong>Edit details</strong> sets picture, name and description, the cover editor makes one from colours, a photo or a song cover.</li>
  <li><strong>Sort:</strong> drag songs and playlists. On the phone the pencil opens an edit mode.</li>
  <li><strong>Pin to Home</strong> from a playlist's menu puts it right after Liked songs.</li>
  <li><strong>Preload</strong> (lightning button) puts a whole list on the server's disk so every song starts at once.</li>
</ul>
<p>Menus open with a right click on the computer, a long press on the phone, or the <strong>…</strong> button.</p>
<h2>Podcasts</h2>
<p>Podcasts work like on Spotify. Search finds shows and episodes below the music, <strong>Browse all → Podcasts</strong> shows the charts of your country, categories, the shows you follow and where you left off.</p>
<ul>
  <li><strong>Show page:</strong> cover, About, all episodes (newest or oldest first). <strong>Follow</strong> puts the show in your library and the sidebar.</li>
  <li><strong>Picks up where you stopped:</strong> every episode remembers its second on every device. A finished one shows <strong>Played</strong>; mark it by hand in its <strong>…</strong> menu.</li>
  <li><strong>Player:</strong> speed from 0.5× to 3×, 15 seconds back and forward, sleep timer (minutes or end of episode).</li>
  <li><strong>New episodes by themselves:</strong> the server looks at every followed show every few minutes. A new episode appears in Streyn at the same time as on Spotify, with a short note, and a blue dot marks the show until you open it.</li>
</ul>
<p>Search forgives accents, umlauts and small typos. Shows and charts come from the public Apple Podcasts directory, the episodes from each show's own feed, the sound through your server. Shows that are only on Spotify appear in the search with Spotify connected and open in Spotify, because they have no public feed.</p>
</template>

<template data-l="en" data-p="player" data-g="Listen" data-t="Player and Chillscreen"><p class="lead">Tap the small player (phone) or the song in the player bar (computer) for the big player with lyrics, queue and visualizer.</p>

<p>The desktop app can show “Listening to Streyn” with the song in your Discord status. Switch it on under <span class="path">Settings → Playback</span>.</p>

</div>

<div class="callout tip"><svg class="i" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.9V16h5v-.2c0-.8.4-1.5 1-1.9A6 6 0 0 0 12 3z"/></svg><div><span class="t">Themes +</span><p>Green appears once you switch on <strong>Themes +</strong> above the theme picker.</p></div></div>
<h3>Background</h3>
<p><span class="path">Settings → General → Background</span> puts a picture behind every theme: one of your own or one of ten ready-made ones (some with the Streyn logo). Two sliders below set its <strong>opacity</strong> and <strong>blur</strong>. Your own picture stays on this device.</p>
<p>The Streyn logo at the top left is also the Home button, on every device. Every song row has a heart next to the <strong>+</strong> that puts the song straight into your liked songs.</p>
<h2>Green on the PC</h2>
<p>With Green on and a window at least 900 pixels wide, Streyn switches to three panels. On phones Green keeps its phone layout.</p>
<figure class="one"><img class="shot " src="../shots/v2/d-green.webp" width="1920" height="1200" alt="Green on the PC" loading="lazy" data-zoom><figcaption>Library on the left, page in the middle, now playing on the right</figcaption></figure>
<ul>
  <li><strong>Top bar:</strong> the <strong>…</strong> menu (File, Edit, View, Playback, Help), back and forward, Home, search with <strong>Browse</strong>, What's New, Friend Activity and your profile.</li>
  <li><strong>Your Library</strong> on the left with filter chips. The library icon folds it to a strip of covers, <strong>+ Create</strong> makes a playlist, imports, uploads or starts your mix.</li>
  <li><strong>Right panel:</strong> cover, a lyrics preview that follows the song, the artist with monthly listeners, credits and the next song. The queue and <strong>Connect to a device</strong> open here too.</li>
  <li><strong>Miniplayer:</strong> the button next to the volume opens a small player. Its <strong>…</strong> sets the background colour and the queue.</li>
  <li><strong>Pages:</strong> playlists and albums show a song table, and a bar with a play button stays at the top while you scroll.</li>
  <li><strong>Zoom:</strong> <kbd>Ctrl</kbd> <kbd>+</kbd>, <kbd>Ctrl</kbd> <kbd>-</kbd> and <kbd>Ctrl</kbd> <kbd>0</kbd>, or View in the … menu.</li>
</ul>
<p>Green uses Figtree, a free font close to Spotify's. The other themes keep their own font.</p>
<h2>Make it yours</h2>
<ul>
  <li><strong>Light or dark</strong> for every theme, plus <strong>OLED mode</strong> (pure black) in dark mode.</li>
  <li><strong>Accent colour:</strong> ready-made colours, the colour of the playing cover, or <strong>Own colour</strong> with a colour field, hex input and a pipette on Windows and in Chrome.</li>
  <li><strong>Language:</strong> English or German, kept across updates.</li>
  <li><strong>Columns</strong> in song lists and <strong>platform logos</strong> can be switched on or off.</li>
</ul>
<figure class="one"><img class="shot " src="../shots/v2/x-settings.webp" width="1400" height="1027" alt="Settings" loading="lazy" data-zoom><figcaption>Settings → General with the theme picker</figcaption></figure>
</template>

<template data-l="en" data-p="away" data-g="Anywhere" data-t="On the go"><p class="lead">At home the apps reach your server over Wi-Fi. With Tailscale they reach it from anywhere, with no port forwarding and nothing open to the internet.</p>

erWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><rect class="nd" x="4.0" y="4" width="171.0" height="66" rx="10"/><text class="tx" x="89.5" y="34.0" text-anchor="middle" style="font-size:13px">At home</text><text class="sx" x="89.5" y="51.0" text-anchor="middle">phone on Wi-Fi</text><rect class="nd" x="185.0" y="4" width="171.0" height="66" rx="10"/><text class="tx" x="270.5" y="34.0" text-anchor="middle" style="font-size:13px">Away</text><text class="sx" x="270.5" y="51.0" text-anchor="middle">mobile data, other Wi-Fi</text><rect class="nd" x="4.0" y="114" width="171.0" height="66" rx="10"/><text class="tx" x="89.5" y="144.0" text-anchor="middle" style="font-size:13px">Your router</text><text class="sx" x="89.5" y="161.0" text-anchor="middle">home network</text><rect class="nd" x="185.0" y="114" width="171.0" height="66" rx="10"/><text class="tx" x="270.5" y="144.0" text-anchor="middle" style="font-size:13px">Tailscale</text><text class="sx" x="270.5" y="161.0" text-anchor="middle">private, encrypted</text><rect class="nd acc" x="4.0" y="224" width="352.0" height="80" rx="10"/><text class="tx" x="180.0" y="253.0" text-anchor="middle" style="font-size:13px">Streyn server</text><text class="sx" x="180.0" y="270.0" text-anchor="middle">same server</text><text class="sx" x="180.0" y="285.0" text-anchor="middle">same music</text><path class="ln" d="M89.5 70V92.0H89.5V112" marker-end="url(#ar5t)"/><path class="ln acc dash" d="M270.5 70V92.0H270.5V112" marker-end="url(#ar5t)"/><path class="ln" d="M89.5 180V202.0H180.0V222" marker-end="url(#ar5t)"/><path class="ln acc dash" d="M270.5 180V202.0H180.0V222" marker-end="url(#ar5t)"/></svg></figure>
<p>The app tries the home address first and switches to the Tailscale address by itself when you are away.</p>
<h2>Set it up</h2>
<ol class="steps">
  <li>Run the installer and pick <strong>2) With Tailscale</strong>. For an existing server just run it again.</li>
  <li>Open the link it shows and sign in to Tailscale (free).</li>
  <li>If the installer asks, click <strong>Enable HTTPS</strong> on <a href="https://login.tailscale.com/admin/dns">login.tailscale.com/admin/dns</a> and press Enter.</li>
  <li>Install the Tailscale app on your phone and sign in with the same account.</li>
  <li>Open Streyn once at home. From then on it works everywhere.</li>
</ol>
<p>The address is shown under <span class="path">Settings → On the go</span>.</p>
<h2>Without a link</h2>
<p>Create an auth key in the Tailscale admin under <strong>Settings → Keys</strong>:</p>
<pre data-lang="bash"><code>read -rsp "Tailscale auth key: " key; echo
TAILSCALE=1 TS_AUTHKEY="$key" bash -c "$(curl -fsSL https://raw.githubusercontent.com/Labtoso/Musik/main/deploy/proxmox.sh)"
unset key</code></pre>
<h2>Docker and Windows</h2>
<p>Install Tailscale on that computer from <a href="https://tailscale.com/download">tailscale.com/download</a>, then set the address and restart the server:</p>
<pre data-lang="env"><code>REMOTE_URL=http://100.x.y.z:8484</code></pre>
<div class="callout warn"><svg class="i" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17v.01"/></svg><div><span class="t">Battery saver</span><p>If Android stops Tailscale in the background, exclude it from battery optimisation.</p></div></div>
</template>

<template data-l="en" data-p="share" data-g="Anywhere" data-t="Share and invite"><p class="lead">Tap <strong>Share</strong> on a playlist or a song. With public links switched on, anyone can open it at musik.labtoso.de, no app and no account needed.</p>
<h2>Three ways to share</h2>
<table>
  <thead><tr><th>Share as</th><th>What the other person can do</th></tr></thead>
  <tbody>
  <tr><td>Link to listen</td><td>Listen in any browser, without signing in</td></tr>
  <tr><td>Invite as contributor</td><td>Make an account on the page (or sign in), then add and remove songs</td></tr>
  <tr><td>Invite as listener</td><td>Get the playlist in their library and always hear the latest version, without changing it</td></tr>
  </tbody>
</table>
<h2>Share a single song</h2>
<p>Every song can be shared on its own, also songs from Spotify, YouTube or Deezer: open the <strong>⋯</strong> menu of a song and pick <strong>Share</strong>, or tap the share icon next to the heart in the big player. On a computer the link is copied right away, on the phone the share sheet opens. The page plays the song for anyone, and when you are signed in, <strong>Add to Liked Songs</strong> puts it in your Liked songs. Chat apps like Discord or WhatsApp show the title, artist and cover.</p>
<p>As the owner, tap a member to switch between contributor and listener, or × to remove them. To give someone a normal account on your server, use <span class="path">Settings → Users → Invite link</span> (works once, for 7 days).</p>
<h2>How a public link works</h2>
<figure class="fig"><svg class="wide" viewBox="0 0 720 90" role="img"><defs><marker id="ar6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><rect class="nd" x="4.0" y="14.0" width="148.0" height="62" rx="10"/><text class="tx" x="78.0" y="42.0" text-anchor="middle" style="font-size:14px">Friend&#x27;s browser</text><text class="sx" x="78.0" y="59.0" text-anchor="middle">no app needed</text><rect class="nd" x="192.0" y="14.0" width="148.0" height="62" rx="10"/><text class="tx" x="266.0" y="42.0" text-anchor="middle" style="font-size:14px">musik.labtoso.de/s/</text><text class="sx" x="266.0" y="59.0" text-anchor="middle">the page</text><rect class="nd" x="380.0" y="14.0" width="148.0" height="62" rx="10"/><text class="tx" x="454.0" y="42.0" text-anchor="middle" style="font-size:14px">Tailscale Funnel</text><text class="sx" x="454.0" y="59.0" text-anchor="middle">port 8443</text><rect class="nd acc" x="568.0" y="14.0" width="148.0" height="62" rx="10"/><text class="tx" x="642.0" y="34.0" text-anchor="middle" style="font-size:14px">Your server</text><text class="sx" x="642.0" y="51.0" text-anchor="middle">public door: listen</text><text class="sx" x="642.0" y="66.0" text-anchor="middle">and join only</text><path class="ln" d="M152.0 45.0H172.0"/><path class="ln" d="M172.0 45.0H190.0" marker-end="url(#ar6)"/><path class="ln" d="M340.0 45.0H360.0"/><path class="ln" d="M360.0 45.0H378.0" marker-end="url(#ar6)"/><path class="ln" d="M528.0 45.0H548.0"/><path class="ln" d="M548.0 45.0H566.0" marker-end="url(#ar6)"/></svg><svg class="tall" viewBox="0 0 360 420" role="img"><defs><marker id="ar6t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><rect class="nd" x="4.0" y="4" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="34.0" text-anchor="middle" style="font-size:13px">Friend&#x27;s browser</text><text class="sx" x="180.0" y="51.0" text-anchor="middle">no app needed</text><rect class="nd" x="4.0" y="114" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="144.0" text-anchor="middle" style="font-size:13px">musik.labtoso.de/s/</text><text class="sx" x="180.0" y="161.0" text-anchor="middle">the page</text><rect class="nd" x="4.0" y="224" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="254.0" text-anchor="middle" style="font-size:13px">Tailscale Funnel</text><text class="sx" x="180.0" y="271.0" text-anchor="middle">port 8443</text><rect class="nd acc" x="4.0" y="334" width="352.0" height="80" rx="10"/><text class="tx" x="180.0" y="363.0" text-anchor="middle" style="font-size:13px">Your server</text><text class="sx" x="180.0" y="380.0" text-anchor="middle">public door: listen</text><text class="sx" x="180.0" y="395.0" text-anchor="middle">and join only</text><path class="ln" d="M180.0 70V92.0"/><path class="ln" d="M180.0 92.0V112" marker-end="url(#ar6t)"/><path class="ln" d="M180.0 180V202.0"/><path class="ln" d="M180.0 202.0V222" marker-end="url(#ar6t)"/><path class="ln" d="M180.0 290V312.0"/><path class="ln" d="M180.0 312.0V332" marker-end="url(#ar6t)"/></svg></figure>
<h2>Switch on public links</h2>
<p>Run the Proxmox installer again and answer <code>y</code> to <strong>Switch on public links?</strong>, or:</p>
<pre data-lang="bash"><code>TAILSCALE=1 PUBLIC=1 bash -c "$(curl -fsSL https://raw.githubusercontent.com/Labtoso/Musik/main/deploy/proxmox.sh)"</code></pre>
<p>See or change the address under <span class="path">Settings → On the go → Public links</span>. Switch off with <code>PUBLIC=0</code> or by clearing that field.</p>
<h3>Docker and Windows</h3>
<p>The server listens for public links on port 8485 (this computer only). On the computer with Tailscale:</p>
<pre data-lang="bash"><code>tailscale funnel --bg --https=8443 http://127.0.0.1:8485</code></pre>
<p>Then set <code>PUBLIC_URL=https://&lt;name&gt;.&lt;tailnet&gt;.ts.net:8443</code> and restart the server.</p>
<div class="callout info"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></svg><div><span class="t">Safe by design</span><p>Through the public door, setup, updates, user management, scans, uploads and admin sign-ins are closed. Sign-ins are limited to 20 a minute, and one invitation makes at most 25 accounts.</p></div></div>
</template>

<h2>Download</h2>
<p>Open a playlist, Liked songs, an imported or a Spotify playlist and tap the download arrow next to Share. The bar fills as songs arrive. Tap again to remove it. A downloaded list follows changes on the server.</p>
<h2>Without a connection</h2>
<p>When the server cannot be reached, the app starts in offline mode by itself. It looks and works as usual, a bar on top has a button to go online again. The page where you enter the server address also has <strong>Use offline</strong>.</p>
<h2>Manage storage</h2>
<p><span class="path">Settings → Offline</span> lists what is stored on this device, with its size, and removes it. The folder button next to <strong>On this device</strong> opens where the songs lie: Explorer or your file manager on the PC, the Files app (under "Streyn") on Android.</p>
<div class="callout info"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></svg><div><span class="t">Good to know</span><p>Songs that only stream (Spotify, YouTube) are kept once they were downloaded to the server with <strong>Download to server</strong>. The web player in the browser has no offline mode.</p></div></div>
</template>

<template data-l="en" data-p="help" data-g="Help" data-t="FAQ"><p class="lead">The most common problems and how to fix them. Still stuck? <a class="discord-link" href="https://discord.gg/bN2MTKwVaN" target="_blank" rel="noopener">Come on our Discord</a>.</p>
<h2>Connection</h2>
<details class="q"><summary>The app cannot find the server</summary><div><p>Check the address including the port (<code>:8484</code>) and that the phone is on the same Wi-Fi. <code>http://ADDRESS:8484/api/info</code> in a browser must show <code>"app":"musik"</code>. In the container run <code>systemctl status streyn</code>.</p></div></details>
<details class="q"><summary>Nothing works on the go</summary><div><p>Is Tailscale on and signed in with the same account on the phone? Exclude it from battery saving on Android. In the container run <code>tailscale status</code>.</p></div></details>
<h2>Music</h2>
<details class="q"><summary>New songs do not show up</summary><div><p>Press <strong>Rescan library</strong> in Settings. With a host folder, check that <code>MUSIC_HOST_DIR</code> was set and is readable.</p></div></details>
<details class="q"><summary>Spotify does not connect</summary><div><p>The redirect URI in the Spotify dashboard must be exactly <code>https://musik.labtoso.de/spotify.html</code>, and your Spotify account must be added as a user of the developer app.</p></div></details>
<details class="q"><summary>The wrong version of a song plays</summary><div><p>Report the song with its name in a GitHub issue. The server prefers official uploads and skips covers, live and remix versions.</p></div></details>
<h2>Apps</h2>
<details class="q"><summary>Android will not install the update</summary><div><p>Versions before 1.8.0 were signed with a different key. Uninstall Streyn once and install the new <code>Streyn.apk</code>.</p></div></details>
<details class="q"><summary>Where are the logs?</summary><div><pre data-lang="bash"><code>journalctl -u streyn -f</code></pre></div></details>
<h2>Still stuck?</h2>
<p><a class="discord-link" href="https://discord.gg/bN2MTKwVaN" target="_blank" rel="noopener">Come on our Discord</a>, we help you there.</p>
</template>

<template data-l="en" data-p="update" data-g="Help" data-t="Updates and backup"><p class="lead">A bar at the top tells you when a new version is out. <strong>Update</strong> does the rest, in the right order. Only an admin can update the server.</p>

e">bar or Settings → Updates</text><rect class="nd" x="4.0" y="114" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="144.0" text-anchor="middle" style="font-size:13px">1 App</text><text class="sx" x="180.0" y="161.0" text-anchor="middle">updates, restarts</text><rect class="nd" x="4.0" y="224" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="254.0" text-anchor="middle" style="font-size:13px">2 Backup</text><text class="sx" x="180.0" y="271.0" text-anchor="middle">copy of the database</text><rect class="nd" x="4.0" y="334" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="364.0" text-anchor="middle" style="font-size:13px">3 Server</text><text class="sx" x="180.0" y="381.0" text-anchor="middle">updates, restarts</text><path class="ln" d="M180.0 70V92.0"/><path class="ln" d="M180.0 92.0V112" marker-end="url(#ar8t)"/><path class="ln" d="M180.0 180V202.0"/><path class="ln" d="M180.0 202.0V222" marker-end="url(#ar8t)"/><path class="ln" d="M180.0 290V312.0"/><path class="ln" d="M180.0 312.0V332" marker-end="url(#ar8t)"/></svg></figure>
<p>The server update shows live what it does, line by line. Before every update the database is copied to <code>/var/lib/streyn/backups</code> (the last 5 are kept).</p>
<h2>Update by hand</h2>
<table>
  <thead><tr><th>What</th><th>How</th></tr></thead>
  <tbody>
  <tr><td>Proxmox</td><td>Run the installer again</td></tr>
  <tr><td>Debian / Ubuntu</td><td><code>sudo streyn-update</code></td></tr>
  <tr><td>Docker</td><td><code>git pull && docker compose up -d --build</code></td></tr>
  <tr><td>Apps</td><td>Install the new version from the website over the old one</td></tr>
  </tbody>
</table>
<h2>Backup</h2>
<p>The data folder is enough: <code>/var/lib/streyn</code> or <code>data/</code>. It holds the database, covers and uploaded songs. Easiest is a Proxmox backup of the container.</p>
</template>

<template data-l="en" data-p="config" data-g="Help" data-t="Advanced settings"><p class="lead">Settings live in <code>/etc/streyn.env</code> (container and Debian) or in a <code>.env</code> next to the server.</p>
<h2>Variables</h2>
<table>
  <thead><tr><th>Variable</th><th>Default</th><th>Meaning</th></tr></thead>
  <tbody>
  <tr><td><code>MUSIC_DIRS</code></td><td>Music folder</td><td>Song folders, several separated by <code>:</code> (Windows <code>;</code>)</td></tr>
  <tr><td><code>PORT</code></td><td>8484</td><td>Server port</td></tr>
  <tr><td><code>DATA_DIR</code></td><td><code>data</code></td><td>Database, covers, uploads</td></tr>
  <tr><td><code>SCAN_INTERVAL</code></td><td>30</td><td>Minutes between automatic scans</td></tr>
  <tr><td><code>SERVER_NAME</code></td><td>Streyn</td><td>Name in the apps and on share pages</td></tr>
  <tr><td><code>REMOTE_URL</code></td><td>–</td><td>Address on the go (set by the installer with Tailscale)</td></tr>
  <tr><td><code>PUBLIC_URL</code></td><td>–</td><td>Address for public links (set by the installer)</td></tr>
  <tr><td><code>HOST</code></td><td>0.0.0.0</td><td>Address it listens on</td></tr>
  </tbody>
</table>
<h2>Apply a change</h2>
<pre data-lang="bash"><code>systemctl restart streyn</code></pre>
<h2>Where things are</h2>
<table>
  <thead><tr><th>What</th><th>Container and Debian</th></tr></thead>
  <tbody>
  <tr><td>Settings</td><td><code>/etc/streyn.env</code></td></tr>
  <tr><td>Data</td><td><code>/var/lib/streyn</code></td></tr>
  <tr><td>Music</td><td><code>/srv/streyn</code></td></tr>
  <tr><td>Logs</td><td><code>journalctl -u streyn -f</code></td></tr>
  </tbody>
</table>
</template>

<template data-l="de" data-p="install" data-g="Erste Schritte" data-t="Server installieren"><p class="lead">Ein Befehl pro System. Später noch mal ausgeführt, aktualisiert er den Server, deine Daten bleiben.</p>
<h2>System wählen</h2>
<div class="tabs">
  <div role="tablist"><button role="tab">Proxmox</button><button role="tab">Debian / Ubuntu</button><button role="tab">ZimaOS / CasaOS</button><button role="tab">Docker</button><button role="tab">Windows</button></div>
  <div role="tabpanel">
    <p>In Proxmox die Node anklicken, <strong>Shell</strong> öffnen und einfügen:</p>
    <pre data-lang="bash"><code>bash -c "$(curl -fsSL https://raw.githubusercontent.com/Labtoso/Musik/main/deploy/proxmox.sh)"</code></pre>
    <p>Legt einen Debian-12-Container an (2 Kerne, 2 GB RAM, 8 GB Platte), fragt nach einem Musikordner auf dem Host (optional) und ob du <a href="#/away">Tailscale</a> willst, und zeigt am Ende die Adresse.</p>
  </div>
  <div role="tabpanel">
    <pre data-lang="bash"><code>curl -fsSL https://raw.githubusercontent.com/Labtoso/Musik/main/deploy/install.sh | sudo bash</code></pre>
    <p>Installiert den Dienst <code>streyn</code>. Optionen hinter <code>bash -s --</code>: <code>--music /pfad</code>, <code>--port 8484</code>, <code>--tailscale</code>, <code>--no-tailscale</code>, <code>--ts-authkey …</code></p>
  </div>
  <div role="tabpanel">
    <pre data-lang="bash"><code>curl -fsSL https://raw.githubusercontent.com/Labtoso/Musik/main/deploy/zimaos.sh | bash</code></pre>
    <p>Streyn erscheint als App auf dem Dashboard. Songs kommen nach <code>Media/Music</code>.</p>
  </div>
  <div role="tabpanel">
    <pre data-lang="bash"><code>git clone https://github.com/Labtoso/Musik.git && cd Musik && docker compose up -d --build</code></pre>
    <p>Musik in <code>music/</code>, Daten in <code>data/</code>, Port 8484.</p>
  </div>
  <div role="tabpanel">
    <p>In PowerShell: <code>try { Invoke-WebRequest https://github.com/Labtoso/Musik/releases/latest/download/streyn-server-windows-x64.exe -OutFile streyn-server.new.exe -ErrorAction Stop; Move-Item -Force streyn-server.new.exe streyn-server.exe; .\streyn-server.exe } catch { Remove-Item streyn-server.new.exe -ErrorAction Ignore; throw }</code>. Das lädt immer den neuesten Server; zum Updaten noch mal ausführen. Oder <code>streyn-server-windows-x64.exe</code> vom <a href="https://github.com/Labtoso/Musik/releases/latest">neuesten Release</a> laden und starten. Er nimmt deinen Musik-Ordner. Für einen anderen Ordner <code>MUSIC_DIRS=D:\Musik</code> in eine <code>.env</code> neben der exe schreiben.</p>
  </div>
</div>
<h2>Optionen für Proxmox</h2>
<p>Vor den Befehl setzen, zum Beispiel <code>MUSIC_HOST_DIR=/mnt/nas/music bash -c "…"</code>.</p>
<table>
  <thead><tr><th>Option</th><th>Bedeutung</th></tr></thead>
  <tbody>
  <tr><td><code>MUSIC_HOST_DIR</code></td><td>Ordner auf dem Host mit deiner Musik, nur lesend eingebunden</td></tr>
  <tr><td><code>CTID</code></td><td>Nummer des Containers, sonst die nächste freie</td></tr>
  <tr><td><code>CT_CORES</code> <code>CT_RAM</code> <code>CT_SWAP</code> <code>CT_DISK</code></td><td>Kerne, RAM und Swap in MB, Platte in GB (2 / 2048 / 2048 / 8)</td></tr>
  <tr><td><code>CT_BRIDGE</code> <code>CT_STORAGE</code></td><td>Netzwerk-Bridge (<code>vmbr0</code>) und Speicher</td></tr>
  <tr><td><code>TAILSCALE=1</code> / <code>0</code></td><td>Tailscale an oder aus, ohne Frage</td></tr>
  <tr><td><code>TS_AUTHKEY</code></td><td>Tailscale-Schlüssel, dann musst du keinen Link öffnen</td></tr>
  <tr><td><code>PUBLIC=1</code> / <code>0</code></td><td><a href="#/share">Öffentliche Links</a> an oder aus</td></tr>
  </tbody>
</table>
<h2>Nach der Installation</h2>
<p>Die angezeigte Adresse im Browser oder in einer App öffnen und das erste Konto anlegen. Weiter mit <a href="#/apps">Apps holen</a>.</p>

<template data-l="de" data-p="sources" data-g="Hören" data-t="Musik und Spotify"><p class="lead">Deine eigenen Dateien kommen immer zuerst. Spotify, YouTube und andere sind optional und werden unter <span class="path">Einstellungen → Quellen</span> eingeschaltet.</p>
<h2>Eigene Dateien</h2>
<p>In den Musikordner legen (wird alle 30 Minuten eingelesen, sofort mit <strong>Bibliothek neu einlesen</strong>) oder <span class="path">Einstellungen → Musik hochladen</span>. MP3, FLAC, M4A/AAC, OGG, WAV und WebM gehen. Titel, Künstler, Album, Cover und Songtexte kommen aus den Tags. Eigene Songs entfernst du mit <strong>Vom Server löschen</strong> im Menü.</p>

<h2>Was du bekommst</h2>
<table>
  <thead><tr><th>Auf der Startseite</th><th>Was es ist</th></tr></thead>
  <tbody>
  <tr><td>Mix für dich</td><td>Deine Favoriten und Neues, nach deinem Geschmack sortiert</td></tr>
  <tr><td>Streyn Mixes</td><td>Daily Mixes, ein Mix pro Genre, das du am meisten hörst, und pro Lieblingskünstler, jeder mit eigenem Cover. Mit <strong>+</strong> behalten, Titel oder Cover antippen für eigenen Namen, Beschreibung und Cover</td></tr>
  <tr><td>Spotify-Playlists</td><td>Auf der Suchseite: die Kategorien von Spotify (Charts, Genres, Stimmungen …) mit allen ihren Playlists, die von Spotify zuerst. Öffnen, abspielen und speichern wie jede Playlist</td></tr>
  <tr><td>Deine Top-Songs</td><td>Eine Playlist pro Jahr mit deinen meistgehörten Songs (bis 100). Ein Abspielen zählt nach 30 Sekunden</td></tr>
  <tr><td>Radio starten</td><td>Im Menü eines Songs: Ähnliches, die Warteschlange läuft weiter</td></tr>
  <tr><td>Schlaues Mischen</td><td>Favoriten öfter, nie zweimal derselbe Künstler hintereinander</td></tr>
  </tbody>
</table>
<p><span class="path">Einstellungen → Geschmack &amp; Mix</span> legt fest, wie viel aus deinen Dateien und wie viel aus dem Streaming kommt, und schaltet Streyn Mixes oder Top-Songs aus. Einen einzelnen Song nimmst du über sein Menü aus deinem Geschmack.</p>
<h2>Bibliothek und Playlists</h2>
<ul>
  <li><strong>Liken</strong> geht bei jedem Song, auch von Spotify oder YouTube. Sie landen in <strong>Lieblingssongs</strong>.</li>
  <li>Künstlern <strong>folgen</strong> und <strong>Alben speichern</strong> auf ihren Seiten.</li>
  <li><strong>Playlists:</strong> <strong>+</strong> an einem Song fügt ihn hinzu. <strong>Details bearbeiten</strong> setzt Bild, Name und Beschreibung, der Cover-Editor baut eins aus Farben, einem Foto oder einem Song-Cover.</li>
  <li><strong>Sortieren:</strong> Songs und Playlists ziehen. Am Handy öffnet der Stift einen Bearbeiten-Modus.</li>
  <li><strong>An Startseite anheften</strong> im Menü einer Playlist setzt sie direkt hinter Lieblingssongs.</li>
  <li><strong>Vorladen</strong> (Blitz-Knopf) legt eine ganze Liste auf die Platte des Servers, dann startet jeder Song sofort.</li>
</ul>
<p>Menüs öffnest du mit Rechtsklick am Computer, langem Drücken am Handy oder dem Knopf <strong>…</strong>.</p>
<h2>Podcasts</h2>
<p>Podcasts funktionieren wie bei Spotify. Die Suche findet Shows und Folgen unter der Musik, <strong>Alles durchsuchen → Podcasts</strong> zeigt die Charts deines Landes, Kategorien, deine Shows und wo du stehen geblieben bist.</p>
<ul>
  <li><strong>Show-Seite:</strong> Cover, Info, alle Folgen (neueste oder älteste zuerst). <strong>Folgen</strong> legt die Show in deine Bibliothek und die Seitenleiste.</li>
  <li><strong>Weiterhören:</strong> jede Folge merkt sich die Sekunde, auf jedem Gerät. Fertige Folgen zeigen <strong>Gehört</strong>, von Hand im Menü <strong>…</strong>.</li>
  <li><strong>Player:</strong> Tempo von 0,5× bis 3×, 15 Sekunden zurück und vor, Sleep-Timer (Minuten oder Ende der Folge).</li>
  <li><strong>Neue Folgen von selbst:</strong> der Server schaut alle paar Minuten bei jeder Show nach, der du folgst. Eine neue Folge erscheint in Streyn gleichzeitig wie auf Spotify, mit kurzem Hinweis, und ein blauer Punkt markiert die Show, bis du sie öffnest.</li>
</ul>
<p>Die Suche verzeiht Akzente, Umlaute und kleine Tippfehler. Shows und Charts kommen aus dem öffentlichen Apple-Podcasts-Verzeichnis, die Folgen aus dem Feed der Show, der Ton über deinen Server. Shows, die es nur auf Spotify gibt, erscheinen mit verbundenem Spotify in der Suche und öffnen sich in Spotify, weil sie keinen öffentlichen Feed haben.</p>
</template>

<template data-l="de" data-p="player" data-g="Hören" data-t="Player und Chillscreen"><p class="lead">Auf den kleinen Player (Handy) oder den Song in der Player-Leiste (Computer) tippen öffnet den großen Player mit Songtext, Warteschlange und Visualizer.</p>
<div class="gal phones three"><figure><img src="../shots/v2/m-fs.webp" width="780" height="1688" alt="Großer Player" loading="lazy" data-zoom><figcaption>Großer Player</figcaption></figure><figure><img src="../shots/v2/m-queue.webp" width="780" height="1688" alt="Warteschlange" loading="lazy" data-zoom><figcaption>Warteschlange</figcaption></figure><figure><img src="../shots/v2/m-green-fs.webp" width="780" height="1688" alt="Großer Player in Green" loading="lazy" data-zoom><figcaption>Großer Player in Green</figcaption></figure></div>
<h2>Chillscreen</h2>
<p>Ein gemütliches Zimmer bei Nacht: Ein Plattenspieler spielt das Cover deines Songs, deine Warteschlange hängt als Polaroids an der Wand, Regen läuft übers Fenster und die Kamera gleitet durch den Raum. Unter <span class="path">Einstellungen → Chillscreen</span> einschalten und im großen Player über seinen Knopf öffnen. <strong>Übergänge zur Musik</strong> wechselt die Einstellung im Takt oder pro Takt-Gruppe.</p>
<div class="gal two"><figure><img src="../shots/v2/c-shot1.webp" width="1600" height="900" alt="Der Plattenspieler" loading="lazy" data-zoom><figcaption>Der Plattenspieler</figcaption></figure><figure><img src="../shots/v2/c-room.webp" width="1280" height="720" alt="Das Zimmer" loading="lazy" data-zoom><figcaption>Das Zimmer</figcaption></figure><figure><img src="../shots/v2/c-shot3.webp" width="1600" height="900" alt="Plattenwechsel" loading="lazy" data-zoom><figcaption>Plattenwechsel</figcaption></figure><figure><img src="../shots/v2/c-chair.webp" width="1280" height="720" alt="Sessel-Ecke" loading="lazy" data-zoom><figcaption>Sessel-Ecke</figcaption></figure></div>
<h2>Klang</h2>
<table>
  <thead><tr><th>Einstellung</th><th>Wo</th><th>Was sie macht</th></tr></thead>
  <tbody>
  <tr><td>Überblenden, Lautstärke, Qualität</td><td><span class="path">Einstellungen → Wiedergabe</span></td><td>Songs gehen ineinander über, alle gleich laut, Streaming-Qualität von niedrig bis sehr hoch</td></tr>
  <tr><td>Equalizer</td><td><span class="path">Einstellungen → Equalizer</span></td><td>10 Bänder, Vorverstärkung und Presets. Wirkt auf Songs von deinem Server</td></tr>
  <tr><td>Visualizer</td><td><span class="path">Einstellungen → Visualizer</span></td><td>Balken, Kreis oder Welle in den Farben des Covers, auch als dünner Streifen unter dem Mini-Player</td></tr>
  <tr><td>Songtexte</td><td>Großer Player</td><td>Synchrone Texte laufen mit, Tipp auf eine Zeile springt hin</td></tr>
  </tbody>
</table>
<h2>Geräte</h2>
<p><span class="path">Einstellungen → Geräte</span> zeigt, wo die Musik spielt: Handy, Kopfhörer oder Bluetooth. Optional: Pause beim Trennen, weiterspielen, wenn das Gerät zurückkommt. Du siehst auch, was auf deinen anderen Geräten läuft, und kannst es anhalten oder mit <strong>Hier abspielen</strong> übernehmen.</p>
<h2>Discord-Status</h2>
<p>Die Desktop-App zeigt auf Wunsch „Hört Streyn“ mit dem Song in deinem Discord-Status. Einschalten unter <span class="path">Einstellungen → Wiedergabe</span>.</p>
<div class="callout info"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></svg><div><span class="t">Android-Berechtigungen</span><p>Android fragt einmal nach „Audio aufnehmen“ für den Visualizer und nach Bluetooth für volle Gerätenamen. Aufgenommen wird nichts, und nach einem Nein fragt die App nicht noch mal.</p></div></div>
</template>

<template data-l="de" data-p="look" data-g="Hören" data-t="Designs"><p class="lead">Drei Looks, jeder hell oder dunkel. Ändern unter <span class="path">Einstellungen → Allgemein → Design</span> oder im Startassistenten.</p>
<div class="themes">
  <figure><img class="shot " src="../shots/v2/d-home.webp" width="1920" height="1200" alt="Standard" loading="lazy" data-zoom><figcaption><b>Standard</b>Ruhig und klar, voreingestellt</figcaption></figure>
  <figure><img class="shot " src="../shots/v2/d-glass.webp" width="1920" height="1200" alt="Liquid Glass" loading="lazy" data-zoom><figcaption><b>Liquid Glass</b>Klares Glas, das das Licht bricht, Kanten, die Maus oder Neigung des Handys folgen</figcaption></figure>
  <figure><img class="shot " src="../shots/v2/d-green.webp" width="1920" height="1200" alt="Green" loading="lazy" data-zoom><figcaption><b>Green</b>Schwarz mit grünem Akzent, große Titel, ein runder Play-Knopf, der aus den Covern steigt</figcaption></figure>
</div>
<div class="gal phones three"><figure><img src="../shots/v2/m-home.webp" width="780" height="1688" alt="Standard" loading="lazy" data-zoom><figcaption>Standard</figcaption></figure><figure><img src="../shots/v2/m-glass.webp" width="780" height="1688" alt="Liquid Glass" loading="lazy" data-zoom><figcaption>Liquid Glass</figcaption></figure><figure><img src="../shots/v2/m-green-fs.webp" width="780" height="1688" alt="Green" loading="lazy" data-zoom><figcaption>Green</figcaption></figure></div>
<div class="callout tip"><svg class="i" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.9V16h5v-.2c0-.8.4-1.5 1-1.9A6 6 0 0 0 12 3z"/></svg><div><span class="t">Themes +</span><p>Green erscheint, sobald du über dem Design-Wähler <strong>Themes +</strong> einschaltest.</p></div></div>
<h3>Hintergrund</h3>
<p><span class="path">Einstellungen → Allgemein → Hintergrund</span> legt ein Bild hinter jedes Design: ein eigenes oder eines von zehn fertigen (manche mit dem Streyn-Logo). Mit den zwei Reglern darunter stellst du <strong>Deckkraft</strong> und <strong>Unschärfe</strong> ein. Dein eigenes Bild bleibt auf diesem Gerät.</p>
<p>Das Streyn-Logo oben links ist auch der Home-Knopf, auf jedem Gerät. Jede Songzeile hat neben dem <strong>+</strong> ein Herz, das den Song direkt in deine Lieblingssongs legt.</p>
<h2>Green am PC</h2>
<p>Wenn Green an ist und das Fenster mindestens 900 Pixel breit ist, zeigt Streyn drei Bereiche nebeneinander. Am Handy bleibt Green beim Handy-Layout.</p>
<figure class="one"><img class="shot " src="../shots/v2/d-green.webp" width="1920" height="1200" alt="Green am PC" loading="lazy" data-zoom><figcaption>Bibliothek links, Seite in der Mitte, „Wird gerade gespielt“ rechts</figcaption></figure>
<ul>
  <li><strong>Obere Leiste:</strong> das Menü <strong>…</strong> (Datei, Bearbeiten, Anzeigen, Wiedergabe, Hilfe), zurück und vor, Home, Suche mit <strong>Browse</strong>, Neues, Höraktivität und dein Profil.</li>
  <li><strong>Bibliothek</strong> links mit Filter-Chips. Das Bibliothek-Symbol klappt sie zu einer Leiste mit Covern zusammen, <strong>+ Erstellen</strong> legt eine Playlist an, importiert, lädt hoch oder startet deinen Mix.</li>
  <li><strong>Bereich rechts:</strong> Cover, eine mitlaufende Lyrics-Vorschau, Künstler*in mit monatlichen Hörer*innen, Songinfos und der nächste Titel. Auch Warteschlange und <strong>Mit einem Gerät verbinden</strong> öffnen sich hier.</li>
  <li><strong>Miniplayer:</strong> der Knopf neben der Lautstärke öffnet einen kleinen Player. Über <strong>…</strong> stellst du Hintergrundfarbe und Warteschlange ein.</li>
  <li><strong>Seiten:</strong> Playlists und Alben zeigen eine Songtabelle, beim Scrollen bleibt oben eine Leiste mit Play-Knopf stehen.</li>
  <li><strong>Zoom:</strong> <kbd>Strg</kbd> <kbd>+</kbd>, <kbd>Strg</kbd> <kbd>-</kbd> und <kbd>Strg</kbd> <kbd>0</kbd>, oder Anzeigen im Menü ….</li>
</ul>
<p>Green nutzt Figtree, eine freie Schrift nahe an der von Spotify. Die anderen Designs behalten ihre Schrift.</p>
<h2>Mach es zu deinem</h2>
<ul>
  <li><strong>Hell oder dunkel</strong> für jedes Design, dazu <strong>OLED-Modus</strong> (reines Schwarz) im dunklen Modus.</li>
  <li><strong>Akzentfarbe:</strong> fertige Farben, die Farbe des laufenden Covers oder <strong>Eigene Farbe</strong> mit Farbfeld, Hex-Eingabe und Pipette unter Windows und in Chrome.</li>
  <li><strong>Sprache:</strong> Englisch oder Deutsch, bleibt über Updates erhalten.</li>
  <li><strong>Spalten</strong> in Songlisten und <strong>Plattform-Logos</strong> lassen sich ein- und ausschalten.</li>
</ul>
<figure class="one"><img class="shot " src="../shots/v2/x-settings.webp" width="1400" height="1027" alt="Einstellungen" loading="lazy" data-zoom><figcaption>Einstellungen → Allgemein mit dem Design-Wähler</figcaption></figure>
</template>
