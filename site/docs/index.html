<p>Die App probiert zuerst die Adresse zuhause und wechselt unterwegs von selbst auf die Tailscale-Adresse.</p>
<h2>Einrichten</h2>
<ol class="steps">
  <li>Installer ausführen und <strong>2) With Tailscale</strong> wählen. Bei einem bestehenden Server einfach noch mal ausführen.</li>
  <li>Den angezeigten Link öffnen und bei Tailscale anmelden (kostenlos).</li>
  <li>Fragt der Installer danach, auf <a href="https://login.tailscale.com/admin/dns">login.tailscale.com/admin/dns</a> <strong>Enable HTTPS</strong> klicken und Enter drücken.</li>
  <li>Tailscale-App aufs Handy und mit demselben Konto anmelden.</li>
  <li>Streyn einmal zuhause öffnen. Ab dann geht es überall.</li>
</ol>
<p>Die Adresse steht unter <span class="path">Einstellungen → Unterwegs</span>.</p>
<h2>Ohne Link</h2>
<p>In der Tailscale-Verwaltung unter <strong>Settings → Keys</strong> einen Auth-Key anlegen:</p>
<pre data-lang="bash"><code>read -rsp "Tailscale auth key: " key; echo
TAILSCALE=1 TS_AUTHKEY="$key" bash -c "$(curl -fsSL https://raw.githubusercontent.com/Labtoso/Musik/main/deploy/proxmox.sh)"
unset key</code></pre>
<h2>Docker und Windows</h2>
<p>Tailscale auf dem Rechner installieren (<a href="https://tailscale.com/download">tailscale.com/download</a>), dann die Adresse eintragen und den Server neu starten:</p>
<pre data-lang="env"><code>REMOTE_URL=http://100.x.y.z:8484</code></pre>
<div class="callout warn"><svg class="i" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17v.01"/></svg><div><span class="t">Akku-Sparmodus</span><p>Beendet Android Tailscale im Hintergrund, nimm es von der Akku-Optimierung aus.</p></div></div>
</template>

<template data-l="de" data-p="share" data-g="Überall" data-t="Teilen und einladen"><p class="lead">In einer Playlist oder bei einem Song auf <strong>Teilen</strong> tippen. Mit öffentlichen Links öffnet sie jeder auf musik.labtoso.de, ohne App und ohne Konto.</p>
<h2>Drei Arten zu teilen</h2>
<table>
  <thead><tr><th>Teilen als</th><th>Was die andere Person kann</th></tr></thead>
  <tbody>
  <tr><td>Link zum Anhören</td><td>In jedem Browser reinhören, ohne Anmeldung</td></tr>
  <tr><td>Als Mitwirkenden einladen</td><td>Auf der Seite ein Konto anlegen (oder anmelden), dann Songs hinzufügen und entfernen</td></tr>
  <tr><td>Als Zuhörer einladen</td><td>Die Playlist in der eigenen Bibliothek haben und immer die neueste Version hören, ohne sie zu ändern</td></tr>
  </tbody>
</table>
<h2>Einzelne Songs teilen</h2>
<p>Jeder Song lässt sich einzeln teilen, auch Songs von Spotify, YouTube oder Deezer: Im <strong>⋯</strong>-Menü eines Songs auf <strong>Teilen</strong> tippen, oder im großen Player auf das Teilen-Symbol neben dem Herz. Am Computer wird der Link sofort kopiert, am Handy öffnet sich das Teilen-Menü. Die Seite spielt den Song für jeden ab, und wer angemeldet ist, legt ihn mit <strong>Zu Lieblingssongs hinzufügen</strong> in die eigenen Lieblingssongs. Chat-Apps wie Discord oder WhatsApp zeigen Titel, Künstler und Cover.</p>
<p>Als Besitzer tippst du auf ein Mitglied, um zwischen Mitwirkend und Zuhörer zu wechseln, oder auf ×, um es zu entfernen. Ein normales Konto auf deinem Server gibst du jemandem mit <span class="path">Einstellungen → Nutzer → Einladungslink</span> (einmal gültig, 7 Tage).</p>
<h2>So läuft ein öffentlicher Link</h2>
<figure class="fig"><svg class="wide" viewBox="0 0 720 90" role="img"><defs><marker id="ar14" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><rect class="nd" x="4.0" y="14.0" width="148.0" height="62" rx="10"/><text class="tx" x="78.0" y="42.0" text-anchor="middle" style="font-size:14px">Browser des Freundes</text><text class="sx" x="78.0" y="59.0" text-anchor="middle">keine App nötig</text><rect class="nd" x="192.0" y="14.0" width="148.0" height="62" rx="10"/><text class="tx" x="266.0" y="42.0" text-anchor="middle" style="font-size:14px">musik.labtoso.de/s/</text><text class="sx" x="266.0" y="59.0" text-anchor="middle">die Seite</text><rect class="nd" x="380.0" y="14.0" width="148.0" height="62" rx="10"/><text class="tx" x="454.0" y="42.0" text-anchor="middle" style="font-size:14px">Tailscale Funnel</text><text class="sx" x="454.0" y="59.0" text-anchor="middle">Port 8443</text><rect class="nd acc" x="568.0" y="14.0" width="148.0" height="62" rx="10"/><text class="tx" x="642.0" y="34.0" text-anchor="middle" style="font-size:14px">Dein Server</text><text class="sx" x="642.0" y="51.0" text-anchor="middle">öffentliche Tür: nur</text><text class="sx" x="642.0" y="66.0" text-anchor="middle">hören und beitreten</text><path class="ln" d="M152.0 45.0H172.0"/><path class="ln" d="M172.0 45.0H190.0" marker-end="url(#ar14)"/><path class="ln" d="M340.0 45.0H360.0"/><path class="ln" d="M360.0 45.0H378.0" marker-end="url(#ar14)"/><path class="ln" d="M528.0 45.0H548.0"/><path class="ln" d="M548.0 45.0H566.0" marker-end="url(#ar14)"/></svg><svg class="tall" viewBox="0 0 360 420" role="img"><defs><marker id="ar14t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><rect class="nd" x="4.0" y="4" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="34.0" text-anchor="middle" style="font-size:13px">Browser des Freundes</text><text class="sx" x="180.0" y="51.0" text-anchor="middle">keine App nötig</text><rect class="nd" x="4.0" y="114" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="144.0" text-anchor="middle" style="font-size:13px">musik.labtoso.de/s/</text><text class="sx" x="180.0" y="161.0" text-anchor="middle">die Seite</text><rect class="nd" x="4.0" y="224" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="254.0" text-anchor="middle" style="font-size:13px">Tailscale Funnel</text><text class="sx" x="180.0" y="271.0" text-anchor="middle">Port 8443</text><rect class="nd acc" x="4.0" y="334" width="352.0" height="80" rx="10"/><text class="tx" x="180.0" y="363.0" text-anchor="middle" style="font-size:13px">Dein Server</text><text class="sx" x="180.0" y="380.0" text-anchor="middle">öffentliche Tür: nur</text><text class="sx" x="180.0" y="395.0" text-anchor="middle">hören und beitreten</text><path class="ln" d="M180.0 70V92.0"/><path class="ln" d="M180.0 92.0V112" marker-end="url(#ar14t)"/><path class="ln" d="M180.0 180V202.0"/><path class="ln" d="M180.0 202.0V222" marker-end="url(#ar14t)"/><path class="ln" d="M180.0 290V312.0"/><path class="ln" d="M180.0 312.0V332" marker-end="url(#ar14t)"/></svg></figure>
<h2>Öffentliche Links einschalten</h2>
<p>Den Proxmox-Installer noch mal ausführen und bei <strong>Switch on public links?</strong> mit <code>y</code> antworten, oder:</p>
<pre data-lang="bash"><code>TAILSCALE=1 PUBLIC=1 bash -c "$(curl -fsSL https://raw.githubusercontent.com/Labtoso/Musik/main/deploy/proxmox.sh)"</code></pre>
<p>Die Adresse siehst und änderst du unter <span class="path">Einstellungen → Unterwegs → Öffentliche Links</span>. Ausschalten mit <code>PUBLIC=0</code> oder indem du das Feld leerst.</p>
<h3>Docker und Windows</h3>
<p>Der Server hört für öffentliche Links auf Port 8485 (nur auf diesem Rechner). Auf dem Rechner mit Tailscale:</p>
<pre data-lang="bash"><code>tailscale funnel --bg --https=8443 http://127.0.0.1:8485</code></pre>
<p>Dann <code>PUBLIC_URL=https://&lt;name&gt;.&lt;tailnet&gt;.ts.net:8443</code> eintragen und den Server neu starten.</p>
<div class="callout info"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></svg><div><span class="t">Sicher gebaut</span><p>Durch die öffentliche Tür sind Einrichtung, Updates, Nutzerverwaltung, Scans, Uploads und Admin-Anmeldungen gesperrt. Anmeldungen sind auf 20 pro Minute begrenzt, und eine Einladung reicht für höchstens 25 Konten.</p></div></div>
</template>

<template data-l="de" data-p="offline" data-g="Überall" data-t="Offline"><p class="lead">Listen in der Android- oder Desktop-App herunterladen, dann spielen sie ohne Server, im Flugzeug oder im Funkloch.</p>
<figure class="fig"><svg class="wide" viewBox="0 0 720 90" role="img"><defs><marker id="ar15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><rect class="nd" x="4.0" y="14.0" width="200.0" height="62" rx="10"/><text class="tx" x="104.0" y="34.0" text-anchor="middle" style="font-size:14px">Eine Liste auf dem Server</text><text class="sx" x="104.0" y="51.0" text-anchor="middle">Playlist, Lieblingssongs</text><text class="sx" x="104.0" y="66.0" text-anchor="middle">importiert, Spotify</text><rect class="nd acc" x="260.0" y="14.0" width="200.0" height="62" rx="10"/><text class="tx" x="360.0" y="42.0" text-anchor="middle" style="font-size:14px">Herunterladen</text><text class="sx" x="360.0" y="59.0" text-anchor="middle">Pfeil neben Teilen</text><rect class="nd" x="516.0" y="14.0" width="200.0" height="62" rx="10"/><text class="tx" x="616.0" y="42.0" text-anchor="middle" style="font-size:14px">Spielt offline</text><text class="sx" x="616.0" y="59.0" text-anchor="middle">auf diesem Gerät</text><path class="ln" d="M204.0 45.0H232.0"/><path class="ln" d="M232.0 45.0H258.0" marker-end="url(#ar15)"/><path class="ln" d="M460.0 45.0H488.0"/><path class="ln" d="M488.0 45.0H514.0" marker-end="url(#ar15)"/></svg><svg class="tall" viewBox="0 0 360 310" role="img"><defs><marker id="ar15t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><rect class="nd" x="4.0" y="4" width="352.0" height="80" rx="10"/><text class="tx" x="180.0" y="33.0" text-anchor="middle" style="font-size:13px">Eine Liste auf dem Server</text><text class="sx" x="180.0" y="50.0" text-anchor="middle">Playlist, Lieblingssongs</text><text class="sx" x="180.0" y="65.0" text-anchor="middle">importiert, Spotify</text><rect class="nd acc" x="4.0" y="128" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="158.0" text-anchor="middle" style="font-size:13px">Herunterladen</text><text class="sx" x="180.0" y="175.0" text-anchor="middle">Pfeil neben Teilen</text><rect class="nd" x="4.0" y="238" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="268.0" text-anchor="middle" style="font-size:13px">Spielt offline</text><text class="sx" x="180.0" y="285.0" text-anchor="middle">auf diesem Gerät</text><path class="ln" d="M180.0 84V106.0"/><path class="ln" d="M180.0 106.0V126" marker-end="url(#ar15t)"/><path class="ln" d="M180.0 194V216.0"/><path class="ln" d="M180.0 216.0V236" marker-end="url(#ar15t)"/></svg></figure>
<h2>Herunterladen</h2>
<p>Eine Playlist, Lieblingssongs, eine importierte oder eine Spotify-Playlist öffnen und auf den Pfeil neben Teilen tippen. Der Balken füllt sich mit jedem Song. Noch mal tippen entfernt sie. Eine geladene Liste folgt Änderungen auf dem Server.</p>
<h2>Ohne Verbindung</h2>
<p>Ist der Server nicht erreichbar, startet die App von selbst offline. Sie sieht aus und funktioniert wie immer, eine Leiste oben hat einen Knopf, um wieder online zu gehen. Auf der Seite für die Server-Adresse gibt es außerdem <strong>Offline nutzen</strong>.</p>
<h2>Speicher verwalten</h2>
<p><span class="path">Einstellungen → Offline</span> zeigt, was auf diesem Gerät liegt und wie groß es ist, und entfernt es. Der Ordner-Knopf neben <strong>Auf diesem Gerät</strong> öffnet den Speicherort: Explorer oder Dateimanager am PC, die Dateien-App (unter „Streyn") auf Android.</p>
<div class="callout info"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></svg><div><span class="t">Gut zu wissen</span><p>Songs, die nur streamen (Spotify, YouTube), bleiben offline, sobald sie mit <strong>Auf den Server laden</strong> auf dem Server liegen. Der Webplayer im Browser hat keinen Offline-Modus.</p></div></div>
</template>

<template data-l="de" data-p="help" data-g="Hilfe" data-t="FAQ"><p class="lead">Die häufigsten Probleme und wie du sie löst. Hängst du fest? <a class="discord-link" href="https://discord.gg/bN2MTKwVaN" target="_blank" rel="noopener">Komm auf unseren Discord</a>.</p>
<h2>Verbindung</h2>
<details class="q"><summary>Die App findet den Server nicht</summary><div><p>Adresse mit Port (<code>:8484</code>) prüfen und ob das Handy im selben WLAN ist. <code>http://ADRESSE:8484/api/info</code> im Browser muss <code>"app":"musik"</code> zeigen. Im Container <code>systemctl status streyn</code> ausführen.</p></div></details>
<details class="q"><summary>Unterwegs geht nichts</summary><div><p>Ist Tailscale auf dem Handy an und mit demselben Konto angemeldet? Auf Android von der Akku-Optimierung ausnehmen. Im Container <code>tailscale status</code> ausführen.</p></div></details>
<h2>Musik</h2>
<details class="q"><summary>Neue Songs tauchen nicht auf</summary><div><p>In den Einstellungen <strong>Bibliothek neu einlesen</strong> drücken. Bei einem Host-Ordner prüfen, ob <code>MUSIC_HOST_DIR</code> gesetzt war und lesbar ist.</p></div></details>
<details class="q"><summary>Spotify verbindet sich nicht</summary><div><p>Die Redirect URI im Spotify-Dashboard muss genau <code>https://musik.labtoso.de/spotify.html</code> sein, und dein Spotify-Konto muss als Nutzer der Entwickler-App eingetragen sein.</p></div></details>
<details class="q"><summary>Es läuft die falsche Version eines Songs</summary><div><p>Melde den Song mit Namen in einem GitHub-Issue. Der Server nimmt offizielle Uploads zuerst und überspringt Cover-, Live- und Remix-Versionen.</p></div></details>
<h2>Apps</h2>
<details class="q"><summary>Android installiert das Update nicht</summary><div><p>Versionen vor 1.8.0 hatten einen anderen Schlüssel. Streyn einmal deinstallieren und die neue <code>Streyn.apk</code> installieren.</p></div></details>
<details class="q"><summary>Wo sind die Logs?</summary><div><pre data-lang="bash"><code>journalctl -u streyn -f</code></pre></div></details>
<h2>Hängst du fest?</h2>
<p><a class="discord-link" href="https://discord.gg/bN2MTKwVaN" target="_blank" rel="noopener">Komm auf unseren Discord</a>, dort helfen wir dir.</p>
</template>

<template data-l="de" data-p="update" data-g="Hilfe" data-t="Updates und Sicherung"><p class="lead">Eine Leiste oben sagt dir, wenn eine neue Version da ist. <strong>Updaten</strong> macht den Rest, in der richtigen Reihenfolge. Den Server darf nur ein Admin updaten.</p>
<figure class="fig"><svg class="wide" viewBox="0 0 720 90" role="img"><defs><marker id="ar16" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><rect class="nd acc" x="4.0" y="14.0" width="148.0" height="62" rx="10"/><text class="tx" x="78.0" y="42.0" text-anchor="middle" style="font-size:14px">Updaten</text><text class="sx" x="78.0" y="59.0" text-anchor="middle">Leiste oder Einstellungen</text><rect class="nd" x="192.0" y="14.0" width="148.0" height="62" rx="10"/><text class="tx" x="266.0" y="42.0" text-anchor="middle" style="font-size:14px">1 App</text><text class="sx" x="266.0" y="59.0" text-anchor="middle">aktualisiert, startet neu</text><rect class="nd" x="380.0" y="14.0" width="148.0" height="62" rx="10"/><text class="tx" x="454.0" y="42.0" text-anchor="middle" style="font-size:14px">2 Sicherung</text><text class="sx" x="454.0" y="59.0" text-anchor="middle">Kopie der Datenbank</text><rect class="nd" x="568.0" y="14.0" width="148.0" height="62" rx="10"/><text class="tx" x="642.0" y="42.0" text-anchor="middle" style="font-size:14px">3 Server</text><text class="sx" x="642.0" y="59.0" text-anchor="middle">aktualisiert, startet neu</text><path class="ln" d="M152.0 45.0H172.0"/><path class="ln" d="M172.0 45.0H190.0" marker-end="url(#ar16)"/><path class="ln" d="M340.0 45.0H360.0"/><path class="ln" d="M360.0 45.0H378.0" marker-end="url(#ar16)"/><path class="ln" d="M528.0 45.0H548.0"/><path class="ln" d="M548.0 45.0H566.0" marker-end="url(#ar16)"/></svg><svg class="tall" viewBox="0 0 360 406" role="img"><defs><marker id="ar16t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><rect class="nd acc" x="4.0" y="4" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="34.0" text-anchor="middle" style="font-size:13px">Updaten</text><text class="sx" x="180.0" y="51.0" text-anchor="middle">Leiste oder Einstellungen</text><rect class="nd" x="4.0" y="114" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="144.0" text-anchor="middle" style="font-size:13px">1 App</text><text class="sx" x="180.0" y="161.0" text-anchor="middle">aktualisiert, startet neu</text><rect class="nd" x="4.0" y="224" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="254.0" text-anchor="middle" style="font-size:13px">2 Sicherung</text><text class="sx" x="180.0" y="271.0" text-anchor="middle">Kopie der Datenbank</text><rect class="nd" x="4.0" y="334" width="352.0" height="66" rx="10"/><text class="tx" x="180.0" y="364.0" text-anchor="middle" style="font-size:13px">3 Server</text><text class="sx" x="180.0" y="381.0" text-anchor="middle">aktualisiert, startet neu</text><path class="ln" d="M180.0 70V92.0"/><path class="ln" d="M180.0 92.0V112" marker-end="url(#ar16t)"/><path class="ln" d="M180.0 180V202.0"/><path class="ln" d="M180.0 202.0V222" marker-end="url(#ar16t)"/><path class="ln" d="M180.0 290V312.0"/><path class="ln" d="M180.0 312.0V332" marker-end="url(#ar16t)"/></svg></figure>
<p>Das Server-Update zeigt live, was es macht, Zeile für Zeile. Vor jedem Update wird die Datenbank nach <code>/var/lib/streyn/backups</code> kopiert (die letzten 5 bleiben).</p>
<h2>Von Hand updaten</h2>
<table>
  <thead><tr><th>Was</th><th>Wie</th></tr></thead>
  <tbody>
  <tr><td>Proxmox</td><td>Installer noch mal ausführen</td></tr>
  <tr><td>Debian / Ubuntu</td><td><code>sudo streyn-update</code></td></tr>
  <tr><td>Docker</td><td><code>git pull && docker compose up -d --build</code></td></tr>
  <tr><td>Apps</td><td>Neue Version von der Website drüber installieren</td></tr>
  </tbody>
</table>
<h2>Sicherung</h2>
<p>Der Datenordner reicht: <code>/var/lib/streyn</code> bzw. <code>data/</code>. Darin liegen Datenbank, Cover und hochgeladene Songs. Am einfachsten ist ein Proxmox-Backup des Containers.</p>
</template>

<template data-l="de" data-p="config" data-g="Hilfe" data-t="Erweiterte Einstellungen"><p class="lead">Die Einstellungen stehen in <code>/etc/streyn.env</code> (Container und Debian) oder in einer <code>.env</code> neben dem Server.</p>
<h2>Variablen</h2>
<table>
  <thead><tr><th>Variable</th><th>Standard</th><th>Bedeutung</th></tr></thead>
  <tbody>
  <tr><td><code>MUSIC_DIRS</code></td><td>Musik-Ordner</td><td>Ordner mit Songs, mehrere mit <code>:</code> (Windows <code>;</code>)</td></tr>
  <tr><td><code>PORT</code></td><td>8484</td><td>Port des Servers</td></tr>
  <tr><td><code>DATA_DIR</code></td><td><code>data</code></td><td>Datenbank, Cover, Uploads</td></tr>
  <tr><td><code>SCAN_INTERVAL</code></td><td>30</td><td>Minuten zwischen automatischen Scans</td></tr>
  <tr><td><code>SERVER_NAME</code></td><td>Streyn</td><td>Name in den Apps und auf Teilen-Seiten</td></tr>
  <tr><td><code>REMOTE_URL</code></td><td>–</td><td>Adresse für unterwegs (setzt der Installer bei Tailscale)</td></tr>
  <tr><td><code>PUBLIC_URL</code></td><td>–</td><td>Adresse für öffentliche Links (setzt der Installer)</td></tr>
  <tr><td><code>HOST</code></td><td>0.0.0.0</td><td>Adresse, auf der er lauscht</td></tr>
  </tbody>
</table>
<h2>Änderung übernehmen</h2>
<pre data-lang="bash"><code>systemctl restart streyn</code></pre>
<h2>Wo was liegt</h2>
<table>
  <thead><tr><th>Was</th><th>Container und Debian</th></tr></thead>
  <tbody>
  <tr><td>Einstellungen</td><td><code>/etc/streyn.env</code></td></tr>
  <tr><td>Daten</td><td><code>/var/lib/streyn</code></td></tr>
  <tr><td>Musik</td><td><code>/srv/streyn</code></td></tr>
  <tr><td>Logs</td><td><code>journalctl -u streyn -f</code></td></tr>
  </tbody>
</table>
</template>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch {} return v; };
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const slug = (s) => s.toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const ico = {
    chev: '<svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
    right: '<svg class="i" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>',
    copy: '<svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
    check: '<svg class="i" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>',
    home: '<svg class="i" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>',
    list: '<svg class="i" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',
    up: '<svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
    edit: '<svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  };
  const T = {
    en: { search: 'Search', none: 'No results for', onpage: 'On this page', top: 'Back to top', prev: 'Previous', next: 'Next', copy: 'Copy', copied: 'Copied', edit: 'Edit this page on GitHub', docs: 'Docs', download: 'Download', home: 'Welcome' },
    de: { search: 'Suchen', none: 'Keine Treffer für', onpage: 'Auf dieser Seite', top: 'Nach oben', prev: 'Zurück', next: 'Weiter', copy: 'Kopieren', copied: 'Kopiert', edit: 'Diese Seite auf GitHub bearbeiten', docs: 'Docs', download: 'Download', home: 'Willkommen' },
  };
  let lang = store('musik.site.lang') === 'de' ? 'de' : 'en';
  const qlang = new URLSearchParams(location.search).get('lang');
  if (qlang === 'de' || qlang === 'en') lang = qlang;
  const pages = () => $$(`template[data-l="${lang}"]`).map((t) => ({ id: t.dataset.p, group: t.dataset.g, title: t.dataset.t, tpl: t }));
  let cur = '', spy = null, index = null;

  const route = () => {
    const [p, ...rest] = location.hash.replace(/^#\/?/, '').split('/');
    const dec = (v) => { try { return decodeURIComponent(v); } catch { return ''; } };
    return { p: dec(p || ''), a: dec(rest.join('/')) };
  };

  function sidebar() {
    const list = pages();
    let html = `<a class="home${cur === '' ? ' on' : ''}" href="#/">${ico.home}${esc(list[0].title)}</a>`;
    const groups = [];
    list.slice(1).forEach((p) => { let g = groups.find((x) => x.name === p.group); if (!g) groups.push((g = { name: p.group, items: [] })); g.items.push(p); });
    const shut = JSON.parse(store('musik.docs.shut') || '[]');
    groups.forEach((g, i) => {
      const closed = shut.includes(i) && !g.items.some((p) => p.id === cur);
      html += `<div class="grp${closed ? ' shut' : ''}" data-i="${i}"><button type="button" aria-expanded="${!closed}">${esc(g.name)}${ico.chev}</button><ul>`;
      g.items.forEach((p) => (html += `<li><a href="#/${p.id}" class="${p.id === cur ? 'on' : ''}">${esc(p.title)}</a></li>`));
      html += '</ul></div>';
    });
    $('#side').innerHTML = html;
    $$('#side .grp > button').forEach((b) => b.addEventListener('click', () => {
      const g = b.parentElement; const c = g.classList.toggle('shut'); b.setAttribute('aria-expanded', !c);
      store('musik.docs.shut', JSON.stringify($$('#side .grp.shut').map((x) => +x.dataset.i)));
    }));
  }

  function enhance(doc) {
    // headings: ids and anchor links
    const seen = {};
    $$('h2, h3', doc).forEach((h) => {
      let id = slug(h.textContent) || 'section';
      if (seen[id]) id += '-' + ++seen[id]; else seen[id] = 1;
      h.id = id;
      const a = document.createElement('a');
      a.className = 'hash'; a.href = `#/${cur}/${id}`; a.textContent = '#'; a.setAttribute('aria-hidden', 'true');
      h.prepend(a);
    });
    // code blocks with a label and a copy button
    $$('pre', doc).forEach((pre) => {
      const box = document.createElement('div');
      box.className = 'code';
      box.innerHTML = `<div class="lbl"><span>${pre.dataset.lang || 'text'}</span><button class="copy" type="button">${ico.copy}<span>${T[lang].copy}</span></button></div>`;
      pre.replaceWith(box); box.appendChild(pre);
      const b = $('.copy', box);
      b.addEventListener('click', async () => {
        const text = pre.textContent;
        let ok = false;
        try { await navigator.clipboard.writeText(text); ok = true; } catch {
          const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select(); try { ok = document.execCommand('copy'); } catch {} ta.remove();
        }
        if (!ok) return;
        b.classList.add('ok'); b.innerHTML = `${ico.check}<span>${T[lang].copied}</span>`;
        setTimeout(() => { b.classList.remove('ok'); b.innerHTML = `${ico.copy}<span>${T[lang].copy}</span>`; }, 1600);
      });
    });
    // tabs, the chosen one is kept
    $$('.tabs', doc).forEach((box) => {
      const tabs = $$('[role=tab]', box), panels = $$('[role=tabpanel]', box);
      const pick = (i) => { tabs.forEach((t, j) => { t.setAttribute('aria-selected', i === j); t.tabIndex = i === j ? 0 : -1; }); panels.forEach((p, j) => (p.hidden = i !== j)); };
      tabs.forEach((t, i) => t.addEventListener('click', () => { pick(i); store('musik.docs.tab', i); }));
      tabs.forEach((t, i) => t.addEventListener('keydown', (e) => {
        const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
        if (!d) return;
        e.preventDefault();
        const k = (i + d + tabs.length) % tabs.length;
        pick(k); store('musik.docs.tab', k); tabs[k].focus();
      }));
      pick(Math.min(+store('musik.docs.tab') || 0, tabs.length - 1));
    });
  }

  function render(scroll = true) {
    const list = pages();
    const r = route();
    const i = Math.max(0, list.findIndex((p) => p.id === r.p));
    const page = list[i];
    cur = page.id;
    const doc = $('#doc');
    const crumbs = page.id ? `<nav class="crumbs"><a href="#/">${T[lang].docs}</a>${ico.right}<span>${esc(page.group)}</span>${ico.right}<span>${esc(page.title)}</span></nav>` : '';
    doc.innerHTML = `${crumbs}<h1>${esc(page.title)}</h1>`;
    doc.appendChild(page.tpl.content.cloneNode(true));
    const prev = list[i - 1], next = list[i + 1];
    doc.insertAdjacentHTML('beforeend', `
      <div class="meta"><a href="https://github.com/Labtoso/Musik/edit/main/site/docs/index.html">${ico.edit}${T[lang].edit}</a></div>
      <nav class="pn">${prev ? `<a class="prev" href="#/${prev.id}"><small>← ${T[lang].prev}</small>${esc(prev.title)}</a>` : ''}${next ? `<a class="next" href="#/${next.id}"><small>${T[lang].next} →</small>${esc(next.title)}</a>` : ''}</nav>
      <div class="foot"><span>© LabtosoStudios</span><span><a href="../">musik.labtoso.de</a> · <a href="https://github.com/Labtoso/Musik/releases">Releases</a></span></div>`);
    enhance(doc);
    discordLinks();
    document.title = page.id ? `${page.title} · Streyn Docs` : 'Streyn Docs';
    sidebar();
    toc();
    document.body.classList.remove('nav');
    if (r.a) { const el = document.getElementById(r.a); if (el) { el.scrollIntoView(); pinned = r.a; spy && spy(); return; } }
    if (scroll) scrollTo(0, 0);
  }

  function toc() {
    const hs = $$('#doc h2, #doc h3');
    const box = $('#toc');
    pinned = null;
    if (!hs.length) { box.innerHTML = ''; spy = null; return; }
    box.innerHTML = `<p>${ico.list}${T[lang].onpage}</p>` + hs.map((h) => `<a href="#/${cur}/${h.id}" data-id="${h.id}" class="${h.tagName === 'H3' ? 'h3' : ''}">${esc(h.textContent.replace(/^#/, ''))}</a>`).join('') + `<button class="up" type="button">${ico.up}${T[lang].top}</button>`;
    $('.up', box).addEventListener('click', () => scrollTo({ top: 0, behavior: 'smooth' }));
    const mark = (id) => $$('a', box).forEach((a) => a.classList.toggle('on', a.dataset.id === id));
    // active heading: the last one above the top line; at the end of the page the clicked one, else the last one
    spy = () => {
      const line = 64 + 90;
      const atEnd = innerHeight + scrollY >= document.documentElement.scrollHeight - 4;
      const vis = (h) => { const r = h.getBoundingClientRect(); return r.top >= 0 && r.top < innerHeight; };
      let id = hs[0].id;
      hs.forEach((h) => { if (h.getBoundingClientRect().top <= line) id = h.id; });
      if (pinned && hs.some((h) => h.id === pinned && vis(h))) id = pinned;
      else if (atEnd) id = hs[hs.length - 1].id;
      mark(id);
    };
    spy();
  }
  let pinned = null;
  addEventListener('scroll', () => spy && spy(), { passive: true });
  addEventListener('resize', () => spy && spy());
  ['wheel', 'touchstart', 'keydown'].forEach((t) => addEventListener(t, () => { if (pinned) { pinned = null; } }, { passive: true }));


  // pictures open large on click
  const zoom = document.createElement('div');
  zoom.className = 'zoom';
  zoom.innerHTML = '<img alt=""><p></p>';
  document.body.appendChild(zoom);
  const closeZoom = () => zoom.classList.remove('open');
  zoom.addEventListener('click', closeZoom);
  addEventListener('keydown', (e) => { if (e.key === 'Escape') closeZoom(); });
  document.addEventListener('click', (e) => {
    const im = e.target.closest('#doc img[data-zoom], #doc .hero img');
    if (!im) return;
    $('img', zoom).src = im.currentSrc || im.src;
    $('p', zoom).textContent = im.alt || '';
    zoom.classList.add('open');
  });

  // in-page anchors: scroll without leaving the page route
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href^="#/"]');
    if (!a) return;
    const [, p, ...rest] = a.getAttribute('href').split('/');
    if ((p || '') === cur && rest.length) {
      e.preventDefault();
      history.replaceState(null, '', a.getAttribute('href'));
      pinned = rest.join('/');
      document.getElementById(pinned)?.scrollIntoView({ behavior: 'smooth' });
      spy && spy();
      document.body.classList.remove('nav');
    }
  });
  addEventListener('hashchange', () => render());

  // search over every page of the current language
  function buildIndex() {
    index = [];
    pages().forEach((p) => {
      const div = document.createElement('div');
      div.appendChild(p.tpl.content.cloneNode(true));
      $$('td, th, li, p, summary, [role=tab], .t', div).forEach((x) => x.append(' '));
      let head = '', text = '';
      const push = () => { if (text.trim() || head) index.push({ p: p.id, page: p.title, head, text: text.replace(/\s+/g, ' ').trim() }); };
      [...div.children].forEach((el) => {
        if (el.tagName === 'H2' || el.tagName === 'H3') { push(); head = el.textContent.trim(); text = ''; }
        else text += ' ' + el.textContent;
      });
      push();
    });
  }
  let sel = -1;
  function search() {
    const q = $('#q').value.trim().toLowerCase();
    const box = $('#results');
    if (!q) { box.classList.remove('open'); box.innerHTML = ''; return; }
    if (!index) buildIndex();
    const words = q.split(/\s+/);
    const hits = index.map((e) => {
      const hay = (e.page + ' ' + e.head + ' ' + e.text).toLowerCase();
      if (!words.every((w) => hay.includes(w))) return null;
      let score = 0;
      words.forEach((w) => { if (e.page.toLowerCase().includes(w)) score += 3; if (e.head.toLowerCase().includes(w)) score += 2; });
      return { e, score };
    }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 12);
    sel = hits.length ? 0 : -1;
    const hl = (s) => {
      // find all hits in the plain text first, then build the markup once (a word like "mark" never hits a tag)
      const low = s.toLowerCase(), on = new Array(s.length).fill(false);
      words.forEach((w) => { if (w.length > 1) for (let k = low.indexOf(w); k !== -1; k = low.indexOf(w, k + 1)) for (let j = k; j < k + w.length && j < s.length; j++) on[j] = true; });
      let out = '', open = false;
      for (let j = 0; j < s.length; j++) { if (on[j] !== open) { out += on[j] ? '<mark>' : '</mark>'; open = on[j]; } out += esc(s[j]); }
      return open ? out + '</mark>' : out;
    };
    const snip = (t) => { const k = t.toLowerCase().indexOf(words[0]); const s = Math.max(0, k - 50); return (s ? '…' : '') + t.slice(s, s + 150); };
    box.innerHTML = hits.length
      ? hits.map(({ e }, i) => `<a href="#/${e.p}${e.head ? '/' + slug(e.head) : ''}" class="${i === 0 ? 'sel' : ''}" role="option"><b>${hl(e.page)}${e.head ? ` <span>› ${hl(e.head)}</span>` : ''}</b><small>${hl(snip(e.text))}</small></a>`).join('')
      : `<div class="none">${T[lang].none} „${esc(q)}“</div>`;
    box.classList.add('open');
  }
  function closeSearch() { $('#results').classList.remove('open'); document.body.classList.remove('find'); }
  $('#q').addEventListener('input', search);
  $('#q').addEventListener('focus', () => { if ($('#q').value) search(); });
  $('#q').addEventListener('keydown', (e) => {
    const items = $$('#results a');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!items.length) return;
      sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach((a, i) => a.classList.toggle('sel', i === sel));
      items[sel].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter' && items[sel]) {
      e.preventDefault(); items[sel].click(); location.hash = items[sel].getAttribute('href'); $('#q').blur(); closeSearch();
    } else if (e.key === 'Escape') { $('#q').value = ''; closeSearch(); $('#q').blur(); }
  });
  $('#results').addEventListener('click', (e) => { if (e.target.closest('a')) { $('#q').value = ''; closeSearch(); } });
  document.addEventListener('click', (e) => { if (!e.target.closest('.search')) closeSearch(); });
  $('#slabel').addEventListener('click', () => { document.body.classList.add('find'); $('#q').focus(); });
  addEventListener('keydown', (e) => {
    const typing = /input|textarea/i.test(document.activeElement?.tagName);
    if ((e.key === 'k' && (e.ctrlKey || e.metaKey)) || (e.key === '/' && !typing)) { e.preventDefault(); document.body.classList.add('find'); $('#q').focus(); $('#q').select(); }
  });
  if (/Mac|iPhone|iPad/.test(navigator.platform)) $('#kbd').textContent = '⌘ K';

  // menu on small screens
  $('#burger').addEventListener('click', () => document.body.classList.toggle('nav'));
  $('#scrim').addEventListener('click', () => document.body.classList.remove('nav'));

  // light or dark
  $('#theme').addEventListener('click', () => {
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const t = dark ? 'light' : 'dark';
    document.documentElement.dataset.theme = t; store('musik.docs.theme', t);
  });

  // language
  function setLang(l) {
    lang = l; index = null;
    document.documentElement.lang = l;
    $$('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.l === l));
    $$('[data-t]').forEach((el) => { if (el.tagName !== 'TEMPLATE') el.textContent = T[l][el.dataset.t]; });
    $('#q').placeholder = T[l].search + ' …';
  }
  $$('.lang button').forEach((b) => b.addEventListener('click', () => {
    if (b.dataset.l === lang) return;
    store('musik.site.lang', b.dataset.l); setLang(b.dataset.l);
    // ?lang= in the address follows the choice, and a section anchor of the other language is dropped
    const u = new URL(location.href), r = route();
    if (u.searchParams.has('lang')) u.searchParams.set('lang', b.dataset.l);
    if (r.a) u.hash = '#/' + r.p;
    history.replaceState(history.state, '', u);
    render(false);
  }));

  // Discord invite from links.json, the same file the website and the apps read
  let discordUrl = '';
  function discordLinks() {
    if (!discordUrl) return;
    $$('a.discord-link').forEach((a) => { a.href = discordUrl; a.target = '_blank'; a.rel = 'noopener'; a.hidden = false; });
  }
  fetch('../links.json?' + Date.now(), { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).then((j) => {
    const u = String(j?.discord || '').trim();
    if (/^https:\/\//.test(u)) { discordUrl = u; discordLinks(); }
  }).catch(() => {});
  fetch('../version.json?' + Date.now(), { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).then((r) => {
    if (r && r.tag_name) { const v = $('#ver'); v.textContent = r.tag_name; v.hidden = false; }
  }).catch(() => {});

  setLang(lang);
  render(!location.hash.includes('/', 2));
})();
</script>
</body>
</html>
