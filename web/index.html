<style>html,body{background:#111214;color:#ececee}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#111214;z-index:999;transition:opacity .35s}
#boot.out{opacity:0;pointer-events:none}
#boot .bm{grid-area:1/1;width:58px;height:58px;background:#8c6cff;-webkit-mask:url(logo.svg) center/contain no-repeat;mask:url(logo.svg) center/contain no-repeat;animation:bootp 1.4s ease-in-out infinite}
#boot b{grid-area:1/1;width:104px;height:104px;border-radius:50%;border:3px solid rgba(255,255,255,.08);border-top-color:#8c6cff;animation:boots .9s linear infinite}
@keyframes boots{to{transform:rotate(360deg)}}
@keyframes bootp{50%{transform:scale(.88);opacity:.7}}
@media (prefers-color-scheme:light){html.light #boot{background:#f5f5f7}}</style>
<title>Streyn</title>
