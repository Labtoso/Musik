<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<meta name="color-scheme" content="dark">
<title>Musik</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root { --bg:#111214; --surface:#1d1f23; --surface2:#25272c; --line:#2c2f35; --text:#ececee; --muted:#9a9ca3; --accent:#4c8dff; --ink:#0b1220; color-scheme:dark; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; }
  body { background:var(--bg); color:var(--text); font:15px/1.45 'Segoe UI Variable Text','Segoe UI',Roboto,system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  .wrap { max-width:760px; margin:0 auto; padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(120px + env(safe-area-inset-bottom,0px)); }
  .head { display:flex; gap:22px; align-items:flex-end; margin-bottom:22px; position:relative; }
  .head::before { content:''; position:fixed; inset:0 0 auto 0; height:340px; background:linear-gradient(var(--tint,#2a3550), transparent); opacity:.55; z-index:-1; }
  .cover { width:200px; height:200px; border-radius:8px; background:var(--surface2) center/cover; flex:none; box-shadow:0 12px 40px #0008; }
  .kind { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  h1 { font-size:clamp(26px,6vw,46px); line-height:1.05; margin:6px 0 8px; letter-spacing:-.02em; }
  .sub { color:var(--muted); }
  .actions { display:flex; gap:12px; align-items:center; margin:8px 0 18px; flex-wrap:wrap; }
  .play { width:56px; height:56px; border-radius:50%; background:var(--accent); color:var(--ink); display:grid; place-items:center; }
  .play svg { width:26px; height:26px; }
  .btn { height:38px; padding:0 16px; border-radius:20px; border:1px solid var(--line); font-weight:600; display:inline-flex; align-items:center; gap:8px; text-decoration:none; }
  .btn:hover { border-color:var(--muted); }
  .btn.join { background:#fff; color:#111; border-color:#fff; }
  .invite { margin:0 0 14px; padding:10px 14px; border-radius:12px; background:rgba(255,255,255,.07); font-size:14px; }
  .row { display:grid; grid-template-columns:28px 44px 1fr auto; gap:12px; align-items:center; padding:7px 8px; border-radius:6px; }
  .row:hover { background:var(--surface); }
  .row.on .t { color:var(--accent); }
  .row .n { color:var(--muted); text-align:right; font-variant-numeric:tabular-nums; }
  .row .c { width:44px; height:44px; border-radius:4px; background:var(--surface2) center/cover; }
  .row .t { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .a { color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .d { color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
  .src { font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:4px; background:var(--surface2); color:var(--muted); margin-right:6px; }
  h3 { font-size:13px; color:var(--muted); margin:26px 8px 8px; font-weight:600; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:#17181bf2; backdrop-filter:blur(12px); border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)); display:none; }
  .bar.show { display:block; }
  .bar .in { max-width:760px; margin:0 auto; display:flex; align-items:center; gap:12px; }
  .bar .meta { flex:1; min-width:0; }
  .bar .meta div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar .ctl { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; }
  .bar .ctl.main { background:var(--text); color:var(--bg); }
  .bar svg { width:20px; height:20px; }
  .prog { height:3px; background:var(--line); border-radius:2px; margin-top:8px; cursor:pointer; }
  .prog i { display:block; height:100%; width:0; background:var(--accent); border-radius:2px; }
  .msg { text-align:center; color:var(--muted); margin-top:30vh; }
  .toast { position:fixed; left:50%; bottom:110px; transform:translateX(-50%); background:var(--surface2); padding:10px 16px; border-radius:8px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.on { opacity:1; }
  .foot { margin-top:30px; color:var(--muted); font-size:13px; text-align:center; }
  .join-box { margin:0 0 18px; padding:16px; border-radius:12px; background:var(--surface); border:1px solid var(--line); display:none; }
  .join-box.on { display:block; }
  .join-box h2 { font-size:17px; margin:0 0 4px; }
  .join-box p { margin:0 0 12px; color:var(--muted); font-size:14px; }
  .seg { display:inline-flex; background:var(--surface2); border-radius:20px; padding:3px; margin-bottom:12px; }
  .seg button { height:32px; padding:0 14px; border-radius:16px; font-weight:600; font-size:14px; color:var(--muted); }
  .seg button.on { background:var(--text); color:var(--bg); }
  .join-box label { display:block; margin-bottom:10px; }
  .join-box label span { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
  .join-box input { width:100%; height:42px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); padding:0 12px; font:inherit; }
  .join-box input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  .join-box .err { color:#ff7a7a; font-size:14px; min-height:20px; margin:2px 0 8px; }
  .join-box .go { width:100%; height:44px; border-radius:22px; background:var(--accent); color:var(--ink); font-weight:700; }
  .join-box .go:disabled { opacity:.6; }
  .desc { color:var(--muted); margin:8px 0 0; max-width:60ch; }
  @media (max-width:560px) {
    .head { flex-direction:column; align-items:flex-start; }
    .cover { width:min(62vw,240px); height:min(62vw,240px); align-self:center; }
    .row { grid-template-columns:44px 1fr auto; }
    .row .n { display:none; }
  }
</style>
</head>
<body>
<div class="wrap" id="root"><p class="msg" id="msg">…</p></div>
<div class="bar" id="bar"><div class="in">
  <div class="meta"><div id="bt" style="font-weight:600"></div><div id="ba" class="sub" style="font-size:13px"></div></div>
  <button class="ctl" id="prev" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
  <button class="ctl main" id="tog" aria-label="Play"></button>
  <button class="ctl" id="next" aria-label="Weiter"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
</div><div class="in" style="display:block"><div class="prog" id="prog"><i id="pi"></i></div></div></div>
<div class="toast" id="toast"></div>
<audio id="au" preload="none"></audio>
<!-- The same page is served by every Musik server at /s/<token> and by the download site at
     musik.labtoso.de/s/#<token>@<public host>. Keep web/share.html and site/s/index.html equal. -->
<script>
(() => {
  let pl = '';
  try { pl = JSON.parse(localStorage.getItem('musik.prefs') || '{}').lang || localStorage.getItem('musik.site.lang') || ''; } catch {}
  const de = pl === 'de' || (!pl && /^de\b/i.test(navigator.language || ''));
  const T = de
    ? { play: 'Abspielen', save: 'In meiner Bibliothek speichern', saved: 'Gespeichert', open: 'In der App öffnen', notFound: 'Dieser Link ist nicht (mehr) gültig.', offline: 'Der Server dieser Playlist ist gerade nicht erreichbar. Versuch es später noch einmal.', song: 'Song', album: 'Album', playlist: 'Playlist', import: 'Playlist', login: 'Melde dich in der App an, um zu speichern.', songs: 'Songs', on: 'Geteilt von', join: 'Mitwirken', joinHint: 'Du wurdest eingeladen, an dieser Playlist mitzuwirken. Du kannst Songs hinzufügen, entfernen und alles anhören.',
        joinTitle: 'Mitwirken', joinText: 'Leg ein Konto auf diesem Musik-Server an oder melde dich an. Danach öffnet sich die Playlist in der App.', newAcc: 'Neues Konto', haveAcc: 'Ich habe ein Konto', name: 'Name', pass: 'Passwort', create: 'Konto anlegen und mitwirken', signin: 'Anmelden und mitwirken',
        e: { name_taken: 'Den Namen gibt es schon. Nimm einen anderen oder melde dich an.', invalid_name: 'Der Name braucht 2 bis 32 Zeichen (Buchstaben, Zahlen, Leerzeichen, . _ -).', password_short: 'Das Passwort braucht mindestens 4 Zeichen.', wrong_login: 'Name oder Passwort stimmt nicht.', local_only: 'Dieses Konto kann sich nur zuhause anmelden.', too_many: 'Zu viele Versuche. Warte eine Minute.', invite_used_up: 'Diese Einladung wurde schon zu oft benutzt.', not_found: 'Diese Einladung gilt nicht mehr.' } }
    : { play: 'Play', save: 'Save to my library', saved: 'Saved', open: 'Open in the app', notFound: 'This link is not valid (anymore).', offline: "The server of this playlist can't be reached right now. Try again later.", song: 'Song', album: 'Album', playlist: 'Playlist', import: 'Playlist', login: 'Sign in in the app to save.', songs: 'songs', on: 'Shared from', join: 'Join as collaborator', joinHint: 'You were invited to work on this playlist. You can add and remove songs and listen to everything.',
        joinTitle: 'Join as collaborator', joinText: 'Create an account on this Musik server or sign in. The playlist then opens in the app.', newAcc: 'New account', haveAcc: 'I have an account', name: 'Name', pass: 'Password', create: 'Create account and join', signin: 'Sign in and join',
        e: { name_taken: 'That name is taken. Pick another one or sign in.', invalid_name: 'The name needs 2 to 32 characters (letters, digits, spaces, . _ -).', password_short: 'The password needs at least 4 characters.', wrong_login: 'Wrong name or password.', local_only: 'This account can only sign in at home.', too_many: 'Too many tries. Wait a minute.', invite_used_up: 'This invitation has been used too often.', not_found: 'This invitation is no longer valid.' } };
  document.documentElement.lang = de ? 'de' : 'en';
  const SRC = { spotify: 'Spotify', youtube: 'YouTube', ytmusic: 'YT Music', soundcloud: 'SoundCloud', deezer: 'Deezer', apple: 'Apple Music', tidal: 'Tidal' };
  const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  const PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const fmt = (s) => { s = Math.round(s || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  // public link: #<token>@<host> (download site), otherwise /s/<token> on the server itself
  const pub = location.hash.slice(1).match(/^([A-Za-z0-9]{6,32})@([a-z0-9.-]+(?::\d{1,5})?)$/i);
  const token = pub ? pub[1] : location.pathname.split('/s/')[1]?.split(/[/?#]/)[0] || '';
  const origin = pub ? 'https://' + pub[2] : location.origin;
  const remote = origin !== location.origin;
  const base = origin + '/api/public/' + encodeURIComponent(token);
  let conn = {};
  try { conn = JSON.parse(localStorage.getItem('musik.conn')) || {}; } catch {}
  const signedIn = !remote && conn.token && (!conn.server || conn.server === location.origin);
  const au = $('au');
  let data = null, list = [], cur = -1;

  const toast = (m) => { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2600); };

  function tint(url) {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = c.height = 8;
        const x = c.getContext('2d'); x.drawImage(img, 0, 0, 8, 8);
        const d = x.getImageData(0, 0, 8, 8).data; let r = 0, g = 0, b = 0;
        for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; }
        const n = d.length / 4;
        document.documentElement.style.setProperty('--tint', `rgb(${r / n | 0},${g / n | 0},${b / n | 0})`);
      } catch {}
    };
    img.src = url;
  }

  function render() {
    const d = data;
    document.title = d.title + ' · Musik';
    // one list: songs from the server and platform songs (those play through the server too)
    list = d.tracks.map((t) => ({ title: t.title, artist: t.artist, album: t.album, duration: t.duration, cover: t.cover ? base + '/cover/' + t.i : '', src: base + '/stream/' + t.i }))
      .concat(d.external.map((e, k) => ({ title: e.title, artist: e.artist, album: '', duration: e.duration, cover: /^https:\/\//.test(e.cover) ? e.cover : '', src: base + '/song/' + k, badge: SRC[e.source] || e.source })));
    const firstCover = list.find((x) => x.cover)?.cover || '';
    let h = `<div class="head"><div class="cover" style="${firstCover ? `background-image:url('${esc(firstCover)}')` : ''}"></div><div>
      <div class="kind">${T[d.kind] || ''}</div><h1>${esc(d.title)}</h1>
      <div class="sub">${esc(d.sub)}${d.kind !== 'track' ? ` · ${list.length} ${T.songs}` : ''}</div>${d.description ? `<p class="desc">${esc(d.description)}</p>` : ''}</div></div>
      <div class="actions">${list.length ? `<button class="play" id="playall" aria-label="${T.play}">${PLAY}</button>` : ''}
      ${d.collab ? `<button class="btn join" id="join">${T.join}</button>` : ''}${signedIn ? `<button class="btn" id="save">${T.save}</button><a class="btn" href="/#/home">${T.open}</a>` : ''}</div>`;
    if (d.collab) h += `<p class="invite">${T.joinHint}</p>
      <form class="join-box" id="joinbox" autocomplete="on"><h2>${T.joinTitle}</h2><p>${T.joinText}</p>
        <div class="seg"><button type="button" class="on" data-m="new">${T.newAcc}</button><button type="button" data-m="have">${T.haveAcc}</button></div>
        <label><span>${T.name}</span><input name="name" autocomplete="username" required minlength="2" maxlength="32"></label>
        <label><span>${T.pass}</span><input name="password" type="password" autocomplete="new-password" required minlength="4"></label>
        <div class="err" id="jerr"></div><button class="go" id="jgo">${T.create}</button></form>`;
    h += list.map((x, i) => `<div class="row" data-i="${i}"><span class="n">${i + 1}</span><span class="c" style="${x.cover ? `background-image:url('${esc(x.cover)}')` : ''}"></span>
      <div style="min-width:0"><div class="t">${esc(x.title)}</div><div class="a">${x.badge ? `<span class="src">${esc(x.badge)}</span>` : ''}${esc(x.artist)}</div></div><span class="d">${x.duration ? fmt(x.duration) : ''}</span></div>`).join('');
    h += `<div class="foot">${T.on} ${esc(d.server || 'Musik')}</div>`;
    $('root').innerHTML = h;
    if (firstCover) tint(firstCover);
    $('playall')?.addEventListener('click', () => (cur >= 0 ? toggle() : play(0)));
    $('save')?.addEventListener('click', save);
    $('join')?.addEventListener('click', join);
    document.querySelectorAll('.row[data-i]').forEach((r) => r.addEventListener('click', () => play(+r.dataset.i)));
    const box = $('joinbox');
    if (box) {
      let mode = 'new';
      box.querySelectorAll('[data-m]').forEach((b) => b.addEventListener('click', () => {
        mode = b.dataset.m;
        box.querySelectorAll('[data-m]').forEach((x) => x.classList.toggle('on', x === b));
        $('jgo').textContent = mode === 'new' ? T.create : T.signin;
        box.elements.password.autocomplete = mode === 'new' ? 'new-password' : 'current-password';
        $('jerr').textContent = '';
      }));
      box.addEventListener('submit', (e) => { e.preventDefault(); enter(mode, box.elements.name.value.trim(), box.elements.password.value); });
    }
  }

  function play(i) {
    if (!list[i]) return;
    cur = i;
    const x = list[i];
    au.src = x.src;
    au.play().catch(() => {});
    $('bt').textContent = x.title; $('ba').textContent = x.artist;
    $('bar').classList.add('show');
    document.querySelectorAll('.row[data-i]').forEach((r) => r.classList.toggle('on', +r.dataset.i === i));
    if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: x.title, artist: x.artist, album: x.album, artwork: x.cover ? [{ src: x.cover }] : [] });
  }
  const toggle = () => (au.paused ? au.play() : au.pause());
  const icons = () => { $('tog').innerHTML = au.paused ? PLAY : PAUSE; const p = $('playall'); if (p) p.innerHTML = au.paused || cur < 0 ? PLAY : PAUSE; };
  au.addEventListener('play', icons); au.addEventListener('pause', icons);
  au.addEventListener('ended', () => (cur + 1 < list.length ? play(cur + 1) : icons()));
  // a platform song that can't be found: go on with the next one
  au.addEventListener('error', () => { if (cur >= 0 && cur + 1 < list.length && au.src) play(cur + 1); });
  au.addEventListener('timeupdate', () => ($('pi').style.width = (au.duration ? (au.currentTime / au.duration) * 100 : 0) + '%'));
  $('tog').addEventListener('click', toggle);
  $('prev').addEventListener('click', () => (au.currentTime > 3 ? (au.currentTime = 0) : play(Math.max(0, cur - 1))));
  $('next').addEventListener('click', () => play(cur + 1));
  $('prog').addEventListener('click', (e) => { const r = e.currentTarget.getBoundingClientRect(); if (au.duration) au.currentTime = ((e.clientX - r.left) / r.width) * au.duration; });
  if ('mediaSession' in navigator) {
    navigator.mediaSession.setActionHandler('nexttrack', () => play(cur + 1));
    navigator.mediaSession.setActionHandler('previoustrack', () => play(Math.max(0, cur - 1)));
  }
  icons();

  async function save() {
    if (!signedIn) return toast(T.login);
    const r = await fetch(base + '/save', { method: 'POST', headers: { Authorization: 'Bearer ' + conn.token } });
    if (r.status === 401) return toast(T.login);
    if (!r.ok) return toast('Error ' + r.status);
    const j = await r.json();
    $('save').textContent = T.saved + ' ✓';
    $('save').disabled = true;
    toast(T.saved + ': ' + j.name);
  }

  // open the playlist in the web app of that server, signed in with the new session
  const openApp = (session) => (location.href = origin + '/#/join/' + encodeURIComponent(token) + (session ? '?auth=' + session : ''));

  async function join() {
    if (signedIn) {
      const r = await fetch(base + '/join', { method: 'POST', headers: { Authorization: 'Bearer ' + conn.token } });
      if (r.ok) return (location.href = '/#/playlist/' + (await r.json()).id);
    }
    const box = $('joinbox');
    box.classList.add('on');
    box.elements.name.focus();
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  async function enter(mode, name, password) {
    const go = $('jgo'), err = $('jerr');
    go.disabled = true; err.textContent = '';
    const call = (url, body, auth) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', ...(auth ? { Authorization: 'Bearer ' + auth } : {}) }, body: JSON.stringify(body || {}) })
      .then(async (r) => { const j = await r.json().catch(() => ({})); if (!r.ok) throw j.error || 'error'; return j; });
    try {
      const client = 'Browser (invite)';
      let session;
      if (mode === 'new') session = (await call(base + '/signup', { name, password, client })).token;
      else {
        session = (await call(origin + '/api/login', { name, password, client })).token;
        await call(base + '/join', {}, session);
      }
      openApp(session);
    } catch (e) {
      err.textContent = T.e[e] || (typeof e === 'string' ? e : T.offline);
      go.disabled = false;
    }
  }

  // another link opened in the same tab only changes the #part
  addEventListener('hashchange', () => location.reload());
  if (!token) { $('msg').textContent = T.notFound; return; }
  fetch(base)
    .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
    .then((d) => { data = d; render(); })
    .catch((st) => ($('msg').textContent = typeof st === 'number' ? T.notFound : T.offline));
})();
</script>
</body>
</html>
