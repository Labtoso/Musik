<!doctype html>
<html lang="en">
<head>
<meta name="color-scheme" content="dark">
<style>html,body{background:#111214}</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streyn</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #111214; color: #ececee; font: 14px/1.45 'Segoe UI Variable Text', 'Segoe UI', Roboto, system-ui, sans-serif; display: grid; place-items: center; padding: 20px; }
  form { width: 100%; max-width: 380px; background: #1d1f23; border: 1px solid #2c2f35; border-radius: 18px; padding: 26px; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; margin-bottom: 18px; }
  .brand svg { width: 40px; height: 40px; color: #4c8dff; }
  h2 { font-size: 18px; margin: 0 0 14px; }
  label span { display: block; font-size: 12.5px; color: #9a9ca3; margin-bottom: 5px; }
  input { width: 100%; height: 40px; padding: 0 12px; border-radius: 7px; border: 1px solid #2c2f35; background: #111214; color: inherit; font: inherit; outline: none; }
  input:focus { border-color: #4c8dff; }
  p { color: #9a9ca3; font-size: 12.5px; margin: 8px 0 0; }
  .err { color: #e5484d; min-height: 20px; font-size: 13px; }
  button { width: 100%; height: 42px; border: 0; border-radius: 7px; background: #4c8dff; color: #0b1220; font: inherit; font-weight: 600; cursor: pointer; margin-top: 6px; }
  button:disabled { opacity: 0.5; }
  button.ghost { background: transparent; border: 1px solid #2c2f35; color: #ececee; margin-top: 10px; }
  .tb { position: fixed; left: 0; right: 0; top: 0; height: 40px; display: flex; justify-content: flex-end; background: #000; -webkit-user-select: none; user-select: none; z-index: 5; }
  .tb button { width: 46px; height: 40px; margin: 0; border-radius: 0; background: transparent; color: #9a9ca3; display: grid; place-items: center; }
  .tb button:hover { background: rgba(255,255,255,.1); color: #fff; }
  .tb button.x:hover { background: #e81123; }
  .tb svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1; }
  .lang { position: fixed; top: 54px; right: 16px; width: auto; height: auto; margin: 0; padding: 6px 10px; border-radius: 16px; background: transparent; border: 1px solid #2c2f35; color: #9a9ca3; font-size: 12.5px; font-weight: 600; }
</style>
</head>
<body>
<div class="tb" id="tb"><button type="button" data-w="min"><svg viewBox="0 0 10 10"><path d="M1 5h8"/></svg></button><button type="button" data-w="max"><svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7"/></svg></button><button type="button" class="x" data-w="close"><svg viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg></button></div>
<button type="button" class="lang" id="lang"></button>
<form id="f">
  <div class="brand"><svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="172 172 680 680" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M499.0 844.3C453.4 842.1 410.9 831.7 371.2 812.9C271.9 766.0 201.6 672.6 184.6 564.8C180.8 540.8 179.6 505.1 182.0 481.4C192.5 374.4 252.4 280.6 345.0 226.0C385.2 202.3 427.7 188.3 476.5 182.5C493.7 180.5 528.1 180.5 547.4 182.5C629.9 191.2 705.8 230.3 760.7 292.3C801.4 338.4 827.6 391.9 838.9 452.5C845.8 488.9 845.8 535.2 839.0 572.7C817.9 689.3 733.8 787.3 621.5 826.0C595.4 834.9 568.4 840.8 543.0 842.9C530.3 844.0 507.5 844.7 499.0 844.3ZM526.5 828.0C572.9 825.6 613.7 815.1 653.3 795.3C684.0 780.0 707.4 763.3 732.9 738.5C783.7 689.1 814.1 629.3 825.7 556.0C827.2 546.6 827.5 538.7 827.5 512.5C827.4 484.5 827.1 478.8 825.2 466.7C813.8 395.0 782.8 334.8 731.8 285.5C679.9 235.2 614.1 204.9 541.5 197.9C525.5 196.4 483.0 197.3 469.0 199.5C410.4 208.7 362.8 229.0 317.0 264.4C303.5 274.8 274.8 303.5 264.4 317.0C236.2 353.5 217.4 391.7 206.5 434.5C198.9 464.2 197.5 476.6 197.5 512.5C197.5 546.3 198.4 555.3 204.0 580.5C228.8 692.2 312.3 782.3 421.1 814.9C448.9 823.3 469.6 826.6 506.5 828.8C507.6 828.9 516.6 828.5 526.5 828.0ZM357.2 730.0C330.0 726.2 304.0 712.6 291.0 695.4C280.5 681.5 276.4 668.3 277.3 651.6C278.9 620.6 302.3 592.3 339.0 576.8C355.6 569.7 373.2 566.0 389.8 566.0C397.9 566.0 399.0 565.8 399.0 564.2C399.0 563.3 395.8 542.7 392.0 518.5C369.5 377.9 368.6 371.6 370.1 371.1C370.9 370.8 429.8 353.0 501.0 331.5L630.5 292.4L630.2 286.7C630.1 283.0 630.4 281.0 631.1 281.0C631.7 281.0 649.3 278.3 670.3 275.0C691.2 271.7 708.5 269.1 708.7 269.4C708.9 269.6 719.0 332.5 731.1 409.1C754.8 559.1 754.2 553.8 750.5 568.0C744.5 591.2 725.0 612.9 698.1 626.4C678.1 636.5 660.9 640.4 636.5 640.5C618.1 640.5 611.0 639.5 596.8 634.9C555.0 621.4 531.9 587.8 539.5 551.5C543.6 531.7 560.0 510.2 581.0 496.8C600.8 484.2 622.6 477.4 646.8 476.3C659.0 475.8 660.0 475.6 660.0 473.8C660.0 471.6 648.0 395.7 647.6 395.3C647.5 395.1 605.8 407.5 554.9 422.9L462.5 450.7L462.8 453.6C463.0 455.2 469.5 496.1 477.2 544.5C492.2 638.6 492.9 644.4 489.6 657.0C480.8 691.5 446.9 718.9 401.5 728.5C392.2 730.5 366.6 731.3 357.2 730.0Z"/></svg>Streyn</div>
  <h2 id="h"></h2>
  <label><span id="l"></span><input id="s" placeholder="http://192.168.1.50:8484" autofocus></label>
  <p id="help"></p>
  <p class="err" id="e"></p>
  <button id="b"></button>
  <button type="button" class="ghost" id="off" hidden></button>
  <p id="offhelp" hidden></p>
</form>
<script>
  // own title bar: the window has no system frame
  document.getElementById('tb').addEventListener('mousedown', (e) => {
    const b = e.target.closest('button');
    if (b) return;
    location.href = 'musik-win://' + (e.detail === 2 ? 'max' : 'drag');
  });
  document.querySelectorAll('#tb [data-w]').forEach((b) => (b.onclick = () => (location.href = 'musik-win://' + b.dataset.w)));
  let saved = '';
  try { saved = localStorage.getItem('musik.lang') || ''; } catch {}
  const de = saved === 'de';
  const langBtn = document.getElementById('lang');
  langBtn.textContent = de ? 'English' : 'Deutsch';
  langBtn.onclick = () => {
    const l = de ? 'en' : 'de';
    try { try { localStorage.setItem('musik.lang', l); } catch {} } catch {}
    location.reload();
  };
  const T = de
    ? { h: 'Mit Server verbinden', l: 'Server-Adresse', help: 'Die Adresse zeigt der Server beim Start an, z. B. http://192.168.1.50:8484', b: 'Verbinden', off: 'Offline verwenden', offhelp: 'Spielt die Playlists, die du auf diesen Computer heruntergeladen hast.', connecting: 'Verbinde …', offline: 'Server nicht erreichbar. Adresse prüfen.', notmusik: 'Unter dieser Adresse läuft kein Streyn-Server.', upd: 'Streyn wird aktualisiert', updHelp: 'Die neue Version wird geladen. Danach schließt sich Streyn kurz und startet neu.', updP: 'Lade … {p} %', updFail: 'Update fehlgeschlagen. Prüfe die Internetverbindung.', updUnsupported: 'Diese Version kann sich nicht selbst aktualisieren. Lade die neue Version von der Download-Seite.', back: 'Zurück' }
    : { h: 'Connect to server', l: 'Server address', help: 'The server prints its address on start, e.g. http://192.168.1.50:8484', b: 'Connect', off: 'Use offline', offhelp: 'Plays the playlists you downloaded to this computer.', connecting: 'Connecting …', offline: 'Server not reachable. Check the address.', notmusik: 'No Streyn server at this address.', upd: 'Updating Streyn', updHelp: 'Downloading the new version. Streyn then closes for a moment and starts again.', updP: 'Downloading … {p} %', updFail: 'Update failed. Check the internet connection.', updUnsupported: 'This version cannot update itself. Get the new version from the download page.', back: 'Back' };
  document.documentElement.lang = de ? 'de' : 'en';
  for (const k of ['h', 'l', 'help', 'b']) document.getElementById(k).textContent = T[k];
  const q = new URLSearchParams(location.search);
  const s = document.getElementById('s');
  const e = document.getElementById('e');
  const b = document.getElementById('b');
  const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);
  let offBtn = null;
  invoke('can_offline').then((ok) => {
    if (!ok || q.has('update')) return;
    const off = document.getElementById('off');
    const oh = document.getElementById('offhelp');
    off.hidden = oh.hidden = false;
    off.textContent = T.off;
    oh.textContent = T.offhelp;
    offBtn = off;
    off.onclick = () => { off.disabled = true; invoke('use_offline'); };
  }).catch(() => {});
  window.showError = (code) => {
    e.textContent = T[code] || T.offline;
    b.disabled = false;
    if (offBtn) offBtn.disabled = false;
  };
  if (q.has('update')) {
    // update screen: no address field, just progress
    document.querySelector('label').style.display = 'none';
    langBtn.style.display = 'none';
    document.getElementById('h').textContent = T.upd;
    document.getElementById('help').textContent = T.updHelp;
    b.disabled = true;
    b.textContent = T.updP.replace('{p}', 0);
    window.updProgress = (p) => { b.textContent = T.updP.replace('{p}', p); };
    invoke('self_update').catch((err) => {
      e.textContent = err === 'unsupported' ? T.updUnsupported : T.updFail;
      b.disabled = false;
      b.textContent = T.back;
      document.getElementById('f').onsubmit = (ev) => { ev.preventDefault(); invoke('open_saved'); };
    });
  } else invoke('saved_server').then((saved) => {
    s.value = saved || '';
    if (saved && !q.has('change')) {
      // The app opens the saved server by itself; show progress meanwhile.
      b.disabled = true;
      e.textContent = '';
      b.textContent = T.connecting;
      setTimeout(() => {
        if (b.disabled) {
          b.textContent = T.b;
          window.showError('offline');
        }
      }, 8000);
    }
  });
  document.getElementById('f').onsubmit = async (ev) => {
    ev.preventDefault();
    b.disabled = true;
    e.textContent = '';
    const r = await invoke('connect', { server: s.value });
    if (r !== 'ok') window.showError(r);
  };
</script>
</body>
</html>
