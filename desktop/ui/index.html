<!doctype html>
<html lang="en">
<head>
<meta name="color-scheme" content="dark">
<style>html,body{background:#111214}</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musik</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #111214; color: #ececee; font: 14px/1.45 'Segoe UI Variable Text', 'Segoe UI', Roboto, system-ui, sans-serif; display: grid; place-items: center; padding: 20px; }
  form { width: 100%; max-width: 380px; background: #1d1f23; border: 1px solid #2c2f35; border-radius: 18px; padding: 26px; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; margin-bottom: 18px; }
  .brand svg { width: 26px; height: 26px; color: #4c8dff; }
  h2 { font-size: 18px; margin: 0 0 14px; }
  label span { display: block; font-size: 12.5px; color: #9a9ca3; margin-bottom: 5px; }
  input { width: 100%; height: 40px; padding: 0 12px; border-radius: 7px; border: 1px solid #2c2f35; background: #111214; color: inherit; font: inherit; outline: none; }
  input:focus { border-color: #4c8dff; }
  p { color: #9a9ca3; font-size: 12.5px; margin: 8px 0 0; }
  .err { color: #e5484d; min-height: 20px; font-size: 13px; }
  button { width: 100%; height: 42px; border: 0; border-radius: 7px; background: #4c8dff; color: #0b1220; font: inherit; font-weight: 600; cursor: pointer; margin-top: 6px; }
  button:disabled { opacity: 0.5; }
  button.ghost { background: transparent; border: 1px solid #2c2f35; color: #ececee; margin-top: 10px; }
  .tb { position: fixed; left: 0; right: 0; top: 0; height: 40px; display: flex; justify-content: flex-end; background: #000; -webkit-user-select: none; user-select: none; z-index: 5; }
  .tb button { width: 46px; height: 40px; margin: 0; border-radius: 0; background: transparent; color: #9a9ca3; display: grid; place-items: center; }
  .tb button:hover { background: rgba(255,255,255,.1); color: #fff; }
  .tb button.x:hover { background: #e81123; }
  .tb svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1; }
  .lang { position: fixed; top: 54px; right: 16px; width: auto; height: auto; margin: 0; padding: 6px 10px; border-radius: 16px; background: transparent; border: 1px solid #2c2f35; color: #9a9ca3; font-size: 12.5px; font-weight: 600; }
</style>
</head>
<body>
<div class="tb" id="tb"><button type="button" data-w="min"><svg viewBox="0 0 10 10"><path d="M1 5h8"/></svg></button><button type="button" data-w="max"><svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7"/></svg></button><button type="button" class="x" data-w="close"><svg viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg></button></div>
<button type="button" class="lang" id="lang"></button>
<form id="f">
  <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17.5V6l10-2v11.5"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="15.5" r="2.5"/></svg>Musik</div>
  <h2 id="h"></h2>
  <label><span id="l"></span><input id="s" placeholder="http://192.168.1.50:8484" autofocus></label>
  <p id="help"></p>
  <p class="err" id="e"></p>
  <button id="b"></button>
  <button type="button" class="ghost" id="off" hidden></button>
  <p id="offhelp" hidden></p>
</form>
<script>
  // own title bar: the window has no system frame
  document.getElementById('tb').addEventListener('mousedown', (e) => {
    const b = e.target.closest('button');
    if (b) return;
    location.href = 'musik-win://' + (e.detail === 2 ? 'max' : 'drag');
  });
  document.querySelectorAll('#tb [data-w]').forEach((b) => (b.onclick = () => (location.href = 'musik-win://' + b.dataset.w)));
  let saved = '';
  try { saved = localStorage.getItem('musik.lang') || ''; } catch {}
  const de = saved === 'de';
  const langBtn = document.getElementById('lang');
  langBtn.textContent = de ? 'English' : 'Deutsch';
  langBtn.onclick = () => {
    const l = de ? 'en' : 'de';
    try { try { localStorage.setItem('musik.lang', l); } catch {} } catch {}
    location.reload();
  };
  const T = de
    ? { h: 'Mit Server verbinden', l: 'Server-Adresse', help: 'Die Adresse zeigt der Server beim Start an, z. B. http://192.168.1.50:8484', b: 'Verbinden', off: 'Offline verwenden', offhelp: 'Spielt die Playlists, die du auf diesen Computer heruntergeladen hast.', connecting: 'Verbinde …', offline: 'Server nicht erreichbar. Adresse prüfen.', notmusik: 'Unter dieser Adresse läuft kein Musik-Server.', upd: 'Musik wird aktualisiert', updHelp: 'Die neue Version wird geladen. Danach schließt sich Musik kurz und startet neu.', updP: 'Lade … {p} %', updFail: 'Update fehlgeschlagen. Prüfe die Internetverbindung.', updUnsupported: 'Diese Version kann sich nicht selbst aktualisieren. Lade die neue Version von der Download-Seite.', back: 'Zurück' }
    : { h: 'Connect to server', l: 'Server address', help: 'The server prints its address on start, e.g. http://192.168.1.50:8484', b: 'Connect', off: 'Use offline', offhelp: 'Plays the playlists you downloaded to this computer.', connecting: 'Connecting …', offline: 'Server not reachable. Check the address.', notmusik: 'No Musik server at this address.', upd: 'Updating Musik', updHelp: 'Downloading the new version. Musik then closes for a moment and starts again.', updP: 'Downloading … {p} %', updFail: 'Update failed. Check the internet connection.', updUnsupported: 'This version cannot update itself. Get the new version from the download page.', back: 'Back' };
  document.documentElement.lang = de ? 'de' : 'en';
  for (const k of ['h', 'l', 'help', 'b']) document.getElementById(k).textContent = T[k];
  const q = new URLSearchParams(location.search);
  const s = document.getElementById('s');
  const e = document.getElementById('e');
  const b = document.getElementById('b');
  const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);
  invoke('can_offline').then((ok) => {
    if (!ok || q.has('update')) return;
    const off = document.getElementById('off');
    const oh = document.getElementById('offhelp');
    off.hidden = oh.hidden = false;
    off.textContent = T.off;
    oh.textContent = T.offhelp;
    off.onclick = () => { off.disabled = true; invoke('use_offline'); };
  }).catch(() => {});
  window.showError = (code) => {
    e.textContent = T[code] || T.offline;
    b.disabled = false;
  };
  if (q.has('update')) {
    // update screen: no address field, just progress
    document.querySelector('label').style.display = 'none';
    langBtn.style.display = 'none';
    document.getElementById('h').textContent = T.upd;
    document.getElementById('help').textContent = T.updHelp;
    b.disabled = true;
    b.textContent = T.updP.replace('{p}', 0);
    window.updProgress = (p) => { b.textContent = T.updP.replace('{p}', p); };
    invoke('self_update').catch((err) => {
      e.textContent = err === 'unsupported' ? T.updUnsupported : T.updFail;
      b.disabled = false;
      b.textContent = T.back;
      document.getElementById('f').onsubmit = (ev) => { ev.preventDefault(); invoke('open_saved'); };
    });
  } else invoke('saved_server').then((saved) => {
    s.value = saved || '';
    if (saved && !q.has('change')) {
      // The app opens the saved server by itself; show progress meanwhile.
      b.disabled = true;
      e.textContent = '';
      b.textContent = T.connecting;
      setTimeout(() => {
        if (b.disabled) {
          b.textContent = T.b;
          window.showError('offline');
        }
      }, 8000);
    }
  });
  document.getElementById('f').onsubmit = async (ev) => {
    ev.preventDefault();
    b.disabled = true;
    e.textContent = '';
    const r = await invoke('connect', { server: s.value });
    if (r !== 'ok') window.showError(r);
  };
</script>
</body>
</html>
