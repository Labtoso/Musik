[package]
name = "streyn"
version = "1.0.0"
edition = "2021"
description = "Streyn desktop app"
authors = ["LabtosoStudios"]
license-file = "../../LICENSE"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
open = "5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
