[package]
name = "streyn-setup"
version = "1.0.0"
edition = "2021"
description = "Streyn Setup"
authors = ["LabtosoStudios"]
license-file = "../../LICENSE"

[[bin]]
name = "StreynSetup"
path = "src/main.rs"

[dependencies]
miniz_oxide = "0.8"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
miniz_oxide = "0.8"
sha2 = "0.10"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
